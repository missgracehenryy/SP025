/* ===== Chapter 1 lessons ===== */
const C1 = THEORY[1];
C1[0].html = `
<p>Everything around you contains electric <b>charge</b>. There are two kinds: <b>positive</b> (protons) and <b>negative</b> (electrons). Charge is measured in coulombs (C). It is <b>quantised</b>: any charge is a whole-number multiple of the elementary charge e = 1.60 &times; 10<sup>&minus;19</sup> C. Charge is also <b>conserved</b>: it can be moved from one object to another, but never created or destroyed.</p>
<h4>Attraction and repulsion</h4>
<p>Charges push or pull on each other without touching. <b>Like charges repel. Unlike charges attract.</b></p>
${fig(f_forces, "Figure 1.1: The forces between two point charges. The two forces are always equal in size and opposite in direction.")}
<p>Notice in Figure 1.1 that each pair of arrows is the same length. Even if one charge is much bigger than the other, the two forces are equal and opposite. They are a Newton's third law pair.</p>
<h4>Coulomb's law</h4>
<p><b>Coulomb's law</b> states that the magnitude of the electrostatic force between two point charges is <b>directly proportional to the product of the magnitudes of the charges</b> and <b>inversely proportional to the square of the distance</b> between them.</p>
${fx("F=\\dfrac{kq_1q_2}{r^2}||k=\\dfrac{1}{4\\pi\\varepsilon_0}=9.0\\times10^{9}\\ \\text{N m}^2\\,\\text{C}^{-2}||\\varepsilon_0=8.85\\times10^{-12}\\ \\text{C}^2\\,\\text{N}^{-1}\\,\\text{m}^{-2}", "F = kq<sub>1</sub>q<sub>2</sub>/r<sup>2</sup>")}
<p>What the formula tells you:</p>
<ul><li><b>Double one charge</b> and the force doubles. Double both and it becomes 4 times bigger.</li>
<li><b>Double the distance</b> and the force becomes one quarter (2<sup>2</sup> = 4). Triple it and the force becomes one ninth. This is an <b>inverse-square law</b>.</li>
<li>The force acts <b>along the straight line</b> joining the two charges.</li></ul>
<p><b>How to use it:</b> put in the <b>sizes</b> of the charges only (ignore their signs). Then decide the direction separately, using "like repel, unlike attract".</p>
${ex("force between two charges", `<div class="exq"><div class="exh">Question</div><p>A point charge of +3.0 &mu;C is placed 30 cm from a point charge of &minus;2.0 &mu;C.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the magnitude of the electrostatic force between them.</li><li><span class="pl">(b)</span> State whether the force is attractive or repulsive.</li></ol><p class="given">Given: k = 9.0 &times; 10<sup>9</sup> N m<sup>2</sup> C<sup>&minus;2</sup></p></div><div class="exh">Solution</div><p>Convert to SI units first: q<sub>1</sub> = 3.0 &times; 10<sup>&minus;6</sup> C, q<sub>2</sub> = 2.0 &times; 10<sup>&minus;6</sup> C, r = 0.30 m.</p><div class="pl2">(a)</div><div class="calc"><div>F = kq<sub>1</sub>q<sub>2</sub>/r<sup>2</sup></div><div>F = (9.0 &times; 10<sup>9</sup>)(3.0 &times; 10<sup>&minus;6</sup>)(2.0 &times; 10<sup>&minus;6</sup>) / (0.30)<sup>2</sup></div><div><b>F = 0.60 N</b></div></div><div class="pl2">(b)</div><p><b>Attractive</b>, because the charges have opposite signs.</p>`)}
<h4>More than two charges</h4>
<p>When several charges act on one charge, work out each force on its own, as if the others were not there. Then add the forces as <b>vectors</b>. This is the <b>principle of superposition</b>.</p>
${fig(f_superpose, "Figure 1.2: q is repelled by q&#8321; and attracted by q&#8322;. The resultant force is the vector sum of F&#8321; and F&#8322;.")}
<ol><li>Find the size of each force with Coulomb's law.</li>
<li>Draw each force on a diagram, pointing towards or away from the charge that causes it.</li>
<li>Resolve each force into x and y components.</li>
<li>Add the x components, then the y components.</li>
<li>Find the resultant: F = &radic;(F<sub>x</sub><sup>2</sup> + F<sub>y</sub><sup>2</sup>), and its direction from tan &theta; = F<sub>y</sub>/F<sub>x</sub>.</li></ol>
${trap(`Putting the negative sign of a charge into F = kq<sub>1</sub>q<sub>2</sub>/r<sup>2</sup> and then treating the minus sign as a direction. A negative answer only tells you the force is attractive. Always draw the direction on a diagram.`)}
<p class="small muted">Prefixes you will meet: m = 10<sup>&minus;3</sup>, &mu; = 10<sup>&minus;6</sup>, n = 10<sup>&minus;9</sup>, p = 10<sup>&minus;12</sup>. Distances must be in metres.</p>`;

C1[1].html = `
<p>A charge does not need to touch another charge to push or pull it. We say the charge sets up an <b>electric field</b> around it: a region in which another charge experiences an electric force.</p>
<h4>Electric field strength</h4>
<p>To measure the field at a point, imagine placing a very small <b>positive test charge</b> q<sub>0</sub> there and measuring the force on it. <b>Electric field strength</b> at a point is the electric force per unit <b>positive</b> charge at that point.</p>
${fx("E=\\dfrac{F}{q_0}||\\text{point charge: } E=\\dfrac{kQ}{r^2}", "E = F/q<sub>0</sub> &nbsp;&nbsp; point charge: E = kQ/r<sup>2</sup>")}
<ul><li>E is a <b>vector</b>. Its direction is the direction of the force on a <b>positive</b> charge.</li>
<li>Unit: N C<sup>&minus;1</sup> (which is the same as V m<sup>&minus;1</sup>).</li>
<li>For a point charge, divide Coulomb's law by q<sub>0</sub>: E = kQq<sub>0</sub>/(r<sup>2</sup>q<sub>0</sub>) = kQ/r<sup>2</sup>. The field also follows an inverse-square law.</li>
<li>Once you know E, the force on <b>any</b> charge q at that point is F = qE. A negative charge feels a force <b>opposite</b> to E.</li></ul>
${fig(f_radial, "Figure 1.3: Field lines of single point charges. Lines leave positive charges and enter negative charges.")}
<h4>Electric field lines</h4>
<p>Field lines are a picture of the field. Learn these rules:</p>
<ul><li>They start on positive charges and end on negative charges.</li>
<li>The arrow (or the tangent to a curved line) shows the direction of E at that point.</li>
<li>Where lines are <b>closer together</b>, the field is <b>stronger</b>.</li>
<li>Lines <b>never cross</b>, because the field can only have one direction at each point.</li></ul>
${fig(f_dipole, "Figure 1.4: A positive and a negative charge (unlike charges). Lines run from + to &#8722;, and the field between them is strong.")}
${fig(f_like, "Figure 1.5: Two positive charges (like charges). The lines push away from each other. At the neutral point midway between equal charges, E = 0.")}
${fig(f_plates, "Figure 1.6: Between two parallel plates the field lines are parallel and equally spaced, so the field is uniform.")}
${ex("field of a point charge", `<div class="exq"><div class="exh">Question</div><p>A point charge of +5.0 nC is fixed in place. Point P is 0.20 m from the charge.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the electric field strength at P, and state its direction.</li><li><span class="pl">(b)</span> An electron is placed at P. Calculate the force on it, and state its direction.</li></ol><p class="given">Given: k = 9.0 &times; 10<sup>9</sup> N m<sup>2</sup> C<sup>&minus;2</sup>, e = 1.60 &times; 10<sup>&minus;19</sup> C</p></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>E = kQ/r<sup>2</sup></div><div>E = (9.0 &times; 10<sup>9</sup>)(5.0 &times; 10<sup>&minus;9</sup>) / (0.20)<sup>2</sup></div><div><b>E = 1.1 &times; 10<sup>3</sup> N C<sup>&minus;1</sup></b></div></div><p>Direction: <b>away from</b> the charge, because it is positive.</p><div class="pl2">(b)</div><div class="calc"><div>F = eE</div><div>F = (1.60 &times; 10<sup>&minus;19</sup>)(1125)</div><div><b>F = 1.8 &times; 10<sup>&minus;16</sup> N</b></div></div><p>Direction: <b>towards</b> the charge, because the electron is negative.</p>`)}
<h4>Field from several charges</h4>
<p>Fields add as <b>vectors</b>, exactly like forces. Find E from each charge, draw its direction (away from +, towards &minus;), then add the components. Between two like charges there is a point where the fields cancel, called a <b>neutral point</b>.</p>
${trap(`Drawing E towards a positive charge. E always points <b>away</b> from a positive charge and <b>towards</b> a negative charge, whatever charge you later place in the field.`)}`;

C1[2].html = `
<p>Think of lifting a book: you do work against gravity, and the book gains gravitational potential energy. In the same way, pushing a positive charge towards another positive charge needs work, and the charge gains <b>electric potential energy</b>.</p>
<h4>Electric potential</h4>
<p><b>Electric potential</b> at a point is the work done by an external force in bringing a unit positive charge from infinity to that point. At infinity, V = 0.</p>
${fx("V=\\dfrac{kQ}{r}||U=qV=\\dfrac{kq_1q_2}{r}||W=q\\Delta V", "V = kQ/r &nbsp;&nbsp; U = qV = kq<sub>1</sub>q<sub>2</sub>/r &nbsp;&nbsp; W = q&Delta;V")}
<ul><li>Potential is a <b>scalar</b>. Unit: the volt, V = J C<sup>&minus;1</sup>.</li>
<li>In V = kQ/r you <b>keep the sign</b> of Q. Near a positive charge V is positive. Near a negative charge V is negative.</li>
<li>V falls off as 1/r, more slowly than E, which falls off as 1/r<sup>2</sup>.</li></ul>
${fig(f_vr, "Figure 1.7: How potential changes with distance from a positive and a negative point charge. Both approach zero far away.")}
<h4>Potential difference and work</h4>
<p>The <b>potential difference</b> between two points is the work done per unit charge in moving a charge from one point to the other. So the work done on a charge q is W = q&Delta;V.</p>
<ul><li>A positive charge, left alone, moves from <b>high to low</b> potential, like a ball rolling downhill.</li>
<li>An electron, left alone, moves from <b>low to high</b> potential.</li></ul>
<h4>Electric potential energy</h4>
<p>The <b>electric potential energy</b> of a charge at a point is the work done in bringing that charge from infinity to the point: U = qV = kq<sub>1</sub>q<sub>2</sub>/r. A positive U (like charges) means work was needed to push them together. A negative U (unlike charges) means the charges are bound together.</p>
${ex("potential and work", `<div class="exq"><div class="exh">Question</div><p>A point charge of +6.0 nC is fixed in place. Point P is 0.30 m from the charge.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the electric potential at P.</li><li><span class="pl">(b)</span> Calculate the work needed to bring a +2.0 &mu;C charge from infinity to P.</li></ol><p class="given">Given: k = 9.0 &times; 10<sup>9</sup> N m<sup>2</sup> C<sup>&minus;2</sup></p></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>V = kQ/r</div><div>V = (9.0 &times; 10<sup>9</sup>)(6.0 &times; 10<sup>&minus;9</sup>) / 0.30</div><div><b>V = 180 V</b></div></div><div class="pl2">(b)</div><div class="calc"><div>W = qV</div><div>W = (2.0 &times; 10<sup>&minus;6</sup>)(180)</div><div><b>W = 3.6 &times; 10<sup>&minus;4</sup> J</b></div></div>`)}
<h4>Several charges: add potentials as numbers</h4>
<p>Potential is a scalar, so potentials from several charges are simply added, <b>with their signs</b>. There are no components.</p>
<p>Example: +4.0 nC and &minus;4.0 nC are 0.20 m apart. At the midpoint, V = kQ/0.10 &minus; kQ/0.10 = <b>0</b>. But the field there is <b>not</b> zero: both fields point towards the negative charge and add up to 7.2 &times; 10<sup>3</sup> N C<sup>&minus;1</sup>. Zero potential does not mean zero field.</p>
<h4>Equipotential surfaces</h4>
<p>An <b>equipotential surface</b> is a surface on which every point has the same potential.</p>
${fig(f_equi, "Figure 1.8: Equipotentials (dashed) are always perpendicular to the field lines (solid). The field points from higher to lower potential.")}
<ul><li>No work is done moving a charge along an equipotential, because &Delta;V = 0.</li>
<li>Field lines cross equipotentials at <b>right angles</b>, pointing towards <b>lower</b> potential.</li>
<li>Point charge: concentric spheres. Uniform field: parallel, equally spaced planes.</li></ul>
${trap(`Adding potentials as vectors, or ignoring their signs. Potentials are added as ordinary numbers, and a negative charge gives a negative potential.`)}`;

C1[3].html = `
<p>Two parallel metal plates connected to a battery give the simplest field of all: a <b>uniform</b> field, with the same size and direction everywhere between the plates.</p>
<h4>Field strength between plates</h4>
<p>Move a charge q from one plate to the other. The work done is W = qV, and also W = Fd = qEd. Setting these equal gives:</p>
${fx("E=\\dfrac{V}{d}||F=qE||a=\\dfrac{qE}{m}", "E = V/d &nbsp;&nbsp; F = qE &nbsp;&nbsp; a = qE/m")}
<ul><li>E = V/d shows why the unit V m<sup>&minus;1</sup> is the same as N C<sup>&minus;1</sup>.</li>
<li>A bigger voltage, or a smaller gap, gives a stronger field.</li>
<li>Because E is the same everywhere, the force on a charge is the same wherever it is between the plates.</li></ul>
${fig(f_charges_field, "Figure 1.9: In the field, a positive charge is pushed towards the negative plate, and an electron towards the positive plate. A charged oil drop can float when qE balances mg.")}
${ex("field between plates", `<div class="exq"><div class="exh">Question</div><p>Two parallel metal plates are 4.0 mm apart and are connected to a 200 V supply. Calculate the electric field strength between the plates.</p></div><div class="exh">Solution</div><div class="calc"><div>E = V/d</div><div>E = 200 / (4.0 &times; 10<sup>&minus;3</sup>)</div><div><b>E = 5.0 &times; 10<sup>4</sup> V m<sup>&minus;1</sup></b></div></div>`)}
<h4>Moving along the field</h4>
<p>A charge released between the plates accelerates in a straight line with constant acceleration a = qE/m, just like an object falling freely. The work done by the field becomes kinetic energy: <b>qV = &frac12;mv<sup>2</sup></b>.</p>
<p>A proton and an electron feel forces of the same size, because they have the same size of charge. But the electron is about 1800 times lighter, so its acceleration is about 1800 times bigger.</p>
${ex("electron accelerated from rest", `<div class="exq"><div class="exh">Question</div><p>An electron, initially at rest, is accelerated through a potential difference of 100 V. Calculate its final speed.</p><p class="given">Given: e = 1.60 &times; 10<sup>&minus;19</sup> C, m<sub>e</sub> = 9.11 &times; 10<sup>&minus;31</sup> kg</p></div><div class="exh">Solution</div><div class="calc"><div>&frac12;mv<sup>2</sup> = eV</div><div>v = &radic;(2eV/m)</div><div>v = &radic;[(2 &times; 1.60 &times; 10<sup>&minus;19</sup> &times; 100) / (9.11 &times; 10<sup>&minus;31</sup>)]</div><div><b>v = 5.9 &times; 10<sup>6</sup> m s<sup>&minus;1</sup></b></div></div>`)}
<h4>Entering at right angles to the field</h4>
${fig(f_deflect, "Figure 1.10: An electron entering between the plates at right angles to the field follows a parabola, bending towards the positive plate.")}
<p>This is the same as projectile motion. Horizontally there is no force, so the velocity u stays constant: x = ut. Vertically there is a constant force, so y = &frac12;at<sup>2</sup> with a = eE/m. Together these give a <b>parabola</b>. After leaving the plates, the electron travels in a straight line.</p>
${trap(`Giving the electron's force the same direction as E. Electrons are negative, so they are always pushed <b>against</b> the field, towards the positive plate.`)}`;

/* ===== Chapter 2 lessons ===== */
const C2 = THEORY[2];
C2[0].html = `
<p>A <b>capacitor</b> is a device that stores electric charge, and so stores electric potential energy. It is made of two conductors (usually metal plates) separated by a small gap of air or an insulator called a <b>dielectric</b>.</p>
${fig(f_cap, "Figure 2.1: A parallel-plate capacitor connected to a battery. Electrons are pulled off one plate and pushed onto the other, leaving +Q and &#8722;Q.")}
<h4>How a capacitor charges</h4>
<p>When a capacitor is connected to a battery, the battery pulls electrons off one plate and pushes the same number onto the other plate. No charge crosses the gap. One plate ends up with +Q and the other with &minus;Q. The "charge on a capacitor" means Q, the charge on <b>either</b> plate. The total charge is still zero.</p>
<h4>Capacitance</h4>
<p><b>Capacitance</b> is the ratio of the charge on either plate to the potential difference between the plates. It tells you how much charge is stored for every volt.</p>
${fx("C=\\dfrac{Q}{V}", "C = Q/V")}
<ul><li>Unit: the <b>farad</b>, F = C V<sup>&minus;1</sup>. One farad is very large, so you will usually see &mu;F, nF and pF.</li>
<li>1 farad is the capacitance when 1 coulomb is stored on each plate with a potential difference of 1 volt.</li>
<li>C depends only on the capacitor's construction, not on Q or V. Doubling V doubles Q, and C stays the same.</li></ul>
<h4>Capacitors in series</h4>
${fig(f_series, "Figure 2.2: Capacitors in series. The same charge Q is on every capacitor, and the voltages add up.")}
<p>Charge moved onto the first plate induces equal charges along the chain, so <b>every capacitor carries the same charge Q</b>. The battery voltage is shared: V = V<sub>1</sub> + V<sub>2</sub> + V<sub>3</sub>. Since V = Q/C:</p>
${fx("\\dfrac{1}{C_{\\text{eff}}}=\\dfrac{1}{C_1}+\\dfrac{1}{C_2}+\\dfrac{1}{C_3}", "1/C<sub>eff</sub> = 1/C<sub>1</sub> + 1/C<sub>2</sub> + 1/C<sub>3</sub>")}
<p>The effective capacitance in series is always <b>smaller</b> than the smallest capacitor.</p>
<h4>Capacitors in parallel</h4>
${fig(f_parallel, "Figure 2.3: Capacitors in parallel. Each capacitor has the same voltage V, and the charges add up.")}
<p>Each capacitor is connected straight across the battery, so <b>each has the same voltage V</b>. The total charge is Q = Q<sub>1</sub> + Q<sub>2</sub> + Q<sub>3</sub>, which gives:</p>
${fx("C_{\\text{eff}}=C_1+C_2+C_3", "C<sub>eff</sub> = C<sub>1</sub> + C<sub>2</sub> + C<sub>3</sub>")}
${ex("series and parallel", `<div class="exq"><div class="exh">Question</div><p>A 2.0 &mu;F capacitor and a 3.0 &mu;F capacitor are connected to a 10 V supply.</p><ol class="parts"><li><span class="pl">(a)</span> They are connected in <b>series</b>. Calculate the effective capacitance, the charge on each capacitor, and the voltage across each.</li><li><span class="pl">(b)</span> They are connected in <b>parallel</b> instead. Calculate the effective capacitance and the charge on each capacitor.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>1/C<sub>eff</sub> = 1/2.0 + 1/3.0</div><div><b>C<sub>eff</sub> = 1.2 &mu;F</b></div></div><div class="calc"><div>Q = C<sub>eff</sub>V</div><div>Q = 1.2 &mu;F &times; 10 V</div><div><b>Q = 12 &mu;C on each capacitor</b></div></div><div class="calc"><div>V<sub>1</sub> = Q/C<sub>1</sub> = 12/2.0</div><div><b>V<sub>1</sub> = 6.0 V</b></div></div><div class="calc"><div>V<sub>2</sub> = Q/C<sub>2</sub> = 12/3.0</div><div><b>V<sub>2</sub> = 4.0 V</b></div></div><p>Check: 6.0 V + 4.0 V = 10 V.</p><div class="pl2">(b)</div><p>Each capacitor has the full 10 V across it.</p><div class="calc"><div>C<sub>eff</sub> = 2.0 + 3.0</div><div><b>C<sub>eff</sub> = 5.0 &mu;F</b></div></div><div class="calc"><div>Q<sub>1</sub> = C<sub>1</sub>V = 2.0 &times; 10</div><div><b>Q<sub>1</sub> = 20 &mu;C</b></div></div><div class="calc"><div>Q<sub>2</sub> = C<sub>2</sub>V = 3.0 &times; 10</div><div><b>Q<sub>2</sub> = 30 &mu;C</b></div></div>`)}
${trap(`Using the resistor rules. For capacitors it is the other way round: the <b>reciprocal</b> formula is for <b>series</b>, and simple adding is for <b>parallel</b>.`)}
<h4>Energy stored</h4>
<p>As the capacitor charges, each extra bit of charge has to be pushed onto a plate against the growing voltage, so work is done. That work is stored as electric potential energy. On a graph of Q against V, the energy is the <b>area under the line</b>.</p>
${fig(f_qv, "Figure 2.4: Q against V is a straight line through the origin with gradient C. The shaded area is the energy stored.")}
${fx("U=\\tfrac12QV=\\tfrac12CV^2=\\dfrac{Q^2}{2C}", "U = &frac12;QV = &frac12;CV<sup>2</sup> = Q<sup>2</sup>/2C")}
${ex("energy stored", `<div class="exq"><div class="exh">Question</div><p>A 470 &mu;F capacitor is charged to a potential difference of 12 V. Calculate the energy stored in it.</p></div><div class="exh">Solution</div><div class="calc"><div>U = &frac12;CV<sup>2</sup></div><div>U = &frac12;(470 &times; 10<sup>&minus;6</sup>)(12)<sup>2</sup></div><div><b>U = 3.4 &times; 10<sup>&minus;2</sup> J</b></div></div>`)}`;

C2[1].html = `
<p>A capacitor connected through a resistor does not charge instantly. The resistor limits the current, so the charge builds up gradually. Discharging is gradual in the same way.</p>
${fig(f_rc, "Figure 2.5: An RC circuit. With the switch at A, the battery charges C through R. At B, C discharges through R.")}
<h4>Charging (switch at A)</h4>
<ol><li>At the instant the switch closes, the capacitor is empty, so V<sub>C</sub> = 0. All of the battery voltage is across R, and the current is at its <b>maximum</b>: I<sub>0</sub> = &epsilon;/R.</li>
<li>As charge builds up, V<sub>C</sub> grows. It opposes the battery, so the voltage across R gets smaller and the <b>current decreases</b>.</li>
<li>When V<sub>C</sub> equals the battery voltage, there is no voltage left across R. The current is <b>zero</b> and the capacitor is <b>fully charged</b>, with Q<sub>0</sub> = C&epsilon;.</li></ol>
<h4>Discharging (switch at B)</h4>
<ol><li>At the start V<sub>C</sub> is at its maximum, so the current I<sub>0</sub> = V<sub>0</sub>/R is at its maximum. It flows in the <b>opposite direction</b> to the charging current.</li>
<li>As charge leaves the plates, V<sub>C</sub> falls, so the current falls too, until both reach zero.</li></ol>
${fig(f_rcgraphs, "Figure 2.6: Charging and discharging graphs. All the curves are exponential, and the time constant &#964; is marked on each.")}
${fx("\\tau=RC||\\text{charging: } Q=Q_0\\left(1-e^{-t/RC}\\right)||\\text{discharging: } Q=Q_0e^{-t/RC}||I=I_0e^{-t/RC}", "&tau; = RC &nbsp;&nbsp; charging: Q = Q<sub>0</sub>(1 &minus; e<sup>&minus;t/RC</sup>) &nbsp;&nbsp; discharging: Q = Q<sub>0</sub>e<sup>&minus;t/RC</sup> &nbsp;&nbsp; I = I<sub>0</sub>e<sup>&minus;t/RC</sup>")}
<p>V across the capacitor follows the same shape as Q, because V = Q/C. The current always decays as I<sub>0</sub>e<sup>&minus;t/RC</sup>, whether charging or discharging.</p>
<h4>The time constant</h4>
<ul><li>&tau; = RC has the unit of time: &Omega; &times; F = (V/A) &times; (C/V) = C/A = s.</li>
<li><b>Charging:</b> &tau; is the time for the charge (or V<sub>C</sub>) to reach <b>63%</b> of its final value, because 1 &minus; e<sup>&minus;1</sup> = 0.63.</li>
<li><b>Discharging:</b> &tau; is the time for the charge to fall to <b>37%</b> of its starting value, because e<sup>&minus;1</sup> = 0.37.</li>
<li>A bigger R or a bigger C gives a bigger &tau;, so charging and discharging are slower. After about 5&tau;, the process is practically complete.</li></ul>
${ex("charging a capacitor", `<div class="exq"><div class="exh">Question</div><p>An uncharged 47 &mu;F capacitor is charged through a 100 k&Omega; resistor from a 9.0 V battery.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the time constant.</li><li><span class="pl">(b)</span> Calculate the current at the instant the switch is closed.</li><li><span class="pl">(c)</span> Calculate the voltage across the capacitor and the current after one time constant.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>&tau; = RC</div><div>&tau; = (100 &times; 10<sup>3</sup>)(47 &times; 10<sup>&minus;6</sup>)</div><div><b>&tau; = 4.7 s</b></div></div><div class="pl2">(b)</div><div class="calc"><div>I<sub>0</sub> = V<sub>0</sub>/R</div><div>I<sub>0</sub> = 9.0 / (100 &times; 10<sup>3</sup>)</div><div><b>I<sub>0</sub> = 9.0 &times; 10<sup>&minus;5</sup> A</b></div></div><div class="pl2">(c)</div><p>At t = &tau;, the exponent t/RC = 1.</p><div class="calc"><div>V<sub>C</sub> = V<sub>0</sub>(1 &minus; e<sup>&minus;t/RC</sup>)</div><div>V<sub>C</sub> = 9.0(1 &minus; e<sup>&minus;1</sup>)</div><div><b>V<sub>C</sub> = 5.7 V</b></div></div><div class="calc"><div>I = I<sub>0</sub>e<sup>&minus;t/RC</sup></div><div>I = (9.0 &times; 10<sup>&minus;5</sup>)e<sup>&minus;1</sup></div><div><b>I = 3.3 &times; 10<sup>&minus;5</sup> A</b></div></div>`)}
${trap(`Forgetting to convert k&Omega; and &mu;F before working out RC, or leaving t in minutes. Use ohms, farads and seconds.`)}`;

C2[2].html = `
<p>A <b>dielectric</b> is an insulating (non-conducting) material, such as paper, plastic, mica or ceramic, placed between the plates of a capacitor. Putting a dielectric in <b>increases the capacitance</b>.</p>
<h4>Capacitance of a parallel-plate capacitor</h4>
${fx("\\text{air: } C_0=\\dfrac{\\varepsilon_0A}{d}||\\text{with dielectric: } C=\\dfrac{\\varepsilon_r\\varepsilon_0A}{d}=\\varepsilon_rC_0", "air: C<sub>0</sub> = &epsilon;<sub>0</sub>A/d &nbsp;&nbsp; with dielectric: C = &epsilon;<sub>r</sub>&epsilon;<sub>0</sub>A/d = &epsilon;<sub>r</sub>C<sub>0</sub>")}
<ul><li>A <b>bigger plate area A</b> gives a bigger C: there is more room for charge.</li>
<li>A <b>smaller separation d</b> gives a bigger C.</li>
<li>A dielectric with a <b>bigger &epsilon;<sub>r</sub></b> gives a bigger C.</li></ul>
<h4>Why a dielectric increases C</h4>
${fig(f_dielectric, "Figure 2.7: The molecules of the dielectric become small dipoles that line up with the field. Their charges at the surfaces of the dielectric oppose the plate charges, so the field inside is weaker.")}
<p>The field between the plates <b>polarises</b> the dielectric: its molecules become tiny dipoles, with their negative ends towards the positive plate. Along the surfaces of the dielectric this leaves a layer of negative charge next to the positive plate, and positive charge next to the negative plate. These induced charges create a field in the opposite direction, so the total field inside drops from E<sub>0</sub> to E. For the same charge Q, a weaker field means a smaller V, and C = Q/V is larger.</p>
<p>The <b>dielectric constant</b> (relative permittivity) &epsilon;<sub>r</sub> is the ratio of the permittivity of the material to the permittivity of free space. It has <b>no unit</b> and is always greater than 1 (air is about 1).</p>
${fx("\\varepsilon_r=\\dfrac{\\varepsilon}{\\varepsilon_0}=\\dfrac{C}{C_0}=\\dfrac{V_0}{V}=\\dfrac{E_0}{E}", "&epsilon;<sub>r</sub> = &epsilon;/&epsilon;<sub>0</sub> = C/C<sub>0</sub> = V<sub>0</sub>/V = E<sub>0</sub>/E")}
<h4>Two situations to compare</h4>
<table class="cmp"><tr><th>Dielectric inserted...</th><th>Q</th><th>V</th><th>E</th><th>C</th><th>U</th></tr>
<tr><td>after the battery is <b>disconnected</b></td><td>stays the same</td><td>decreases</td><td>decreases</td><td>increases</td><td>decreases</td></tr>
<tr><td>while still <b>connected</b> to the battery</td><td>increases</td><td>stays the same</td><td>stays the same</td><td>increases</td><td>increases</td></tr></table>
<p>With the battery disconnected, the charge has nowhere to go, so Q is fixed. With the battery connected, the battery holds V fixed and pushes more charge on.</p>
<h4>Advantages of a dielectric</h4>
<ul><li>It increases the capacitance.</li>
<li>It allows a higher working voltage before a spark jumps between the plates.</li>
<li>It holds the plates apart, so they can be very close without touching.</li></ul>
${ex("adding a dielectric", `<div class="exq"><div class="exh">Question</div><p>An air-filled parallel-plate capacitor has plates of area 0.010 m<sup>2</sup> separated by 1.0 mm.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate its capacitance.</li><li><span class="pl">(b)</span> The gap is filled with a dielectric of dielectric constant 4.0. Calculate the new capacitance.</li><li><span class="pl">(c)</span> Before the dielectric was inserted, the capacitor was charged to 100 V and then disconnected. Calculate the voltage after the dielectric is inserted.</li></ol><p class="given">Given: &epsilon;<sub>0</sub> = 8.85 &times; 10<sup>&minus;12</sup> F m<sup>&minus;1</sup></p></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>C<sub>0</sub> = &epsilon;<sub>0</sub>A/d</div><div>C<sub>0</sub> = (8.85 &times; 10<sup>&minus;12</sup>)(0.010) / (1.0 &times; 10<sup>&minus;3</sup>)</div><div><b>C<sub>0</sub> = 8.9 &times; 10<sup>&minus;11</sup> F (89 pF)</b></div></div><div class="pl2">(b)</div><div class="calc"><div>C = &epsilon;<sub>r</sub>C<sub>0</sub></div><div>C = 4.0 &times; 8.9 &times; 10<sup>&minus;11</sup></div><div><b>C = 3.5 &times; 10<sup>&minus;10</sup> F</b></div></div><div class="pl2">(c)</div><p>The capacitor is disconnected, so Q stays the same and V falls by the factor &epsilon;<sub>r</sub>.</p><div class="calc"><div>V = V<sub>0</sub>/&epsilon;<sub>r</sub></div><div>V = 100/4.0</div><div><b>V = 25 V</b></div></div>`)}
${trap(`Assuming the charge always stays the same. It only stays the same when the capacitor is <b>disconnected</b>. Read the question carefully.`)}`;

/* lessons */
C3[0].html = `
<p>An electric current is a flow of charge. In a metal wire, the charges that move are <b>free electrons</b>: the outer electrons of the metal atoms, which are not tied to any one atom.</p>
<h4>The microscopic model</h4>
${fig(f3_drift, "Figure 3.1: Free electrons in a metal. Without a field they move randomly and there is no net flow. With a field, they slowly drift opposite to E at the drift velocity v<sub>d</sub>.")}
<ul><li>With <b>no electric field</b>, the free electrons move randomly in all directions at high speed. For every electron going one way, another goes the other way, so there is <b>no net flow</b> of charge.</li>
<li>When a potential difference is applied, it sets up an electric field E inside the wire. The force F = eE pushes every electron <b>opposite to E</b>.</li>
<li>The electrons still move randomly, but now they also drift slowly along the wire. Their average velocity along the wire is the <b>drift velocity v<sub>d</sub></b>. It is very small, typically less than 1 mm s<sup>&minus;1</sup>.</li></ul>
<p>A lamp lights instantly even though the electrons drift so slowly, because the field travels through the whole wire almost at the speed of light, and all the free electrons start drifting together.</p>
<h4>Electric current</h4>
<p><b>Electric current</b> is defined as the <b>rate of flow of charge</b>.</p>
${fx("I=\\dfrac{dQ}{dt}||Q=ne", "I = dQ/dt &nbsp;&nbsp; Q = ne")}
<ul><li>Current is a scalar. Its unit is the ampere (A). <b>1 A</b> is a flow of 1 coulomb of charge past a point every second.</li>
<li>If n electrons pass a point, the charge is Q = ne, with e = 1.60 &times; 10<sup>&minus;19</sup> C.</li>
<li>Current is measured with an <b>ammeter connected in series</b>.</li>
<li>A current flows only while there is a potential difference, just as water flows in a pipe only when one end is higher than the other.</li></ul>
${fig(f3_dir, "Figure 3.2: Conventional current flows from the positive terminal round to the negative terminal. Electrons actually flow the opposite way.")}
${ex("charge and number of electrons", `<div class="exq"><div class="exh">Question</div><p>A steady current of 0.80 A flows in a wire for 5.0 minutes.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the charge that passes a point in the wire.</li><li><span class="pl">(b)</span> Calculate the number of electrons that pass that point.</li></ol><p class="given">Given: e = 1.60 &times; 10<sup>&minus;19</sup> C</p></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>Q = It</div><div>Q = 0.80 &times; (5.0 &times; 60)</div><div><b>Q = 240 C</b></div></div><div class="pl2">(b)</div><div class="calc"><div>n = Q/e</div><div>n = 240 / (1.60 &times; 10<sup>&minus;19</sup>)</div><div><b>n = 1.5 &times; 10<sup>21</sup> electrons</b></div></div>`)}
${trap(`Forgetting to change minutes into seconds. The ampere is coulombs per <b>second</b>.`)}`;

C3[1].html = `
<h4>Ohm's law</h4>
<p><b>Ohm's law</b> states that the potential difference across a conductor is <b>directly proportional</b> to the current flowing through it, <b>provided its temperature and other physical conditions stay constant</b>.</p>
${fx("V=IR||R=\\dfrac{V}{I}", "V = IR &nbsp;&nbsp; R = V/I")}
<p><b>Resistance</b> is the ratio of the potential difference across a component to the current through it. It measures how much the component opposes the current. Unit: the ohm (&Omega;).</p>
${fig(f3_vi, "Figure 3.3: An ohmic conductor gives a straight line through the origin. A filament lamp does not obey Ohm's law, because it gets hotter and its resistance rises.")}
<ul><li>A conductor that obeys Ohm's law (constant R over a wide range of voltage) is called <b>ohmic</b>.</li>
<li>For an ohmic conductor, the gradient of the V&ndash;I graph is the resistance R.</li>
<li>The condition "constant temperature" matters. A filament lamp heats up as the current increases, so its resistance increases and its graph curves.</li></ul>
<h4>What does resistance depend on?</h4>
${fig(f3_wire, "Figure 3.4: A wire of length l and cross-sectional area A, made of a material of resistivity &#961;.")}
${fx("R=\\dfrac{\\rho l}{A}||\\rho=\\dfrac{RA}{l}", "R = &rho;l/A &nbsp;&nbsp; &rho; = RA/l")}
<ul><li><b>Longer wire, more resistance</b> (R &prop; l): electrons have further to travel through the material.</li>
<li><b>Thicker wire, less resistance</b> (R &prop; 1/A): there are more paths side by side for the electrons.</li>
<li>The material matters through its <b>resistivity &rho;</b>.</li></ul>
<p><b>Resistivity</b> is the resistance of a sample of the material with unit length and unit cross-sectional area. Its unit is the <b>ohm metre (&Omega; m)</b>. Resistivity depends only on the <b>material and its temperature</b>, not on the shape of the wire. Good conductors such as copper (1.7 &times; 10<sup>&minus;8</sup> &Omega; m) have very small resistivities. Insulators such as glass (10<sup>10</sup> to 10<sup>14</sup> &Omega; m) have very large ones.</p>
${ex("resistivity from measurements", `<div class="exq"><div class="exh">Question</div><p>A wire is 1.2 m long and has a cross-sectional area of 2.0 &times; 10<sup>&minus;7</sup> m<sup>2</sup>. When a potential difference of 0.60 V is applied across it, the current is 0.50 A.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the resistance of the wire.</li><li><span class="pl">(b)</span> Calculate the resistivity of the material.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>R = V/I</div><div>R = 0.60/0.50</div><div><b>R = 1.2 &Omega;</b></div></div><div class="pl2">(b)</div><div class="calc"><div>&rho; = RA/l</div><div>&rho; = (1.2)(2.0 &times; 10<sup>&minus;7</sup>) / 1.2</div><div><b>&rho; = 2.0 &times; 10<sup>&minus;7</sup> &Omega; m</b></div></div>`)}
${trap(`Mixing up resistance and resistivity. Cutting a wire in half halves its <b>resistance</b>, but its <b>resistivity</b> stays the same, because it is still the same material. Also convert mm<sup>2</sup> to m<sup>2</sup>: 1 mm<sup>2</sup> = 1.0 &times; 10<sup>&minus;6</sup> m<sup>2</sup>.`)}`;

C3[2].html = `
<p>The resistance of a <b>metal always increases</b> when its temperature increases. To see why, go back to the microscopic model.</p>
<ol><li>The metal is a lattice of positive ions, with free electrons drifting between them.</li>
<li>When the metal is heated, the ions <b>vibrate with a larger amplitude</b>.</li>
<li>The drifting electrons now <b>collide with the ions more often</b>.</li>
<li>These collisions hinder the drift of the electrons, so for the same voltage less current flows. The <b>resistance increases</b>.</li></ol>
${fig(f3_rt, "Figure 3.5: Over a limited range, the resistance of a metal increases linearly with temperature.")}
<p>Over a limited range of temperature, resistivity and resistance increase approximately <b>linearly</b> with temperature:</p>
${fx("\\rho=\\rho_0\\left[1+\\alpha\\left(T-T_0\\right)\\right]||R=R_0\\left[1+\\alpha\\left(T-T_0\\right)\\right]||\\alpha=\\dfrac{1}{\\rho_0}\\dfrac{\\Delta\\rho}{\\Delta T}", "&rho; = &rho;<sub>0</sub>[1 + &alpha;(T &minus; T<sub>0</sub>)] &nbsp;&nbsp; R = R<sub>0</sub>[1 + &alpha;(T &minus; T<sub>0</sub>)]")}
<ul><li>R<sub>0</sub> (or &rho;<sub>0</sub>) is the value at the reference temperature T<sub>0</sub>, usually 20 &deg;C.</li>
<li>&alpha; is the <b>temperature coefficient of resistivity</b>: the fractional increase in resistivity for each degree rise in temperature. Its unit is &deg;C<sup>&minus;1</sup>.</li>
<li>For metals, &alpha; is positive. That is why R increases with T.</li></ul>
${ex("hot copper wire", `<div class="exq"><div class="exh">Question</div><p>A copper coil has a resistance of 5.0 &Omega; at 20 &deg;C. Calculate its resistance at 80 &deg;C.</p><p class="given">Given: temperature coefficient of resistivity of copper, &alpha; = 3.9 &times; 10<sup>&minus;3</sup> &deg;C<sup>&minus;1</sup></p></div><div class="exh">Solution</div><div class="calc"><div>R = R<sub>0</sub>[1 + &alpha;(T &minus; T<sub>0</sub>)]</div><div>R = 5.0[1 + (3.9 &times; 10<sup>&minus;3</sup>)(80 &minus; 20)]</div><div>R = 5.0 &times; 1.234</div><div><b>R = 6.2 &Omega;</b></div></div>`)}
${ex("finding a temperature", `<div class="exq"><div class="exh">Question</div><p>A tungsten lamp filament has a resistance of 15 &Omega; at 20 &deg;C. When the lamp is lit, its resistance is 190 &Omega;. Calculate the temperature of the filament when lit.</p><p class="given">Given: &alpha; for tungsten = 4.5 &times; 10<sup>&minus;3</sup> &deg;C<sup>&minus;1</sup></p></div><div class="exh">Solution</div><div class="calc"><div>190 = 15[1 + (4.5 &times; 10<sup>&minus;3</sup>)(T &minus; 20)]</div><div>190/15 = 1 + (4.5 &times; 10<sup>&minus;3</sup>)(T &minus; 20)</div><div>T &minus; 20 = (12.67 &minus; 1) / (4.5 &times; 10<sup>&minus;3</sup>)</div><div>T &minus; 20 = 2593</div><div><b>T = 2.6 &times; 10<sup>3</sup> &deg;C</b></div></div>`)}
${trap(`Using T instead of the temperature <b>change</b> (T &minus; T<sub>0</sub>) inside the bracket.`)}`;

C3[3].html = `
<p>A battery is not perfect. Some of the energy it gives to the charges is used up inside the battery itself, because the chemicals inside have resistance.</p>
${fig(f3_emf, "Figure 3.6: A real battery behaves like an ideal emf &#949; in series with an internal resistance r. The voltmeter reads the terminal potential difference V.")}
<h4>Three definitions</h4>
<ul><li><b>Electromotive force (emf), &epsilon;</b>: the energy supplied by the source to each unit charge that flows through the <b>whole</b> circuit, the external and internal resistances. Despite its name, it is not a force. Unit: volt.</li>
<li><b>Terminal potential difference, V</b>: the work done in moving a unit charge through the <b>external</b> resistance only. Unit: volt.</li>
<li><b>Internal resistance, r</b>: the resistance of the chemicals inside the battery, between its terminals.</li></ul>
<h4>Lost volts</h4>
<p>Each coulomb gets &epsilon; joules from the battery. Some of this, Ir, is used to push it through the internal resistance (the "lost volts"). The rest, V, is delivered to the external circuit:</p>
${fx("\\varepsilon=V+Ir||V=\\varepsilon-Ir||I=\\dfrac{\\varepsilon}{R+r}", "&epsilon; = V + Ir &nbsp;&nbsp; V = &epsilon; &minus; Ir &nbsp;&nbsp; I = &epsilon;/(R + r)")}
${fig(f3_vt, "Figure 3.7: As the current increases, the terminal p.d. falls. The intercept is &#949; and the gradient is &#8722;r.")}
<ul><li>V is less than &epsilon; whenever a current flows.</li>
<li>V = &epsilon; only when <b>no current</b> flows (an open circuit).</li>
<li>The smaller r is, the more current and power the battery can deliver. A car battery has a very small r, so it can supply the large current needed to start the engine.</li></ul>
<h4>Factors affecting internal resistance</h4>
<ul><li>The type and concentration of the chemicals (electrolyte) in the cell.</li>
<li>The temperature of the cell.</li>
<li>The distance between the electrodes, and their size.</li>
<li>The age of the cell: as a battery is used up and its electrolyte dries out, r increases.</li></ul>
${ex("terminal voltage", `<div class="exq"><div class="exh">Question</div><p>A battery of emf 9.0 V and internal resistance 0.50 &Omega; is connected to a 4.0 &Omega; resistor.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the current in the circuit.</li><li><span class="pl">(b)</span> Calculate the terminal potential difference of the battery.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>I = &epsilon;/(R + r)</div><div>I = 9.0/(4.0 + 0.50)</div><div><b>I = 2.0 A</b></div></div><div class="pl2">(b)</div><div class="calc"><div>V = &epsilon; &minus; Ir</div><div>V = 9.0 &minus; (2.0 &times; 0.50)</div><div><b>V = 8.0 V</b></div></div><p>The "lost volts" inside the battery are Ir = 1.0 V.</p>`)}
${trap(`Calling the voltmeter reading across a working battery its emf. That reading is the terminal p.d. It equals the emf only when no current flows.`)}`;

C3[4].html = `
<p>Real circuits contain several resistors. You can replace any combination of them with one <b>effective resistance</b> R<sub>eff</sub> that draws the same current from the supply.</p>
<h4>Series</h4>
${fig(f3_series, "Figure 3.8: Resistors in series. There is only one path, so the same current flows through each resistor.")}
<p>There is only one path, so the <b>same current I</b> flows through every resistor. The supply voltage is <b>shared</b>: V = V<sub>1</sub> + V<sub>2</sub> + V<sub>3</sub>. Writing each as IR and cancelling I gives:</p>
${fx("R_{\\text{eff}}=R_1+R_2+R_3+\\cdots", "R<sub>eff</sub> = R<sub>1</sub> + R<sub>2</sub> + R<sub>3</sub> + ...")}
<p>R<sub>eff</sub> in series is always <b>larger</b> than the largest resistor.</p>
<h4>Parallel</h4>
${fig(f3_par, "Figure 3.9: Resistors in parallel. Each resistor is connected directly across the supply, so each has the same voltage.")}
<p>Each resistor is connected across the same two points, so each has the <b>same voltage V</b>. The current <b>splits</b>: I = I<sub>1</sub> + I<sub>2</sub> + I<sub>3</sub>. Writing each as V/R and cancelling V gives:</p>
${fx("\\dfrac{1}{R_{\\text{eff}}}=\\dfrac{1}{R_1}+\\dfrac{1}{R_2}+\\dfrac{1}{R_3}+\\cdots", "1/R<sub>eff</sub> = 1/R<sub>1</sub> + 1/R<sub>2</sub> + 1/R<sub>3</sub> + ...")}
<p>R<sub>eff</sub> in parallel is always <b>smaller</b> than the smallest resistor, because each extra branch gives the current another path.</p>
<table class="cmp"><tr><th></th><th>Series</th><th>Parallel</th></tr>
<tr><td>Same for every resistor</td><td>current I</td><td>voltage V</td></tr>
<tr><td>Shared between resistors</td><td>voltage: V = V<sub>1</sub> + V<sub>2</sub> + ...</td><td>current: I = I<sub>1</sub> + I<sub>2</sub> + ...</td></tr>
<tr><td>R<sub>eff</sub></td><td>bigger than the largest</td><td>smaller than the smallest</td></tr></table>
${ex("a mixed circuit", `<div class="exq"><div class="exh">Question</div><p>A 6.0 &Omega; resistor and a 3.0 &Omega; resistor are connected in parallel. This pair is connected in series with a 4.0 &Omega; resistor across a 12 V supply of negligible internal resistance.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the effective resistance of the circuit.</li><li><span class="pl">(b)</span> Calculate the current from the supply.</li><li><span class="pl">(c)</span> Calculate the current in the 6.0 &Omega; and 3.0 &Omega; resistors.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>1/R<sub>p</sub> = 1/6.0 + 1/3.0</div><div><b>R<sub>p</sub> = 2.0 &Omega;</b></div></div><div class="calc"><div>R<sub>eff</sub> = 2.0 + 4.0</div><div><b>R<sub>eff</sub> = 6.0 &Omega;</b></div></div><div class="pl2">(b)</div><div class="calc"><div>I = V/R<sub>eff</sub></div><div>I = 12/6.0</div><div><b>I = 2.0 A</b></div></div><div class="pl2">(c)</div><div class="calc"><div>V<sub>p</sub> = IR<sub>p</sub></div><div>V<sub>p</sub> = 2.0 &times; 2.0</div><div><b>V<sub>p</sub> = 4.0 V</b></div></div><div class="calc"><div>I<sub>6</sub> = 4.0/6.0</div><div><b>I<sub>6</sub> = 0.67 A</b></div></div><div class="calc"><div>I<sub>3</sub> = 4.0/3.0</div><div><b>I<sub>3</sub> = 1.3 A</b></div></div><p>Check: 0.67 A + 1.3 A = 2.0 A.</p>`)}
${trap(`Forgetting the last step in the parallel formula. 1/R<sub>eff</sub> = 0.5 means R<sub>eff</sub> = 2 &Omega;, not 0.5 &Omega;. Turn the answer upside down.`)}`;

C3[5].html = `
<p>Some circuits cannot be simplified into series and parallel parts, for example when there are batteries in different branches. For these we use <b>Kirchhoff's two rules</b>.</p>
<h4>First rule: the junction rule</h4>
${fig(f3_junction, "Figure 3.10: At a junction, the total current flowing in equals the total current flowing out.")}
<p>The sum of the currents entering any junction equals the sum of the currents leaving it: &Sigma;I<sub>in</sub> = &Sigma;I<sub>out</sub>. This is <b>conservation of charge</b>: charge cannot pile up at a junction or disappear.</p>
<h4>Second rule: the loop rule</h4>
<p>In any closed loop, the sum of the emfs equals the sum of the IR products: &Sigma;&epsilon; = &Sigma;IR. This is <b>conservation of energy</b>: the energy a charge gains from the batteries around a loop equals the energy it gives up in the resistors.</p>
${fx("\\Sigma I_{\\text{in}}=\\Sigma I_{\\text{out}}||\\Sigma\\varepsilon=\\Sigma IR", "&Sigma;I<sub>in</sub> = &Sigma;I<sub>out</sub> &nbsp;&nbsp; &Sigma;&epsilon; = &Sigma;IR")}
<h4>Sign rules when you go round a loop</h4>
<table class="cmp"><tr><th>Going through...</th><th>in the same direction as...</th><th>sign</th></tr>
<tr><td>a battery, from &minus; to +</td><td>its emf</td><td>+&epsilon;</td></tr>
<tr><td>a battery, from + to &minus;</td><td>against its emf</td><td>&minus;&epsilon;</td></tr>
<tr><td>a resistor</td><td>the assumed current</td><td>+IR</td></tr>
<tr><td>a resistor</td><td>against the assumed current</td><td>&minus;IR</td></tr></table>
<h4>Step by step</h4>
<ol><li>Mark each emf (from the &minus; terminal to the + terminal).</li>
<li>Choose a direction for the current in each branch. Resistors in the same branch carry the same current.</li>
<li>Apply the junction rule at one junction.</li>
<li>Choose a direction for going round each loop, and apply the loop rule (at most two loops).</li>
<li>Solve the equations simultaneously (EQN mode on your calculator).</li>
<li>A <b>negative</b> answer means that current flows the opposite way to what you assumed. The size is still correct.</li></ol>
${fig(f3_loop2, "Figure 3.11: A two-loop circuit. The currents I&#8321;, I&#8322; and I&#8323; are the directions we assume before solving.")}
${ex("two loops", `<div class="exq"><div class="exh">Question</div><p>Refer to the circuit in Figure 3.11. The batteries have negligible internal resistance. Calculate the currents I<sub>1</sub>, I<sub>2</sub> and I<sub>3</sub>, and state the actual direction of each.</p></div><div class="exh">Solution</div><p>Junction rule (top junction):</p><div class="calc"><div><b>I<sub>3</sub> = I<sub>1</sub> + I<sub>2</sub></b></div></div><p>Loop rule:</p><div class="calc"><div>Loop 1: 12 = 2I<sub>1</sub> + 6I<sub>3</sub></div><div><b>Loop 2: 6 = 4I<sub>2</sub> + 6I<sub>3</sub></b></div></div><p>Solving the three equations together:</p><div class="calc"><div>I<sub>1</sub> = 1.91 A</div><div>I<sub>2</sub> = &minus;0.545 A</div><div><b>I<sub>3</sub> = 1.36 A</b></div></div><p>I<sub>1</sub> and I<sub>3</sub> flow in the directions shown. I<sub>2</sub> is negative, so 0.545 A actually flows <b>down</b> through the 6 V battery: the 12 V battery is charging it.</p><p>Check with loop 1:</p><div class="calc"><div>2I<sub>1</sub> + 6I<sub>3</sub> = 2(1.91) + 6(1.36)</div><div><b>2I<sub>1</sub> + 6I<sub>3</sub> = 12.0 V (correct)</b></div></div>`)}
${trap(`Getting the sign of an emf wrong. Decide the sign by the way <b>you</b> cross the battery, not by the way the current flows.`)}`;

C3[6].html = `
<p>When charge flows through a device, the electrical energy it carries is changed into other forms: heat in a kettle, light in a lamp, kinetic energy in a motor.</p>
<h4>Electrical energy</h4>
<p>A charge Q moving through a potential difference V transfers energy W = QV. Since Q = It:</p>
${fx("W=IVt||W=I^2Rt=\\dfrac{V^2}{R}t", "W = IVt &nbsp;&nbsp; W = I<sup>2</sup>Rt = (V<sup>2</sup>/R)t")}
<p>For a resistor, which changes all of its electrical energy into heat, W = I<sup>2</sup>Rt gives the <b>heat produced</b>. Unit: joule (J).</p>
<h4>Power</h4>
<p><b>Power</b> is the rate at which electrical energy is transferred.</p>
${fx("P=\\dfrac{W}{t}=IV||P=I^2R=\\dfrac{V^2}{R}", "P = W/t = IV = I<sup>2</sup>R = V<sup>2</sup>/R")}
<ul><li>Unit: watt (W), where 1 W = 1 J s<sup>&minus;1</sup>.</li>
<li>Use P = I<sup>2</sup>R when you know the current (for example, resistors in series). Use P = V<sup>2</sup>/R when you know the voltage (for example, resistors in parallel).</li>
<li>Inside a battery, power &epsilon;I is produced from chemical energy. I<sup>2</sup>r of it is wasted as heat in the internal resistance, and the rest, VI, goes to the external circuit.</li></ul>
${ex("energy in a circuit", `<div class="exq"><div class="exh">Question</div><p>A battery of emf 12 V and internal resistance 1.0 &Omega; is connected to a 5.0 &Omega; resistor for 10 minutes.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the current.</li><li><span class="pl">(b)</span> Calculate the power produced by the battery, the power lost inside it, and the power delivered to the resistor.</li><li><span class="pl">(c)</span> Calculate the heat produced in the resistor in 10 minutes.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>I = &epsilon;/(R + r)</div><div>I = 12/(5.0 + 1.0)</div><div><b>I = 2.0 A</b></div></div><div class="pl2">(b)</div><div class="calc"><div>P<sub>battery</sub> = &epsilon;I</div><div>P<sub>battery</sub> = 12 &times; 2.0</div><div><b>P<sub>battery</sub> = 24 W</b></div></div><div class="calc"><div>P<sub>lost</sub> = I<sup>2</sup>r</div><div>P<sub>lost</sub> = (2.0)<sup>2</sup> &times; 1.0</div><div><b>P<sub>lost</sub> = 4.0 W</b></div></div><div class="calc"><div>P<sub>R</sub> = I<sup>2</sup>R</div><div>P<sub>R</sub> = (2.0)<sup>2</sup> &times; 5.0</div><div><b>P<sub>R</sub> = 20 W</b></div></div><div class="pl2">(c)</div><div class="calc"><div>W = Pt</div><div>W = 20 &times; (10 &times; 60)</div><div><b>W = 1.2 &times; 10<sup>4</sup> J</b></div></div>`)}

C3[7].html = `
<p>Often a circuit needs a smaller voltage than the supply provides. A <b>potential divider</b> gets it by connecting two or more resistors <b>in series</b> across the supply.</p>
${fig(f3_divider, "Figure 3.12: A potential divider. The output voltage is taken across R&#8322;.")}
<h4>The principle</h4>
<p>The resistors are in series, so the same current flows through each: I = V/(R<sub>1</sub> + R<sub>2</sub>). The voltage across each resistor is IR, so the supply voltage is <b>shared in the ratio of the resistances</b>. The larger resistor gets the larger share.</p>
${fx("V_1=\\left(\\dfrac{R_1}{R_1+R_2}\\right)V||V_2=\\left(\\dfrac{R_2}{R_1+R_2}\\right)V", "V<sub>1</sub> = [R<sub>1</sub>/(R<sub>1</sub> + R<sub>2</sub>)]V &nbsp;&nbsp; V<sub>2</sub> = [R<sub>2</sub>/(R<sub>1</sub> + R<sub>2</sub>)]V")}
<p>With three resistors, the same idea gives V<sub>1</sub> = [R<sub>1</sub>/(R<sub>1</sub> + R<sub>2</sub> + R<sub>3</sub>)]V. Put simply: <b>ratio of voltages = ratio of resistances</b>.</p>
<p>A uniform resistance wire also works as a divider, because R &prop; l. Tapping it at a point gives V<sub>1</sub>/V = l<sub>1</sub>/(l<sub>1</sub> + l<sub>2</sub>).</p>
${ex("output voltage, and the effect of a load", `<div class="exq"><div class="exh">Question</div><p>Resistors R<sub>1</sub> = 1.0 k&Omega; and R<sub>2</sub> = 3.0 k&Omega; are connected in series across a 12 V supply. The output voltage is taken across R<sub>2</sub>.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the output voltage.</li><li><span class="pl">(b)</span> A 3.0 k&Omega; load is connected across the output. Calculate the new output voltage.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>V<sub>out</sub> = [R<sub>2</sub>/(R<sub>1</sub> + R<sub>2</sub>)]V</div><div>V<sub>out</sub> = [3.0/(1.0 + 3.0)] &times; 12</div><div><b>V<sub>out</sub> = 9.0 V</b></div></div><div class="pl2">(b)</div><p>The load is in parallel with R<sub>2</sub>:</p><div class="calc"><div>1/R<sub>p</sub> = 1/3.0 + 1/3.0</div><div><b>R<sub>p</sub> = 1.5 k&Omega;</b></div></div><div class="calc"><div>V<sub>out</sub> = [1.5/(1.0 + 1.5)] &times; 12</div><div><b>V<sub>out</sub> = 7.2 V</b></div></div><p>Connecting a load always <b>lowers</b> the output voltage.</p>`)}
${trap(`Putting the wrong resistor on top of the fraction. The resistor you want the voltage across goes on top.`)}`;

C3[8].html = `
<p>An ordinary voltmeter draws a small current from the cell it measures, so it reads the terminal p.d. (&epsilon; &minus; Ir), not the true emf. A <b>potentiometer</b> measures voltage while drawing <b>no current at all</b>.</p>
${fig(f3_pot, "Figure 3.13: A potentiometer. The driver cell sends a steady current along the uniform wire AB. The jockey is moved until the galvanometer reads zero.")}
<h4>How it works</h4>
<ol><li>The <b>driver cell</b> sends a steady current I along a long, uniform resistance wire AB.</li>
<li>Because the wire is uniform, the potential drop along it is <b>proportional to length</b>: V = I(&rho;/A)l = kl, where k is the potential drop per unit length.</li>
<li>The cell being tested is connected so that its emf opposes the potential drop along the wire, through a galvanometer and a sliding contact called a <b>jockey</b>.</li>
<li>The jockey is tapped along the wire until the galvanometer reads <b>zero</b>. At this <b>balance point</b> C, the emf of the cell exactly equals the potential drop along AC.</li>
<li>The length AC is the <b>balance length</b> l, and &epsilon; = kl.</li></ol>
<p>At balance no current flows through the tested cell, so there is no Ir drop. The potentiometer measures the <b>true emf</b>.</p>
${fx("V\\propto l||V=kl||\\dfrac{\\varepsilon_1}{\\varepsilon_2}=\\dfrac{l_1}{l_2}", "V &prop; l &nbsp;&nbsp; V = kl &nbsp;&nbsp; &epsilon;<sub>1</sub>/&epsilon;<sub>2</sub> = l<sub>1</sub>/l<sub>2</sub>")}
<h4>Uses</h4>
<ul><li><b>Measuring an unknown emf:</b> find k from the driver circuit, then &epsilon; = kl.</li>
<li><b>Comparing two emfs:</b> find the balance length for each cell. Since k is the same, &epsilon;<sub>1</sub>/&epsilon;<sub>2</sub> = l<sub>1</sub>/l<sub>2</sub>.</li>
<li><b>Measuring internal resistance:</b> find the balance length l<sub>0</sub> for the cell alone (its emf), then l with a known resistor R connected across the cell (its terminal p.d.). Then r = R(l<sub>0</sub> &minus; l)/l.</li></ul>
${ex("balance length", `<div class="exq"><div class="exh">Question</div><p>In a potentiometer, a driver cell of emf 2.0 V (negligible internal resistance) is connected across a uniform wire 100 cm long with resistance 4.0 &Omega;. A cell of emf 1.2 V is being tested.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the balance length.</li><li><span class="pl">(b)</span> A 1.0 &Omega; resistor is now connected in series with the driver cell. Calculate the new balance length.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><p>The full 2.0 V is across the 1.00 m wire:</p><div class="calc"><div>k = V/l</div><div>k = 2.0/1.00</div><div><b>k = 2.0 V m<sup>&minus;1</sup></b></div></div><div class="calc"><div>l = &epsilon;/k</div><div>l = 1.2/2.0</div><div><b>l = 0.60 m (60 cm)</b></div></div><div class="pl2">(b)</div><div class="calc"><div>I = 2.0/(4.0 + 1.0)</div><div><b>I = 0.40 A</b></div></div><div class="calc"><div>V<sub>wire</sub> = IR<sub>wire</sub></div><div>V<sub>wire</sub> = 0.40 &times; 4.0</div><div><b>V<sub>wire</sub> = 1.6 V</b></div></div><div class="calc"><div>k = 1.6/1.00</div><div><b>k = 1.6 V m<sup>&minus;1</sup></b></div></div><div class="calc"><div>l = 1.2/1.6</div><div><b>l = 0.75 m (75 cm)</b></div></div>`)}
${trap(`Forgetting that adding resistance to the <b>driver</b> circuit changes k. Less current along the wire means a smaller potential drop per metre, so the balance length gets longer.`)}`;

C4[0].html = `
<p>A <b>magnetic field</b> is a region around a magnet (or a current) in which a magnetic force can be felt. It is a vector, so it has a direction at every point. We represent it with <b>magnetic field lines</b>.</p>
<h4>Poles</h4>
<p>Every magnet has two poles, <b>north (N)</b> and <b>south (S)</b>, and they always come in pairs. Cut a magnet in half and you get two smaller magnets, each with its own N and S.</p>
${fig(f4_poles, "Figure 4.1: Like poles repel. Unlike poles attract.")}
<h4>Sources of magnetic field</h4>
<ul><li><b>Permanent magnets</b>, such as a bar magnet.</li>
<li><b>The Earth</b>, which behaves like a giant bar magnet.</li>
<li><b>Moving charges</b>, and so any <b>current-carrying conductor</b>. This is the link between electricity and magnetism.</li></ul>
<h4>Field lines</h4>
${fig(f4_bar, "Figure 4.2: The magnetic field of a bar magnet. Outside the magnet the lines run from N to S.")}
<ul><li>Outside a magnet, field lines go from the <b>N pole to the S pole</b>. A small compass placed there points along the line.</li>
<li>The field is strongest where the lines are closest together, near the poles.</li>
<li>Field lines never cross.</li></ul>
${fig(f4_earth, "Figure 4.3: The Earth's magnetic field is like that of a bar magnet whose S pole points towards geographic north. That is why the N end of a compass points north.")}
<p>The Earth's field looks like the field of a bar magnet inside the Earth. The magnet's <b>south</b> pole is near the <b>geographic north</b> pole, so the north-seeking end of a compass is pulled towards geographic north.</p>
${trap(`Drawing field lines going from S to N outside a magnet, or letting them cross. Outside the magnet, the lines always leave N and enter S.`)}`;

C4[1].html = `
<p>In 1820, Oersted noticed that a compass needle moved when a current flowed in a nearby wire. Every current produces a magnetic field around it. Its strength is the <b>magnetic flux density B</b>, a vector measured in <b>tesla (T)</b>.</p>
<h4>Finding the direction: right-hand grip rule</h4>
${fig(f4_grip, "Figure 4.4: Grip the wire with your right hand, thumb pointing along the current. Your fingers curl in the direction of B.")}
<p>We draw fields in and out of the page with two symbols: &#8857; (a dot) means <b>out of the page</b>, towards you, like the point of an arrow. &#8855; (a cross) means <b>into the page</b>, like the tail feathers of an arrow.</p>
<h4>1. A long straight wire</h4>
${fig(f4_wire, "Figure 4.5: The field around a long straight wire is a set of circles centred on the wire. The field gets weaker further out.")}
${fx("B=\\dfrac{\\mu_0I}{2\\pi r}||\\mu_0=4\\pi\\times10^{-7}\\ \\text{T m A}^{-1}", "B = &mu;<sub>0</sub>I/2&pi;r")}
<p>r is the perpendicular distance from the wire. B is proportional to I and inversely proportional to r.</p>
<h4>2. At the centre of a circular coil</h4>
${fig(f4_coil, "Figure 4.6: A circular coil seen from the side. At the centre, the field is along the axis of the coil.")}
${fx("B=\\dfrac{\\mu_0NI}{2R}", "B = &mu;<sub>0</sub>NI/2R")}
<p>N is the number of turns and R is the radius of the coil. More turns or more current gives a stronger field.</p>
<h4>3. A solenoid</h4>
${fig(f4_sol, "Figure 4.7: A solenoid. Inside, the field is strong and uniform. Outside, it looks like the field of a bar magnet.")}
${fx("\\text{centre: } B=\\mu_0nI||\\text{end: } B=\\tfrac12\\mu_0nI||n=\\dfrac{N}{l}", "centre: B = &mu;<sub>0</sub>nI &nbsp;&nbsp; end: B = &frac12;&mu;<sub>0</sub>nI &nbsp;&nbsp; n = N/l")}
<p>n is the number of turns <b>per unit length</b>. At each end, the field is half its value at the centre. To find which end is N: grip the solenoid with your right hand with your fingers along the current, and your thumb points to the <b>N</b> end.</p>
<h4>Resultant field from two wires</h4>
<p>B is a vector. When two wires are present, find B from each wire at the point, decide each direction with the grip rule, and add them as vectors.</p>
${ex("two parallel wires", `<div class="exq"><div class="exh">Question</div><p>Two long straight parallel wires X and Y are 10 cm apart. X carries 20 A and Y carries 10 A, in the same direction.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the magnetic flux density at the midpoint between the wires.</li><li><span class="pl">(b)</span> State the magnetic flux density at the midpoint if the currents were in opposite directions.</li><li><span class="pl">(c)</span> Find the position of the neutral point.</li></ol><p class="given">Given: &mu;<sub>0</sub> = 4&pi; &times; 10<sup>&minus;7</sup> T m A<sup>&minus;1</sup></p></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>B<sub>X</sub> = &mu;<sub>0</sub>I<sub>X</sub>/2&pi;r</div><div>B<sub>X</sub> = (4&pi; &times; 10<sup>&minus;7</sup>)(20) / (2&pi; &times; 0.050)</div><div><b>B<sub>X</sub> = 8.0 &times; 10<sup>&minus;5</sup> T</b></div></div><div class="calc"><div>B<sub>Y</sub> = &mu;<sub>0</sub>I<sub>Y</sub>/2&pi;r</div><div>B<sub>Y</sub> = (4&pi; &times; 10<sup>&minus;7</sup>)(10) / (2&pi; &times; 0.050)</div><div><b>B<sub>Y</sub> = 4.0 &times; 10<sup>&minus;5</sup> T</b></div></div><p>With currents in the <b>same</b> direction, the two fields at the midpoint point in <b>opposite</b> directions:</p><div class="calc"><div>B = (8.0 &minus; 4.0) &times; 10<sup>&minus;5</sup></div><div><b>B = 4.0 &times; 10<sup>&minus;5</sup> T, in the direction of X&#39;s field</b></div></div><div class="pl2">(b)</div><p>The fields now point the same way and add:</p><div class="calc"><div>B = (8.0 + 4.0) &times; 10<sup>&minus;5</sup></div><div><b>B = 1.2 &times; 10<sup>&minus;4</sup> T</b></div></div><div class="pl2">(c)</div><p>The neutral point is between the wires, a distance x from X, where B<sub>X</sub> = B<sub>Y</sub>:</p><div class="calc"><div>20/x = 10/(0.10 &minus; x)</div><div>20(0.10 &minus; x) = 10x</div><div><b>x = 0.067 m (6.7 cm from X)</b></div></div>`)}
${trap(`Using the diameter instead of the radius in B = &mu;<sub>0</sub>NI/2R, or using N instead of n = N/l for a solenoid.`)}`;

C4[2].html = `
<p>A magnetic field does not push on a charge at rest. It only exerts a force on a charge that is <b>moving</b> across the field.</p>
${fx("\\vec F=q\\vec v\\times\\vec B||F=qvB\\sin\\theta", "F = qv &times; B &nbsp;&nbsp; F = qvB sin &theta;")}
<ul><li>&theta; is the angle between v and B.</li>
<li>The force is largest (qvB) when the charge moves <b>perpendicular</b> to B (&theta; = 90&deg;).</li>
<li>The force is <b>zero</b> when the charge moves <b>parallel</b> to B (&theta; = 0&deg; or 180&deg;), or when it is at rest.</li></ul>
<h4>Direction of the force</h4>
${fig(f4_force, "Figure 4.8: A positive charge moving right through a field into the page feels a force upwards, at right angles to both v and B.")}
<p>The force is always <b>perpendicular to both v and B</b>. Use the <b>right-hand palm rule</b>: fingers point along B, thumb along v, and the palm pushes in the direction of F on a <b>positive</b> charge. (Fleming's left-hand rule gives the same answer, with the second finger along the conventional current.) For a <b>negative</b> charge, such as an electron, the force is in the <b>opposite</b> direction.</p>
<h4>Circular motion</h4>
${fig(f4_circle, "Figure 4.9: The magnetic force is always perpendicular to the velocity, so it acts as a centripetal force and the charge moves in a circle.")}
<p>Because F is always at right angles to v, it never speeds the charge up or slows it down. It only changes the direction. A charge entering a uniform field at right angles therefore moves in a <b>circle</b>, with the magnetic force providing the centripetal force:</p>
${fx("qvB=\\dfrac{mv^2}{r}||r=\\dfrac{mv}{qB}||T=\\dfrac{2\\pi r}{v}=\\dfrac{2\\pi m}{qB}", "qvB = mv<sup>2</sup>/r &nbsp;&nbsp; r = mv/qB &nbsp;&nbsp; T = 2&pi;m/qB")}
<p>A faster or heavier particle moves in a bigger circle. The period does not depend on the speed.</p>
${ex("a proton in a magnetic field", `<div class="exq"><div class="exh">Question</div><p>A proton moves at 2.0 &times; 10<sup>6</sup> m s<sup>&minus;1</sup> at right angles to a uniform magnetic field of 0.50 T.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the magnetic force on the proton.</li><li><span class="pl">(b)</span> Calculate the radius of its circular path.</li><li><span class="pl">(c)</span> Calculate the period of its motion.</li></ol><p class="given">Given: e = 1.60 &times; 10<sup>&minus;19</sup> C, m<sub>p</sub> = 1.67 &times; 10<sup>&minus;27</sup> kg</p></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>F = qvB</div><div>F = (1.60 &times; 10<sup>&minus;19</sup>)(2.0 &times; 10<sup>6</sup>)(0.50)</div><div><b>F = 1.6 &times; 10<sup>&minus;13</sup> N</b></div></div><div class="pl2">(b)</div><div class="calc"><div>r = mv/qB</div><div>r = (1.67 &times; 10<sup>&minus;27</sup>)(2.0 &times; 10<sup>6</sup>) / [(1.60 &times; 10<sup>&minus;19</sup>)(0.50)]</div><div><b>r = 4.2 &times; 10<sup>&minus;2</sup> m</b></div></div><div class="pl2">(c)</div><div class="calc"><div>T = 2&pi;m/qB</div><div>T = 2&pi;(1.67 &times; 10<sup>&minus;27</sup>) / [(1.60 &times; 10<sup>&minus;19</sup>)(0.50)]</div><div><b>T = 1.3 &times; 10<sup>&minus;7</sup> s</b></div></div>`)}
${trap(`Forgetting to reverse the direction for an electron. The palm rule gives the force on a positive charge.`)}`;

C4[3].html = `
<p>A current is a stream of moving charges. Each one feels a magnetic force, so a <b>current-carrying wire</b> in a magnetic field feels a force too. This is how electric motors and loudspeakers work.</p>
${fig(f4_motor, "Figure 4.10: A wire carrying current out of the page between the poles of a magnet. The field points from N to S, and the force on the wire is upwards.")}
${fx("\\vec F=I\\vec l\\times\\vec B||F=IlB\\sin\\theta", "F = Il &times; B &nbsp;&nbsp; F = IlB sin &theta;")}
<ul><li>l is the length of wire inside the field, and &theta; is the angle between the wire (the current) and B.</li>
<li>The force is largest when the wire is <b>perpendicular</b> to B, and <b>zero</b> when the wire is parallel to B.</li>
<li>The force is perpendicular to both the wire and B.</li></ul>
<h4>Direction of the force</h4>
<p>Use the right-hand palm rule (fingers along B, thumb along I, palm pushes towards F), or <b>Fleming's left-hand rule</b>: <b>F</b>irst finger = <b>F</b>ield, se<b>C</b>ond finger = <b>C</b>urrent, thu<b>M</b>b = <b>M</b>otion (force).</p>
${ex("force on a wire", `<div class="exq"><div class="exh">Question</div><p>A 0.20 m length of wire carries a current of 5.0 A in a uniform magnetic field of 0.30 T. Calculate the force on the wire when it is</p><ol class="parts"><li><span class="pl">(a)</span> at 90&deg; to the field,</li><li><span class="pl">(b)</span> at 30&deg; to the field.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>F = IlB</div><div>F = (5.0)(0.20)(0.30)</div><div><b>F = 0.30 N</b></div></div><div class="pl2">(b)</div><div class="calc"><div>F = IlB sin &theta;</div><div>F = (5.0)(0.20)(0.30) sin 30&deg;</div><div><b>F = 0.15 N</b></div></div>`)}
${trap(`Using the whole length of the wire when only part of it is inside the field. Only the length l <b>in</b> the field feels the force.`)}`;

C4[4].html = `
<p>Each current-carrying wire produces a magnetic field. A second wire placed nearby sits in that field, so it feels a force. Two parallel wires therefore push or pull on each other.</p>
${fig(f4_parallel, "Figure 4.11: Currents in the same direction attract. Currents in opposite directions repel.")}
<h4>Why there is a force</h4>
<ol><li>The current I<sub>1</sub> in wire 1 produces a field at wire 2: B<sub>1</sub> = &mu;<sub>0</sub>I<sub>1</sub>/2&pi;d.</li>
<li>Wire 2 carries current I<sub>2</sub> in this field, so a length l of it feels a force F = B<sub>1</sub>I<sub>2</sub>l.</li>
<li>Wire 1 feels an equal and opposite force from wire 2's field (Newton's third law).</li></ol>
${fx("\\dfrac{F}{l}=\\dfrac{\\mu_0I_1I_2}{2\\pi d}", "F/l = &mu;<sub>0</sub>I<sub>1</sub>I<sub>2</sub>/2&pi;d")}
<p>F/l is the force per unit length, in N m<sup>&minus;1</sup>. d is the distance between the wires.</p>
<ul><li>Currents in the <b>same</b> direction: the wires <b>attract</b>.</li>
<li>Currents in <b>opposite</b> directions: the wires <b>repel</b>.</li>
<li>The force on each wire is the same size, even if the currents are different.</li></ul>
${ex("force per unit length", `<div class="exq"><div class="exh">Question</div><p>Two long parallel wires 0.10 m apart carry currents of 5.0 A and 8.0 A in the same direction. Calculate the force per unit length on each wire, and state whether it is attractive or repulsive.</p><p class="given">Given: &mu;<sub>0</sub> = 4&pi; &times; 10<sup>&minus;7</sup> T m A<sup>&minus;1</sup></p></div><div class="exh">Solution</div><div class="calc"><div>F/l = &mu;<sub>0</sub>I<sub>1</sub>I<sub>2</sub>/2&pi;d</div><div>F/l = (4&pi; &times; 10<sup>&minus;7</sup>)(5.0)(8.0) / (2&pi; &times; 0.10)</div><div><b>F/l = 8.0 &times; 10<sup>&minus;5</sup> N m<sup>&minus;1</sup></b></div></div><p>The force is <b>attractive</b>, because the currents are in the same direction.</p>`)}
${trap(`Thinking that "like currents" repel, the way like charges and like poles do. For currents it is the opposite: same direction attracts.`)}`;

C4[5].html = `
<p>If a charged particle moves through a region with an electric field and a magnetic field at right angles to each other, the two forces can cancel. This is used to select particles with one particular speed.</p>
${fig(f4_selector, "Figure 4.12: A velocity selector. The electric force pushes the positive particle down, and the magnetic force pushes it up.")}
<h4>Velocity selector</h4>
<ul><li>The electric force F<sub>E</sub> = qE does not depend on speed.</li>
<li>The magnetic force F<sub>B</sub> = qvB increases with speed.</li>
<li>For one particular speed the two forces are equal and opposite, the resultant force is zero, and the particle goes straight through.</li></ul>
${fx("qE=qvB||v=\\dfrac{E}{B}", "qE = qvB &nbsp;&nbsp; v = E/B")}
<p>Faster particles have F<sub>B</sub> &gt; F<sub>E</sub> and are deflected one way. Slower particles have F<sub>B</sub> &lt; F<sub>E</sub> and are deflected the other way. Only particles with <b>v = E/B</b> pass through the exit slit. Notice that q cancels, so this works for any charge and any mass.</p>
<h4>Measuring q/m: the mass spectrometer</h4>
<p>The selected particles then enter a region with a magnetic field only. They move in a semicircle of radius r = mv/qB. Using v = E/B:</p>
${fx("\\dfrac{q}{m}=\\dfrac{v}{rB}=\\dfrac{E}{rB^2}", "q/m = v/rB = E/rB<sup>2</sup>")}
${ex("velocity selector", `<div class="exq"><div class="exh">Question</div><p>In a velocity selector, the electric field is 3.0 &times; 10<sup>4</sup> V m<sup>&minus;1</sup> and the magnetic field is 0.15 T.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the speed of the ions that pass straight through.</li><li><span class="pl">(b)</span> The ions then enter a region with the same magnetic field only, and move in a circle of radius 1.4 cm. Calculate their charge-to-mass ratio.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>v = E/B</div><div>v = (3.0 &times; 10<sup>4</sup>) / 0.15</div><div><b>v = 2.0 &times; 10<sup>5</sup> m s<sup>&minus;1</sup></b></div></div><div class="pl2">(b)</div><div class="calc"><div>q/m = v/rB</div><div>q/m = (2.0 &times; 10<sup>5</sup>) / (0.014 &times; 0.15)</div><div><b>q/m = 9.5 &times; 10<sup>7</sup> C kg<sup>&minus;1</sup></b></div></div><p>This matches a proton.</p>`)}
${trap(`Thinking the selector picks particles by mass or charge. It picks by <b>speed</b> only, since q cancels in qE = qvB.`)}`;

(function(){

const L = (x1,y1,x2,y2,c=INK,sw=1.5,dash) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${sw}"${dash?` stroke-dasharray="${dash}"`:""}/>`;
const T = (x,y,t,o={}) => `<text x="${x}" y="${y}" font-size="${o.s||13}" fill="${o.c||INK}" text-anchor="${o.a||"middle"}"${o.b?' font-weight="700"':""}${o.i?' font-style="italic"':""}>${t}</text>`;
const Q = (x,y,s,r=13) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${s==="+"?RED:BLU}"/>` + T(x, y+5, s==="+"?"+":"&#8722;", {c:"#fff", s:r>10?17:12, b:1});
const P = (d,c=FLD,sw=1.6,mk) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}"${mk?` marker-end="url(#m${c.slice(1)})"`:""}/>`;
const tri = (x,y,c=FLD,dir=1) => `<path d="M${x-4*dir},${y-4} L${x+4*dir},${y} L${x-4*dir},${y+4} z" fill="${c}"/>`;
const RES = (x,y,lab) => `<rect x="${x-18}" y="${y-7}" width="36" height="14" fill="#fff" stroke="${INK}" stroke-width="1.6"/>` + (lab?T(x,y-13,lab,{s:12}):"");

const fig = (svgStr, cap) => `<figure class="tfig">${svgStr}<figcaption>${cap}</figcaption></figure>`;
const ex = (title, body) => `<div class="ex"><b>Worked example: ${title}</b>${body}</div>`;

function expPath(x0, y0, w, h, kind){ // kind: "rise" or "decay"; tau at w/5
  const pts = []; for(let i=0;i<=40;i++){ const t = i/40*5; const v = kind==="rise" ? 1-Math.exp(-t) : Math.exp(-t);
    pts.push(`${(x0 + i/40*w).toFixed(1)},${(y0 - v*h).toFixed(1)}`); }

function graph(x0, y0, w, h, kind, ylab, title, mark){

    + P(expPath(x0,y0,w,h,kind), BLU, 2)

    + T(x0-4, yv+4, mark, {s:11,c:MUT,a:"end"})
