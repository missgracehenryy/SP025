C5[0].html = `
<p>To understand electromagnetic induction, we first need a way to count how much magnetic field passes through a coil. That quantity is <b>magnetic flux</b>.</p>
${fig(f5_flux, "Figure 5.1: Flux depends on how much of the field passes straight through the surface. When B lies along the surface, no field lines pass through.")}
<p><b>Magnetic flux &phi;</b> is the scalar product of the magnetic flux density B and the area vector A. You can think of it as the number of field lines passing through the area.</p>
${fx("\\phi=\\vec B\\cdot\\vec A=BA\\cos\\theta||\\text{flux linkage } \\Phi=N\\phi", "&phi; = BA cos &theta; &nbsp;&nbsp; flux linkage &Phi; = N&phi;")}
<ul><li>The area vector A points along the <b>normal</b> (perpendicular) to the surface. So &theta; is the angle between B and the <b>normal</b>, not between B and the surface.</li>
<li>&phi; is <b>maximum</b> (BA) when B is perpendicular to the surface (&theta; = 0&deg;). &phi; is <b>zero</b> when B is parallel to the surface (&theta; = 90&deg;).</li>
<li>Flux is a <b>scalar</b>. Unit: the weber, Wb = T m<sup>2</sup>.</li></ul>
<h4>Flux linkage</h4>
<p>A coil of N turns has the same flux &phi; through each turn, so the total, the <b>flux linkage</b>, is &Phi; = N&phi;.</p>
${ex("flux and flux linkage", `<div class="exq"><div class="exh">Question</div><p>A square coil of side 4.0 cm has 200 turns. It is in a uniform magnetic field of 0.50 T, which makes an angle of 60&deg; with the normal to the coil.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the magnetic flux through one turn.</li><li><span class="pl">(b)</span> Calculate the flux linkage of the coil.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>A = (0.040)<sup>2</sup></div><div><b>A = 1.6 &times; 10<sup>&minus;3</sup> m<sup>2</sup></b></div></div><div class="calc"><div>&phi; = BA cos &theta;</div><div>&phi; = (0.50)(1.6 &times; 10<sup>&minus;3</sup>) cos 60&deg;</div><div><b>&phi; = 4.0 &times; 10<sup>&minus;4</sup> Wb</b></div></div><div class="pl2">(b)</div><div class="calc"><div>&Phi; = N&phi;</div><div>&Phi; = 200 &times; 4.0 &times; 10<sup>&minus;4</sup></div><div><b>&Phi; = 8.0 &times; 10<sup>&minus;2</sup> Wb</b></div></div>`)}
${trap(`Measuring &theta; from the surface. If a question says the field makes 30&deg; <b>with the surface</b>, the angle with the normal is 60&deg;.`)}`;

C5[1].html = `
<p><b>Electromagnetic induction</b> is the production of an emf (and so a current, if the circuit is complete) whenever the magnetic flux through a coil or circuit <b>changes</b>.</p>
<h4>Faraday's experiment</h4>
${fig(f5_faraday, "Figure 5.2: A galvanometer shows a current only while the magnet is moving. Moving it out gives a current in the opposite direction.")}
<ul><li>Magnet <b>at rest</b> inside or near the coil: no current, even if the field is strong. The flux is not changing.</li>
<li>Magnet <b>moving in</b>: the flux through the coil increases, and the needle deflects.</li>
<li>Magnet <b>moving out</b>: the flux decreases, and the needle deflects the <b>other</b> way.</li></ul>
<p>The induced emf is bigger if you use a stronger magnet, move it faster, use a coil with a larger area, or use more turns. All of these make the flux change faster.</p>
<h4>Faraday's law</h4>
<p>The magnitude of the induced emf is <b>directly proportional to the rate of change of magnetic flux linkage</b>.</p>
${fx("\\varepsilon=-N\\dfrac{d\\phi}{dt}", "&epsilon; = &minus;N d&phi;/dt")}
<h4>Lenz's law</h4>
<p>The induced current always flows in a direction that <b>opposes the change in flux</b> that produces it. This is what the minus sign in Faraday's law means. It follows from conservation of energy: if the induced current helped the change, you would get energy for nothing.</p>
${fig(f5_lenz, "Figure 5.3: As the N pole approaches, the coil's induced current makes the near end an N pole, which pushes back against the magnet.")}
<p>How to find the direction:</p>
<ol><li>Decide whether the flux through the coil is increasing or decreasing.</li>
<li>If it is <b>increasing</b>, the induced field points <b>against</b> the magnet's field. If it is <b>decreasing</b>, the induced field points <b>the same way</b>, to replace what is lost. (A magnet approaching is repelled. A magnet leaving is attracted.)</li>
<li>Use the right-hand grip rule to turn the induced field direction into a current direction.</li></ol>
<h4>Three ways to change the flux</h4>
<p><b>1. A straight conductor moving through a field.</b></p>
${fig(f5_rod, "Figure 5.4: A rod sliding along rails. As the rod moves, the area of the loop increases, so the flux increases and an emf is induced.")}
<p>In time dt, the rod moves dx = v dt, so the area grows by l dx and the flux by Bl dx. Then &epsilon; = Bl(dx/dt) = Blv. In general:</p>
${fx("\\varepsilon=Blv\\sin\\theta", "&epsilon; = Blv sin &theta;")}
<p>&theta; is the angle between v and B. Fleming's <b>right-hand</b> rule (thumb = motion, first finger = field, second finger = current) gives the current direction.</p>
<p><b>2. A coil in a changing field, or with a changing area.</b> With B perpendicular to the coil: &epsilon; = &minus;NA(dB/dt) if B changes, or &epsilon; = &minus;NB(dA/dt) if the area changes.</p>
<p><b>3. A coil rotating in a field.</b></p>
${fig(f5_rot, "Figure 5.5: A coil rotating at constant &#969; in a uniform field. The angle changes continuously, so the flux changes and a sinusoidal emf is induced.")}
<p>The angle is &theta; = &omega;t, so &phi; = BA cos &omega;t. Differentiating:</p>
${fx("\\varepsilon=-N\\dfrac{d}{dt}\\left(BA\\cos\\omega t\\right)=NAB\\omega\\sin\\omega t||\\varepsilon_{\\max}=NAB\\omega", "&epsilon; = NAB&omega; sin &omega;t &nbsp;&nbsp; &epsilon;<sub>max</sub> = NAB&omega;")}
<p>This is how a generator produces alternating current, which you will meet in Chapter 6.</p>
${ex("three kinds of induced emf", `<div class="exq"><div class="exh">Question</div><p>Calculate the induced emf in each case.</p><ol class="parts"><li><span class="pl">(a)</span> A 100-turn coil of area 5.0 &times; 10<sup>&minus;3</sup> m<sup>2</sup> is perpendicular to a magnetic field that falls steadily from 0.40 T to 0.10 T in 0.050 s.</li><li><span class="pl">(b)</span> A 0.50 m rod moves at 4.0 m s<sup>&minus;1</sup> at right angles to a 0.80 T field. The rod is part of a circuit with a total resistance of 2.0 &Omega;. Also find the current.</li><li><span class="pl">(c)</span> A 50-turn coil of area 0.010 m<sup>2</sup> rotates at 50 revolutions per second in a 0.20 T field. Find the maximum emf.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>|&epsilon;| = NA(&Delta;B/&Delta;t)</div><div>|&epsilon;| = 100 &times; (5.0 &times; 10<sup>&minus;3</sup>) &times; (0.30/0.050)</div><div><b>|&epsilon;| = 3.0 V</b></div></div><div class="pl2">(b)</div><div class="calc"><div>&epsilon; = Blv</div><div>&epsilon; = (0.80)(0.50)(4.0)</div><div><b>&epsilon; = 1.6 V</b></div></div><div class="calc"><div>I = &epsilon;/R</div><div>I = 1.6/2.0</div><div><b>I = 0.80 A</b></div></div><div class="pl2">(c)</div><div class="calc"><div>&omega; = 2&pi;f</div><div>&omega; = 2&pi; &times; 50</div><div><b>&omega; = 314 rad s<sup>&minus;1</sup></b></div></div><div class="calc"><div>&epsilon;<sub>max</sub> = NAB&omega;</div><div>&epsilon;<sub>max</sub> = (50)(0.010)(0.20)(314)</div><div><b>&epsilon;<sub>max</sub> = 31 V</b></div></div>`)}
${trap(`Using revolutions per second as &omega;. Convert: &omega; = 2&pi;f, in rad s<sup>&minus;1</sup>.`)}`;

C5[2].html = `
<p>So far, the changing flux came from a magnet or another circuit. But a coil carrying a <b>changing current</b> produces a changing field <b>through itself</b>, so it induces an emf in itself. This is <b>self-induction</b>.</p>
${fig(f5_self, "Figure 5.6: Changing the resistance changes the current through the coil. The coil's own changing flux induces a back emf in it.")}
<ul><li>By Lenz's law, the self-induced emf <b>opposes the change in current</b>, so it is called a <b>back emf</b>.</li>
<li>When the current is <b>increasing</b>, the back emf tries to stop it rising. When it is <b>decreasing</b>, the back emf tries to keep it flowing.</li>
<li>A steady current gives no back emf, because the flux is not changing.</li></ul>
<p>The self-induced emf is proportional to the rate of change of current:</p>
${fx("\\varepsilon=-L\\dfrac{dI}{dt}||L=\\dfrac{N\\phi}{I}", "&epsilon; = &minus;L dI/dt &nbsp;&nbsp; L = N&phi;/I")}
<p><b>Self-inductance L</b> is the ratio of the self-induced emf to the rate of change of current in the coil. It also equals the flux linkage per unit current. Unit: the <b>henry</b> (H = V s A<sup>&minus;1</sup> = Wb A<sup>&minus;1</sup>).</p>
<h4>Inductance of a solenoid and a coil</h4>
${fx("L_{\\text{solenoid}}=\\dfrac{\\mu_0N^2A}{l}||L_{\\text{coil}}=\\dfrac{\\mu_0N^2A}{2r}", "L<sub>solenoid</sub> = &mu;<sub>0</sub>N<sup>2</sup>A/l &nbsp;&nbsp; L<sub>coil</sub> = &mu;<sub>0</sub>N<sup>2</sup>A/2r")}
<p>L depends only on the shape and size of the coil: number of turns, area and length. It does not depend on the current. Notice the N<sup>2</sup>: doubling the turns makes L four times bigger.</p>
${ex("self-inductance", `<div class="exq"><div class="exh">Question</div><p>Calculate the self-inductance in each case.</p><ol class="parts"><li><span class="pl">(a)</span> A back emf of 6.0 V is induced in a coil when the current in it changes at 40 A s<sup>&minus;1</sup>.</li><li><span class="pl">(b)</span> A solenoid has 500 turns, length 0.25 m and cross-sectional area 2.0 &times; 10<sup>&minus;4</sup> m<sup>2</sup>.</li></ol><p class="given">Given: &mu;<sub>0</sub> = 4&pi; &times; 10<sup>&minus;7</sup> T m A<sup>&minus;1</sup></p></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>L = &epsilon;/(dI/dt)</div><div>L = 6.0/40</div><div><b>L = 0.15 H</b></div></div><div class="pl2">(b)</div><div class="calc"><div>L = &mu;<sub>0</sub>N<sup>2</sup>A/l</div><div>L = (4&pi; &times; 10<sup>&minus;7</sup>)(500)<sup>2</sup>(2.0 &times; 10<sup>&minus;4</sup>) / 0.25</div><div><b>L = 2.5 &times; 10<sup>&minus;4</sup> H</b></div></div>`)}
${trap(`Using N instead of N<sup>2</sup> in the formula for L.`)}`;

C5[3].html = `
<p>An <b>inductor</b> is a coil or solenoid with a large self-inductance. Its jobs in a circuit are to <b>control changes in current</b> and to <b>store energy</b>.</p>
<p>When the current through an inductor is switched on, it does not jump to its final value at once. The back emf opposes the rise. Work has to be done against this back emf to build the current up, and that work is stored as energy in the <b>magnetic field</b> of the inductor.</p>
${fx("U=\\tfrac12LI^2", "U = &frac12;LI<sup>2</sup>")}
<table class="cmp"><tr><th></th><th>Capacitor</th><th>Inductor</th></tr>
<tr><td>Energy stored in</td><td>electric field</td><td>magnetic field</td></tr>
<tr><td>Formula</td><td>U = &frac12;CV<sup>2</sup></td><td>U = &frac12;LI<sup>2</sup></td></tr>
<tr><td>Opposes changes in</td><td>voltage</td><td>current</td></tr></table>
<p>When the current is switched off, the stored energy is released. That is why switching off a large inductor can cause a spark at the switch.</p>
${ex("energy in an inductor", `<div class="exq"><div class="exh">Question</div><p>A coil of inductance 40 mH and resistance 0.50 &Omega; is connected to a 6.0 V supply. Calculate the energy stored in the coil when the current is steady.</p></div><div class="exh">Solution</div><div class="calc"><div>I = V/R</div><div>I = 6.0/0.50</div><div><b>I = 12 A</b></div></div><div class="calc"><div>U = &frac12;LI<sup>2</sup></div><div>U = &frac12;(40 &times; 10<sup>&minus;3</sup>)(12)<sup>2</sup></div><div><b>U = 2.9 J</b></div></div>`)}
${trap(`Forgetting to convert mH to H (1 mH = 10<sup>&minus;3</sup> H), or forgetting to square the current.`)}`;

C5[4].html = `

${fig(f5_mutual, "Figure 5.7: Two coaxial solenoids. A changing current in the inner coil changes the flux through the outer coil, inducing an emf in it.")}

<ul><li><b>Mutual inductance M</b> is the ratio of the emf induced in one coil to the rate of change of current in the other coil. Unit: henry (H).</li>
<li>It works both ways: a changing current in coil 2 induces an emf in coil 1, with the <b>same</b> M.</li>
<li>For two coaxial solenoids, A is the cross-sectional area of the inner solenoid and l is the length of the solenoids.</li>
<li>Only a <b>changing</b> current induces an emf. A steady current in coil 1 gives nothing in coil 2. This is why transformers need alternating current.</li></ul>

C6[0].html = `
<p>The mains supply in your home is not direct current. It is <b>alternating current (AC)</b>: a current whose magnitude and direction change <b>periodically</b>. Charges move back and forth instead of flowing steadily one way, yet energy still flows continuously from the power station to your devices.</p>
${fig(f6_wave, "Figure 6.1: A sinusoidal alternating voltage. It rises to a peak V&#8320;, falls through zero, reverses to &#8722;V&#8320;, and repeats every period T.")}
<p>The most common form is <b>sinusoidal</b> AC, which follows a sine curve:</p>
${fx("V=V_0\\sin\\omega t||I=I_0\\sin\\omega t||\\omega=2\\pi f=\\dfrac{2\\pi}{T}", "V = V<sub>0</sub> sin &omega;t &nbsp;&nbsp; I = I<sub>0</sub> sin &omega;t &nbsp;&nbsp; &omega; = 2&pi;f = 2&pi;/T")}
<ul><li>V and I are the <b>instantaneous</b> values at time t. V<sub>0</sub> and I<sub>0</sub> are the <b>peak</b> (maximum) values.</li>
<li>&omega;t is called the <b>phase</b>. In your calculator, use <b>radian</b> mode.</li>
<li>The sign of I tells you the direction at that instant: positive one way round the circuit, negative the other way.</li>
<li>f is the frequency (number of cycles per second, Hz), and T = 1/f is the period.</li></ul>
${ex("reading an AC equation", `<div class="exq"><div class="exh">Question</div><p>An alternating voltage is given by V = 325 sin(100&pi;t), where V is in volts and t is in seconds.</p><ol class="parts"><li><span class="pl">(a)</span> State the peak voltage.</li><li><span class="pl">(b)</span> Calculate the frequency and the period.</li><li><span class="pl">(c)</span> Calculate the voltage at t = 2.5 ms.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><p>Comparing with V = V<sub>0</sub> sin &omega;t:</p><div class="calc"><div><b>V<sub>0</sub> = 325 V</b></div></div><div class="pl2">(b)</div><div class="calc"><div>&omega; = 2&pi;f = 100&pi;</div><div>f = 100&pi;/2&pi;</div><div><b>f = 50 Hz</b></div></div><div class="calc"><div>T = 1/f</div><div>T = 1/50</div><div><b>T = 0.020 s</b></div></div><div class="pl2">(c)</div><p>Set your calculator to radians.</p><div class="calc"><div>V = 325 sin(100&pi; &times; 0.0025)</div><div>V = 325 sin(&pi;/4)</div><div><b>V = 230 V</b></div></div>`)}
${trap(`Calculating sin &omega;t with the calculator in degree mode. &omega;t is in radians.`)}`;

C6[1].html = `
<p>The average of a sine wave over a full cycle is zero, since it is positive for half the time and negative for the other half. That is not a useful way to describe the size of an AC. Instead we ask: what <b>steady</b> current would have the same heating effect?</p>
${fig(f6_rms, "Figure 6.2: The power in a resistor depends on I&#178;. I&#178; is always positive and averages to I&#8320;&#178;/2.")}
<p>Power in a resistor is P = I<sup>2</sup>R. I<sup>2</sup> = I<sub>0</sub><sup>2</sup> sin<sup>2</sup> &omega;t is never negative, and its average over a cycle is <b>I<sub>0</sub><sup>2</sup>/2</b>. So the average power is &frac12;I<sub>0</sub><sup>2</sup>R. A steady current I<sub>rms</sub> gives the same power if I<sub>rms</sub><sup>2</sup> = I<sub>0</sub><sup>2</sup>/2.</p>
<p><b>Root mean square (rms) current</b> is the value of the steady direct current that produces the same power (heating) in a resistor as the alternating current. The rms voltage is defined in the same way.</p>
${fx("I_{\\text{rms}}=\\dfrac{I_0}{\\sqrt2}||V_{\\text{rms}}=\\dfrac{V_0}{\\sqrt2}", "I<sub>rms</sub> = I<sub>0</sub>/&radic;2 &nbsp;&nbsp; V<sub>rms</sub> = V<sub>0</sub>/&radic;2")}
<ul><li>The name describes the steps: take the <b>square</b> of the current, find the <b>mean</b>, then take the square <b>root</b>.</li>
<li>Rms values are also called <b>effective</b> values. A lamp on 240 V rms AC is exactly as bright as on 240 V DC.</li>
<li>Mains ratings (such as 240 V) and AC meter readings are <b>rms</b> values. The peak is &radic;2 times bigger: 240 V rms has a peak of about 340 V.</li></ul>
${ex("rms values", `<div class="exq"><div class="exh">Question</div><p>An alternating voltage V = 340 sin &omega;t is connected across a 100 &Omega; resistor.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the rms voltage.</li><li><span class="pl">(b)</span> Calculate the rms current.</li><li><span class="pl">(c)</span> Calculate the average power dissipated in the resistor.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>V<sub>rms</sub> = V<sub>0</sub>/&radic;2</div><div>V<sub>rms</sub> = 340/&radic;2</div><div><b>V<sub>rms</sub> = 240 V</b></div></div><div class="pl2">(b)</div><div class="calc"><div>I<sub>0</sub> = V<sub>0</sub>/R</div><div>I<sub>0</sub> = 340/100</div><div><b>I<sub>0</sub> = 3.4 A</b></div></div><div class="calc"><div>I<sub>rms</sub> = I<sub>0</sub>/&radic;2</div><div>I<sub>rms</sub> = 3.4/&radic;2</div><div><b>I<sub>rms</sub> = 2.4 A</b></div></div><div class="pl2">(c)</div><div class="calc"><div>P = I<sub>rms</sub><sup>2</sup>R</div><div>P = (2.40)<sup>2</sup> &times; 100</div><div><b>P = 5.8 &times; 10<sup>2</sup> W</b></div></div>`)}
${trap(`Using peak values in P = I<sup>2</sup>R for average power. Average power uses rms values.`)}`;

C6[2].html = `
<p>In an AC circuit, resistors, capacitors and inductors each oppose the current in a different way, and they also shift the timing (phase) between the current and the voltage. We show these phase relationships with <b>phasor diagrams</b>.</p>
<p>A <b>phasor</b> is a vector that rotates anticlockwise at angular frequency &omega;. Its length is the peak (or rms) value, and its projection on the vertical axis gives the instantaneous value. The angle between two phasors is their phase difference.</p>
<h4>Pure resistor</h4>
${fig(f6_R, "Figure 6.3: In a pure resistor, V and I reach their peaks and zeros at the same time: they are in phase.")}
<p>V and I are <b>in phase</b>. The opposition is the resistance R = V<sub>0</sub>/I<sub>0</sub> = V<sub>rms</sub>/I<sub>rms</sub>, which does not depend on frequency.</p>
<h4>Pure capacitor</h4>
${fig(f6_C, "Figure 6.4: In a pure capacitor, the current reaches its peak a quarter of a cycle before the voltage.")}
<p>The current is largest when the capacitor is empty and charging fastest, which is when V is zero. So <b>I leads V by &pi;/2</b>. The opposition is the <b>capacitive reactance</b>:</p>
${fx("X_C=\\dfrac{1}{\\omega C}=\\dfrac{1}{2\\pi fC}", "X<sub>C</sub> = 1/&omega;C = 1/2&pi;fC")}
<p>X<sub>C</sub> <b>decreases</b> as f increases. At high frequency the capacitor has little time to charge, so it hardly opposes the current. For DC (f = 0), X<sub>C</sub> is infinite and no current flows.</p>
<h4>Pure inductor</h4>
${fig(f6_L, "Figure 6.5: In a pure inductor, the voltage reaches its peak a quarter of a cycle before the current.")}
<p>The back emf is largest when the current is changing fastest, which is when I is zero. So <b>V leads I by &pi;/2</b>. The opposition is the <b>inductive reactance</b>:</p>
${fx("X_L=\\omega L=2\\pi fL", "X<sub>L</sub> = &omega;L = 2&pi;fL")}
<p>X<sub>L</sub> <b>increases</b> as f increases, because a faster-changing current gives a bigger back emf. Memory aid: <b>"ELI the ICE man"</b>. In an inductor (<b>L</b>), the voltage (<b>E</b>) comes before <b>I</b>. In a capacitor (<b>C</b>), <b>I</b> comes before the voltage (<b>E</b>).</p>
<h4>RC, RL and RLC in series</h4>
${fig(f6_rlc, "Figure 6.6: Phasor diagram for a series RLC circuit. The current is the same everywhere, so it is the reference. V<sub>R</sub> is along I, V<sub>L</sub> is &#960;/2 ahead and V<sub>C</sub> is &#960;/2 behind.")}
<p>In a series circuit the same current flows through every component, so we draw I as the reference. V<sub>R</sub> is in phase with I, V<sub>L</sub> points up (ahead) and V<sub>C</sub> points down (behind). The supply voltage is their <b>phasor sum</b>, not their ordinary sum:</p>
${fx("V=\\sqrt{V_R^2+\\left(V_L-V_C\\right)^2}||Z=\\sqrt{R^2+\\left(X_L-X_C\\right)^2}||\\tan\\phi=\\dfrac{X_L-X_C}{R}", "V = &radic;[V<sub>R</sub><sup>2</sup> + (V<sub>L</sub> &minus; V<sub>C</sub>)<sup>2</sup>] &nbsp;&nbsp; Z = &radic;[R<sup>2</sup> + (X<sub>L</sub> &minus; X<sub>C</sub>)<sup>2</sup>] &nbsp;&nbsp; tan &phi; = (X<sub>L</sub> &minus; X<sub>C</sub>)/R")}
${fig(f6_imp, "Figure 6.7: The impedance triangle. Dividing every voltage phasor by I gives R, X<sub>L</sub> &#8722; X<sub>C</sub> and Z.")}
<ul><li><b>Impedance Z</b> is the total opposition of the circuit to alternating current, and V = IZ. Unit: ohm.</li>
<li>For an <b>RC</b> circuit, leave out X<sub>L</sub>: Z = &radic;(R<sup>2</sup> + X<sub>C</sub><sup>2</sup>), and the current leads the voltage.</li>
<li>For an <b>RL</b> circuit, leave out X<sub>C</sub>: Z = &radic;(R<sup>2</sup> + X<sub>L</sub><sup>2</sup>), and the voltage leads the current.</li></ul>
<h4>How R, X and Z change with frequency: resonance</h4>
${fig(f6_freq, "Figure 6.8: R does not depend on f. X<sub>C</sub> falls and X<sub>L</sub> rises as f increases. Z is large at both ends and smallest where X<sub>L</sub> = X<sub>C</sub>.")}
<p>At one particular frequency, X<sub>L</sub> = X<sub>C</sub>. They cancel, so Z = R, which is the <b>minimum</b> impedance. The current is then at its <b>maximum</b>, and V and I are in phase. This is <b>resonance</b>, and it happens at the <b>resonant frequency</b>:</p>
${fx("X_L=X_C\\ \\Rightarrow\\ f_0=\\dfrac{1}{2\\pi\\sqrt{LC}}", "f<sub>0</sub> = 1/(2&pi;&radic;LC)")}
<p>A radio is tuned by changing C until f<sub>0</sub> matches the station's frequency, so that station gives the biggest current.</p>
${ex("a series RLC circuit", `<div class="exq"><div class="exh">Question</div><p>A 100 &Omega; resistor, a 0.50 H inductor and a 10 &mu;F capacitor are connected in series with a 240 V, 50 Hz supply.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the inductive and capacitive reactances.</li><li><span class="pl">(b)</span> Calculate the impedance and the current.</li><li><span class="pl">(c)</span> Calculate the phase angle, and state whether the current leads or lags the voltage.</li><li><span class="pl">(d)</span> Calculate the resonant frequency.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>X<sub>L</sub> = 2&pi;fL</div><div>X<sub>L</sub> = 2&pi;(50)(0.50)</div><div><b>X<sub>L</sub> = 157 &Omega;</b></div></div><div class="calc"><div>X<sub>C</sub> = 1/2&pi;fC</div><div>X<sub>C</sub> = 1/[2&pi;(50)(10 &times; 10<sup>&minus;6</sup>)]</div><div><b>X<sub>C</sub> = 318 &Omega;</b></div></div><div class="pl2">(b)</div><div class="calc"><div>Z = &radic;[R<sup>2</sup> + (X<sub>L</sub> &minus; X<sub>C</sub>)<sup>2</sup>]</div><div>Z = &radic;[100<sup>2</sup> + (157 &minus; 318)<sup>2</sup>]</div><div><b>Z = 190 &Omega;</b></div></div><div class="calc"><div>I = V/Z</div><div>I = 240/190</div><div><b>I = 1.27 A</b></div></div><div class="pl2">(c)</div><div class="calc"><div>tan &phi; = (X<sub>L</sub> &minus; X<sub>C</sub>)/R</div><div>tan &phi; = (157 &minus; 318)/100</div><div><b>&phi; = &minus;58&deg;</b></div></div><p>&phi; is negative because X<sub>C</sub> &gt; X<sub>L</sub>. The circuit is capacitive, so the current <b>leads</b> the voltage by 58&deg;.</p><div class="pl2">(d)</div><div class="calc"><div>f<sub>0</sub> = 1/(2&pi;&radic;LC)</div><div>f<sub>0</sub> = 1/[2&pi;&radic;(0.50 &times; 10 &times; 10<sup>&minus;6</sup>)]</div><div><b>f<sub>0</sub> = 71 Hz</b></div></div>`)}
${trap(`Adding V<sub>R</sub>, V<sub>L</sub> and V<sub>C</sub> as ordinary numbers. They are out of phase, so add them as phasors.`)}`;

C6[3].html = `
<p>In a DC circuit, power is simply P = IV. In an AC circuit, I and V keep changing, and they are not always in phase, so we need to be more careful.</p>
<h4>Instantaneous power</h4>
<p>The <b>instantaneous power</b> is P = IV, using the values at that instant. It changes throughout the cycle.</p>
${fig(f6_pow, "Figure 6.9: Left: in a resistor, P is always positive. Right: in a pure capacitor or inductor, energy is taken in for a quarter cycle and given back the next, so the average is zero.")}
<ul><li><b>Pure resistor:</b> P = I<sub>0</sub>V<sub>0</sub> sin<sup>2</sup> &omega;t. It is never negative, and its average is &frac12;I<sub>0</sub>V<sub>0</sub> = I<sub>rms</sub>V<sub>rms</sub>.</li>
<li><b>Pure capacitor or inductor:</b> P = &frac12;I<sub>0</sub>V<sub>0</sub> sin 2&omega;t. It is positive for a quarter cycle (energy stored) and negative for the next (energy returned), so the <b>average is zero</b>.</li></ul>
<h4>Average (real) power</h4>
<p>Only the resistance actually uses up energy. So the average power in any series RC, RL or RLC circuit is the power in its resistance: P<sub>av</sub> = I<sub>rms</sub><sup>2</sup>R. From the phasor diagram, V<sub>R</sub> = V cos &phi;, which gives:</p>
${fx("P_{\\text{av}}=I_{\\text{rms}}V_{\\text{rms}}\\cos\\phi=I_{\\text{rms}}^2R", "P<sub>av</sub> = I<sub>rms</sub>V<sub>rms</sub> cos &phi; = I<sub>rms</sub><sup>2</sup>R")}
<h4>Power factor</h4>
${fx("\\cos\\phi=\\dfrac{P_{\\text{av}}}{I_{\\text{rms}}V_{\\text{rms}}}=\\dfrac{R}{Z}", "cos &phi; = P<sub>av</sub>/(I<sub>rms</sub>V<sub>rms</sub>) = R/Z")}
<ul><li>I<sub>rms</sub>V<sub>rms</sub> is called the <b>apparent power</b> (unit V A). The <b>power factor</b> cos &phi; is the ratio of the real power to the apparent power. It has no unit.</li>
<li><b>Pure resistor:</b> &phi; = 0, power factor = 1. All the apparent power is used.</li>
<li><b>Pure capacitor or inductor:</b> &phi; = &pi;/2, power factor = 0. No power is used.</li>
<li><b>At resonance:</b> Z = R, so the power factor is 1.</li></ul>
${ex("power in an RLC circuit", `<div class="exq"><div class="exh">Question</div><p>For the series RLC circuit in the 6.3 worked example (R = 100 &Omega;, Z = 190 &Omega;, I<sub>rms</sub> = 1.27 A, V<sub>rms</sub> = 240 V):</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the power factor.</li><li><span class="pl">(b)</span> Calculate the average power.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>cos &phi; = R/Z</div><div>cos &phi; = 100/190</div><div><b>cos &phi; = 0.53</b></div></div><div class="pl2">(b)</div><div class="calc"><div>P<sub>av</sub> = I<sub>rms</sub>V<sub>rms</sub> cos &phi;</div><div>P<sub>av</sub> = 1.27 &times; 240 &times; 0.53</div><div><b>P<sub>av</sub> = 1.6 &times; 10<sup>2</sup> W</b></div></div><p>Check, using the power in the resistor only:</p><div class="calc"><div>P<sub>av</sub> = I<sub>rms</sub><sup>2</sup>R</div><div>P<sub>av</sub> = (1.27)<sup>2</sup> &times; 100</div><div><b>P<sub>av</sub> = 1.6 &times; 10<sup>2</sup> W</b></div></div>`)}
${trap(`Thinking a capacitor or inductor "uses" power. They store energy and give it back, so their average power is zero. Only R dissipates energy.`)}`;

C7[0].html = `
<p>A <b>spherical mirror</b> is part of a sphere. A <b>concave</b> mirror curves inwards (like the inside of a spoon) and makes light converge. A <b>convex</b> mirror bulges outwards and makes light spread out.</p>
<h4>Key points</h4>
<ul><li><b>Pole P:</b> the centre of the mirror's surface.</li>
<li><b>Centre of curvature C:</b> the centre of the sphere the mirror is part of. R is its distance from P.</li>
<li><b>Focal point F:</b> where rays parallel to the axis meet after reflection (concave), or appear to come from (convex). F is halfway between P and C, so:</li></ul>
${fx("R=2f||\\dfrac1f=\\dfrac1u+\\dfrac1v||M=\\dfrac{h_i}{h_o}=-\\dfrac{v}{u}", "R = 2f &nbsp;&nbsp; 1/f = 1/u + 1/v &nbsp;&nbsp; M = h<sub>i</sub>/h<sub>o</sub> = &minus;v/u")}
<h4>Ray diagrams</h4>
<p>To find an image, draw at least two of these rays from the top of the object:</p>
<ol><li>A ray <b>parallel to the axis</b> reflects <b>through F</b> (concave), or as if it came from F (convex).</li>
<li>A ray <b>through F</b> (or heading towards F, for convex) reflects <b>parallel to the axis</b>.</li>
<li>A ray <b>through C</b> (or heading towards C) reflects straight back along itself.</li></ol>
${figA(f7_concave, "Figure 7.1: Concave mirror with the object beyond C. The image is real, inverted and diminished, between F and C.")}
${figA(f7_convex, "Figure 7.2: Convex mirror. The reflected rays spread out and only appear to come from behind the mirror, so the image is virtual. It is always upright and diminished.")}
<h4>Sign convention (real object)</h4>
<table class="cmp"><tr><th>Quantity</th><th>Positive (+)</th><th>Negative (&minus;)</th></tr>
<tr><td>f and R</td><td>concave mirror</td><td>convex mirror</td></tr>
<tr><td>v</td><td>real image (in front of the mirror)</td><td>virtual image (behind the mirror)</td></tr>
<tr><td>M</td><td>upright image</td><td>inverted image</td></tr></table>
<p>The size of |M| tells you whether the image is magnified (|M| &gt; 1) or diminished (|M| &lt; 1).</p>
${ex("mirror equation", `<div class="exq"><div class="exh">Question</div><p>For each mirror, find the position of the image and its magnification, and describe the image.</p><ol class="parts"><li><span class="pl">(a)</span> A concave mirror of focal length 10 cm, with an object 30 cm in front of it.</li><li><span class="pl">(b)</span> A convex mirror of focal length 20 cm, with an object 30 cm in front of it.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><p>Concave mirror, so f = +10 cm.</p><div class="calc"><div>1/v = 1/f &minus; 1/u</div><div>1/v = 1/10 &minus; 1/30</div><div><b>v = +15 cm</b></div></div><div class="calc"><div>M = &minus;v/u</div><div>M = &minus;15/30</div><div><b>M = &minus;0.5</b></div></div><p>The image is <b>real</b> (v positive), <b>inverted</b> (M negative) and <b>diminished</b> (|M| &lt; 1).</p><div class="pl2">(b)</div><p>Convex mirror, so f = &minus;20 cm.</p><div class="calc"><div>1/v = 1/f &minus; 1/u</div><div>1/v = &minus;1/20 &minus; 1/30</div><div><b>v = &minus;12 cm</b></div></div><div class="calc"><div>M = &minus;v/u</div><div>M = &minus;(&minus;12)/30</div><div><b>M = +0.4</b></div></div><p>The image is <b>virtual</b> (behind the mirror), <b>upright</b> and <b>diminished</b>.</p>`)}
${trap(`Forgetting to put a negative sign on f for a convex mirror.`)}`;

C7[1].html = `
<p>Light changes speed, and so bends, when it crosses a boundary between two materials. If the boundary is curved, like the surface of a glass ball or the front of your eye, it can form an image.</p>
${figA(f7_refr, "Figure 7.3: Light from object O in air is refracted at a convex glass surface and forms an image I inside the glass.")}
${fx("\\dfrac{n_1}{u}+\\dfrac{n_2}{v}=\\dfrac{n_2-n_1}{R}", "n<sub>1</sub>/u + n<sub>2</sub>/v = (n<sub>2</sub> &minus; n<sub>1</sub>)/R")}
<ul><li>n<sub>1</sub> is the refractive index of the medium the <b>object</b> is in. n<sub>2</sub> is the refractive index of the medium the light <b>enters</b>.</li>
<li><b>R is positive</b> for a <b>convex</b> surface facing the object, and <b>negative</b> for a <b>concave</b> surface.</li>
<li><b>v positive:</b> real image, in the second medium. <b>v negative:</b> virtual image, on the same side as the object.</li>
<li>Refractive index n = c/v is a ratio of speeds, so it has no unit.</li></ul>
${ex("refraction at a curved surface", `<div class="exq"><div class="exh">Question</div><p>An object in air is 30 cm in front of a convex glass surface of radius of curvature 10 cm. Find the position of the image, and state whether it is real or virtual.</p><p class="given">Given: refractive index of glass = 1.5, refractive index of air = 1.0</p></div><div class="exh">Solution</div><p>The surface is convex towards the object, so R = +10 cm.</p><div class="calc"><div>n<sub>1</sub>/u + n<sub>2</sub>/v = (n<sub>2</sub> &minus; n<sub>1</sub>)/R</div><div>1.0/30 + 1.5/v = (1.5 &minus; 1.0)/10</div><div>1.5/v = 0.050 &minus; 0.033</div><div><b>v = +90 cm</b></div></div><p>v is positive, so the image is <b>real</b>, 90 cm inside the glass.</p>`)}
${trap(`Swapping n<sub>1</sub> and n<sub>2</sub>. n<sub>1</sub> always goes with u (the object side).`)}`;

C7[2].html = `
<p>A <b>thin lens</b> refracts light at two surfaces. A <b>convex</b> (converging) lens is thicker in the middle and brings parallel rays together at a focus. A <b>concave</b> (diverging) lens is thinner in the middle and spreads them out.</p>
${fx("\\dfrac1f=\\dfrac1u+\\dfrac1v||M=\\dfrac{h_i}{h_o}=-\\dfrac{v}{u}", "1/f = 1/u + 1/v &nbsp;&nbsp; M = &minus;v/u")}
<h4>Ray diagrams</h4>
<ol><li>A ray <b>parallel to the axis</b> refracts <b>through F</b> on the far side (convex), or as if from F on the near side (concave).</li>
<li>A ray through the <b>optical centre</b> goes straight through, undeviated.</li>
<li>A ray through F (or heading to F) leaves parallel to the axis.</li></ol>
${figA(f7_lens, "Figure 7.4: Convex lens with the object at 2F. The image is at 2F on the other side: real, inverted and the same size.")}
${figA(f7_lensc, "Figure 7.5: Concave lens. The rays spread out as if from a point on the object side, so the image is always virtual, upright and diminished.")}
<p><b>Sign convention:</b> f is <b>positive</b> for a convex lens and <b>negative</b> for a concave lens. v is positive for a real image (on the far side) and negative for a virtual image (on the object side).</p>
<h4>Lens maker's equation</h4>
<p>The focal length depends on the shape of the lens and on the refractive indices of the lens and its surroundings:</p>
${fx("\\dfrac1f=\\left(\\dfrac{n_{\\text{material}}}{n_{\\text{medium}}}-1\\right)\\left(\\dfrac{1}{R_1}-\\dfrac{1}{R_2}\\right)", "1/f = (n<sub>material</sub>/n<sub>medium</sub> &minus; 1)(1/R<sub>1</sub> &minus; 1/R<sub>2</sub>)")}
<p>R<sub>1</sub> is the surface the light meets first. Use the same sign rule as for one surface: convex towards the incoming light is positive. For a biconvex lens, R<sub>1</sub> is positive and R<sub>2</sub> is negative.</p>
<p>If the lens is put in water, n<sub>material</sub>/n<sub>medium</sub> gets closer to 1, so the lens bends light less and its <b>focal length increases</b>.</p>
<h4>Two lenses</h4>
<p>Find the image formed by the first lens. That image becomes the <b>object</b> for the second lens. The total magnification is M = M<sub>1</sub> &times; M<sub>2</sub>.</p>
${ex("lens calculations", `<div class="exq"><div class="exh">Question</div><p>Answer all three parts.</p><ol class="parts"><li><span class="pl">(a)</span> A convex lens of focal length 15 cm forms an image of an object placed 20 cm from it. Find the image position and magnification.</li><li><span class="pl">(b)</span> A biconvex glass lens (n = 1.5) has radii of curvature 20 cm and 20 cm. Find its focal length in air, and in water (n = 1.33).</li><li><span class="pl">(c)</span> Two convex lenses of focal lengths 10 cm and 20 cm are 40 cm apart. An object is 15 cm in front of the first lens. Find the final image position and the total magnification.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>1/v = 1/f &minus; 1/u</div><div>1/v = 1/15 &minus; 1/20</div><div><b>v = +60 cm (real)</b></div></div><div class="calc"><div>M = &minus;v/u</div><div>M = &minus;60/20</div><div><b>M = &minus;3</b></div></div><div class="pl2">(b)</div><p>For a biconvex lens, R<sub>1</sub> = +20 cm and R<sub>2</sub> = &minus;20 cm. In air:</p><div class="calc"><div>1/f = (1.5/1.0 &minus; 1)(1/20 &minus; 1/(&minus;20))</div><div>1/f = 0.5 &times; 0.10</div><div><b>f = 20 cm</b></div></div><p>In water:</p><div class="calc"><div>1/f = (1.5/1.33 &minus; 1)(0.10)</div><div>1/f = 0.128 &times; 0.10</div><div><b>f = 78 cm</b></div></div><div class="pl2">(c)</div><p>Lens 1:</p><div class="calc"><div>1/v<sub>1</sub> = 1/10 &minus; 1/15</div><div><b>v<sub>1</sub> = 30 cm</b></div></div><p>This image is the object for lens 2:</p><div class="calc"><div>u<sub>2</sub> = 40 &minus; 30</div><div><b>u<sub>2</sub> = 10 cm</b></div></div><div class="calc"><div>1/v<sub>2</sub> = 1/20 &minus; 1/10</div><div><b>v<sub>2</sub> = &minus;20 cm (virtual, 20 cm in front of lens 2)</b></div></div><div class="calc"><div>M = M<sub>1</sub> &times; M<sub>2</sub></div><div>M = (&minus;30/15) &times; (&minus;(&minus;20)/10)</div><div><b>M = &minus;4</b></div></div>`)}
${trap(`In a two-lens problem, using the distance from the first lens as u for the second lens. Measure u<sub>2</sub> from the <b>second</b> lens.`)}`;

C7[3].html = `
<p>So far we treated light as rays. To explain interference and diffraction, we need to treat light as a <b>wave</b>. A <b>wavefront</b> is a line (or surface) joining points that are in phase, such as all the crests. Rays are always perpendicular to wavefronts.</p>
<h4>Huygens's principle</h4>
<p>Every point on a wavefront acts as a source of <b>secondary spherical wavelets</b> that spread out at the speed of the wave. A short time later, the new wavefront is the surface that is <b>tangent to all these wavelets</b> (their envelope).</p>
${fig(f7_huy, "Figure 7.6: Left: wavelets from points on a plane wavefront build the next plane wavefront. Right: at a narrow slit, only a few wavelets get through, so the wave spreads out in circles.")}
<ul><li>A <b>plane</b> wavefront in open space stays plane, because the wavelets build a straight envelope.</li>
<li>A <b>spherical</b> wavefront from a point source stays spherical and grows.</li>
<li>At a <b>narrow slit</b>, the wavefront is cut down to a short section. Its wavelets spread out on the other side, so the light bends round the edges. This is <b>diffraction</b>, and it is most noticeable when the slit width is close to the wavelength.</li></ul>
<p>Huygens's principle explains reflection, refraction, diffraction and interference.</p>
${trap(`Thinking only the centre of the wavefront produces new waves. Every point on it is a source of wavelets.`)}`;

C7[4].html = `
<p>When two waves meet, they overlap. The <b>principle of superposition</b> says the resulting displacement at any point is the sum of the individual displacements. This overlapping of waves is called <b>interference</b>.</p>
${fig(f7_super, "Figure 7.7: Two waves in phase add to a bigger wave (constructive). Two waves in antiphase cancel (destructive).")}
<h4>Coherence</h4>
<p>Two sources are <b>coherent</b> if they have the <b>same frequency</b> (and so wavelength) and a <b>constant phase difference</b>. Two separate light bulbs are not coherent, because their light is emitted in random bursts. In the lab we make coherent sources by splitting the light from one source, for example with two slits.</p>
<h4>Conditions for an observable interference pattern</h4>
<ul><li>The sources must be <b>coherent</b>.</li>
<li>They should have about the <b>same amplitude</b>, so the dark fringes are really dark.</li>
<li>The light should be <b>monochromatic</b> (one wavelength).</li>
<li>The slit separation must be small compared with the distance to the screen.</li></ul>
<h4>Constructive and destructive interference</h4>
<p>What happens at a point depends on the <b>path difference</b>: how much further one wave has travelled than the other. A path difference of one wavelength &lambda; is a phase difference of 2&pi;.</p>
<table class="cmp"><tr><th>Sources</th><th>Constructive (bright)</th><th>Destructive (dark)</th></tr>
<tr><td>In phase</td><td>path difference = m&lambda;</td><td>path difference = (m + &frac12;)&lambda;</td></tr>
<tr><td>Antiphase</td><td>path difference = (m + &frac12;)&lambda;</td><td>path difference = m&lambda;</td></tr></table>
${fx("\\text{phase difference}=\\dfrac{2\\pi}{\\lambda}\\times\\text{path difference}", "phase difference = (2&pi;/&lambda;) &times; path difference")}
<p>Here m = 0, 1, 2, ... For antiphase sources everything is swapped, because the waves already start half a cycle apart.</p>
${trap(`Using the in-phase conditions for antiphase sources. Check how the sources start before deciding which condition applies.`)}`;

C7[5].html = `
<p>In <b>Young's double-slit experiment</b>, light from one source passes through two narrow slits close together. The two slits act as <b>coherent sources</b>, and their light overlaps on a screen to form a pattern of bright and dark <b>fringes</b>.</p>
${fig(f7_double, "Figure 7.8: Young's double-slit experiment. Light from S&#8321; and S&#8322; overlaps on the screen, giving equally spaced bright and dark fringes.")}
<ul><li>At the centre of the screen, both paths are equal, so the path difference is zero and there is a <b>bright</b> central fringe (m = 0).</li>
<li>Moving away from the centre, the path difference grows. Bright fringes appear where it is m&lambda;, and dark fringes where it is (m + &frac12;)&lambda;.</li></ul>
${fx("\\text{bright: } y_m=\\dfrac{m\\lambda D}{d}||\\text{dark: } y_m=\\dfrac{\\left(m+\\frac12\\right)\\lambda D}{d}||\\Delta y=\\dfrac{\\lambda D}{d}", "bright: y<sub>m</sub> = m&lambda;D/d &nbsp;&nbsp; dark: y<sub>m</sub> = (m + &frac12;)&lambda;D/d &nbsp;&nbsp; &Delta;y = &lambda;D/d")}
<p>&Delta;y is the <b>fringe separation</b>: the distance between neighbouring bright (or dark) fringes. The fringes are equally spaced.</p>
<h4>Changing the pattern</h4>
<table class="cmp"><tr><th>Change</th><th>Effect on &Delta;y</th></tr>
<tr><td>Longer wavelength (e.g. red instead of blue)</td><td>increases</td></tr>
<tr><td>Screen further away (larger D)</td><td>increases</td></tr>
<tr><td>Slits closer together (smaller d)</td><td>increases</td></tr>
<tr><td>White light instead of one colour</td><td>central fringe white, others coloured</td></tr></table>
${ex("fringe separation", `<div class="exq"><div class="exh">Question</div><p>In a Young&#39;s double-slit experiment, light of wavelength 600 nm passes through two slits 0.30 mm apart. The screen is 1.5 m from the slits. Calculate the fringe separation.</p></div><div class="exh">Solution</div><div class="calc"><div>&Delta;y = &lambda;D/d</div><div>&Delta;y = (600 &times; 10<sup>&minus;9</sup>)(1.5) / (0.30 &times; 10<sup>&minus;3</sup>)</div><div><b>&Delta;y = 3.0 &times; 10<sup>&minus;3</sup> m (3.0 mm)</b></div></div>`)}
${trap(`Mixing up d (the slit separation, usually in mm) and D (the screen distance, usually in m). Convert both to metres.`)}`;

C7[6].html = `
<p>The colours on a soap bubble or an oil film on a wet road come from <b>thin-film interference</b>. Light reflects from both the top and the bottom surfaces of the film, and the two reflected rays interfere.</p>
${fig(f7_film, "Figure 7.9: Ray 1 reflects from the top surface. Ray 2 enters the film, reflects from the bottom surface and comes back out. The two rays interfere.")}
<h4>Phase change on reflection</h4>
<ul><li>Light reflecting off a medium with a <b>higher</b> refractive index gets a phase change of <b>&pi;</b> (the same as an extra half wavelength).</li>
<li>Light reflecting off a medium with a <b>lower</b> refractive index gets <b>no</b> phase change.</li></ul>
<p>For a soap film in air: ray 1 reflects at air &rarr; soap (higher n), so it gets a phase change of &pi;. Ray 2 reflects at soap &rarr; air (lower n), so it gets none. The two rays therefore start out of step by &pi;.</p>
<h4>Path difference</h4>
<p>At normal incidence, ray 2 travels down and back up through the film, an extra distance 2t. Inside the film the wavelength is shorter (&lambda;/n), so the effective path difference is <b>2nt</b>.</p>
<table class="cmp"><tr><th>Relative phase of the two reflected rays</th><th>Constructive (bright)</th><th>Destructive (dark)</th></tr>
<tr><td>No phase difference (e.g. air &ndash; MgF<sub>2</sub> &ndash; glass: <b>non-reflective coating</b>)</td><td>2nt = m&lambda;</td><td>2nt = (m + &frac12;)&lambda;</td></tr>
<tr><td>Phase difference &pi; (e.g. soap film in air: <b>reflective coating</b>)</td><td>2nt = (m + &frac12;)&lambda;</td><td>2nt = m&lambda;</td></tr></table>
<h4>Applications</h4>
<ul><li><b>Anti-reflective coatings</b> on spectacles, camera lenses and solar panels: the thickness is chosen so that reflected light interferes <b>destructively</b>. Less light is reflected, so more is transmitted.</li>
<li><b>Reflective coatings</b>, such as heat-reflecting tinted glass: the thickness is chosen so that reflected light interferes <b>constructively</b>.</li></ul>
${ex("coating thickness", `<div class="exq"><div class="exh">Question</div><p>A thin coating of magnesium fluoride (n = 1.38) is put on a glass lens (n = 1.5) to stop light of wavelength 550 nm being reflected. Calculate the minimum thickness of the coating.</p></div><div class="exh">Solution</div><p>Both reflections (air &rarr; coating, coating &rarr; glass) are off a higher refractive index, so there is no relative phase change. For destructive interference with the thinnest coating, 2nt = &frac12;&lambda;:</p><div class="calc"><div>t = &lambda;/4n</div><div>t = 550 / (4 &times; 1.38)</div><div><b>t = 99.6 nm (about 100 nm)</b></div></div>`)}
${trap(`Forgetting to check the phase changes first. Decide which row of the table to use before writing any equation.`)}`;

<p><b>Diffraction</b> is the spreading of waves as they pass through an opening or around the edge of an obstacle. With light, it is easiest to see when the opening is very narrow, close to the wavelength.</p>

C7[8].html = `
<p>A <b>diffraction grating</b> is a plate with a very large number of equally spaced parallel slits, often hundreds per millimetre. Light diffracts through every slit and the waves from all the slits interfere, giving very <b>sharp, bright</b> maxima at particular angles.</p>
${fig(f7_grating, "Figure 7.11: A diffraction grating sends bright maxima in a few sharp directions, labelled by the order m.")}
${fx("d\\sin\\theta=m\\lambda||d=\\dfrac1N", "d sin &theta; = m&lambda; &nbsp;&nbsp; d = 1/N")}
<ul><li>d is the distance between neighbouring slits. If there are N lines per metre, d = 1/N.</li>
<li>m = 0 is the straight-through (zero-order) maximum. m = 1, 2, ... are the first, second, ... orders, on both sides.</li>
<li>Since sin &theta; cannot exceed 1, the highest order you can see is the largest whole number m &le; d/&lambda;.</li>
<li>More lines per mm (smaller d) spreads the maxima further apart, but gives fewer orders.</li>
<li>Different wavelengths come out at different angles, so a grating splits white light into a spectrum. A CD shows this effect.</li></ul>

C8[0].html = `
<p>For centuries, people argued about whether light is a wave or a stream of particles. The answer from twentieth-century physics is: <b>both</b>, depending on the experiment.</p>
${fig(f8_dual, "Figure 8.1: Light shows wave behaviour in interference and diffraction, and particle behaviour (photons) in the photoelectric effect.")}
<h4>Wave&ndash;particle duality</h4>
<p><b>Wave&ndash;particle duality</b> states that light (and matter) can show wave properties in some situations and particle properties in others, but <b>never both in the same experiment</b>.</p>
<ul><li><b>Particle properties:</b> mass, momentum, being localised at a point.</li>
<li><b>Wave properties:</b> wavelength, interference, diffraction.</li>
<li>Evidence that light is a wave: Young's double-slit experiment, diffraction. Evidence that light is a particle (photon): the photoelectric effect.</li></ul>
<h4>The momentum of a photon</h4>
<p>A photon has energy E = hf = hc/&lambda;. Einstein's E = mc<sup>2</sup> links energy and mass, so hc/&lambda; = mc<sup>2</sup>, which gives a photon momentum p = mc = h/&lambda;. A wave of wavelength &lambda; carries momentum h/&lambda;.</p>
<h4>De Broglie's hypothesis</h4>
<p>In 1924, Louis de Broglie suggested that the same relation works the other way round: if waves can behave as particles, then <b>particles such as electrons can behave as waves</b>. Every moving particle has a wavelength, called its <b>de Broglie wavelength</b>:</p>
${fx("\\lambda=\\dfrac{h}{p}=\\dfrac{h}{mv}||h=6.63\\times10^{-34}\\ \\text{J s}", "&lambda; = h/p = h/mv")}
<p>&lambda; is the wave property and p is the particle property. A larger momentum gives a <b>shorter</b> wavelength.</p>
${ex("everyday object versus electron", `<div class="exq"><div class="exh">Question</div><p>Calculate the de Broglie wavelength of</p><ol class="parts"><li><span class="pl">(a)</span> a 0.16 kg cricket ball moving at 30 m s<sup>&minus;1</sup>,</li><li><span class="pl">(b)</span> an electron moving at 1.0 &times; 10<sup>7</sup> m s<sup>&minus;1</sup>.</li></ol><p class="given">Given: h = 6.63 &times; 10<sup>&minus;34</sup> J s, m<sub>e</sub> = 9.11 &times; 10<sup>&minus;31</sup> kg</p></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>&lambda; = h/mv</div><div>&lambda; = (6.63 &times; 10<sup>&minus;34</sup>) / (0.16 &times; 30)</div><div><b>&lambda; = 1.4 &times; 10<sup>&minus;34</sup> m</b></div></div><p>This is far too small ever to detect, so we never see a cricket ball diffract.</p><div class="pl2">(b)</div><div class="calc"><div>&lambda; = h/mv</div><div>&lambda; = (6.63 &times; 10<sup>&minus;34</sup>) / (9.11 &times; 10<sup>&minus;31</sup> &times; 1.0 &times; 10<sup>7</sup>)</div><div><b>&lambda; = 7.3 &times; 10<sup>&minus;11</sup> m</b></div></div><p>This is about the spacing of atoms in a crystal, so electrons <b>can</b> be diffracted by crystals.</p>`)}
${trap(`Using the photon formula E = hc/&lambda; for an electron. For particles with mass, use &lambda; = h/mv.`)}`;

C8[1].html = `
<h4>The Davisson&ndash;Germer experiment</h4>
<p>If electrons really are waves, they should diffract when they pass through a crystal, because the spacing of atoms in a crystal is close to their de Broglie wavelength. Davisson and Germer showed exactly this.</p>
${fig(f8_dg, "Figure 8.2: A beam of electrons passes through a thin layer of graphite. The screen shows rings: a diffraction pattern, which only waves can produce.")}
<ul><li>Electrons from an electron gun are accelerated through a potential difference V and aimed at a very thin graphite (or nickel) crystal.</li>
<li>The screen shows a pattern of bright <b>rings</b>. This is a <b>diffraction pattern</b>, so the electrons are behaving as <b>waves</b>.</li>
<li>The wavelength worked out from the rings agreed with &lambda; = h/p. This <b>confirmed de Broglie's hypothesis</b>.</li>
<li>Increasing V makes the electrons faster, and the rings get <b>smaller</b>, showing that the wavelength gets shorter.</li></ul>
<p>The kinetic energy gained is eV = &frac12;mv<sup>2</sup>, so p = &radic;(2meV) and:</p>
${fx("\\lambda=\\dfrac{h}{\\sqrt{2meV}}", "&lambda; = h/&radic;(2meV)")}
${fig(f8_lambda, "Figure 8.3: The de Broglie wavelength of an electron decreases as the accelerating voltage increases.")}
<p>All particles have a de Broglie wavelength. Diffraction is only noticeable when the wavelength is about the same as the spacing of the atoms. Heavier particles have much larger momentum and so much shorter wavelengths.</p>
<h4>The electron microscope</h4>
<p>An electron microscope uses a beam of electrons instead of light, and magnetic fields as lenses to focus it. The electrons are accelerated through a high voltage, so they have a very short de Broglie wavelength, around 10<sup>&minus;10</sup> m or less.</p>
<p>The finest detail any microscope can show (its <b>resolving power</b>) is limited by diffraction. A shorter wavelength means less diffraction, so finer detail can be resolved.</p>
<table class="cmp"><tr><th></th><th>Optical microscope</th><th>Electron microscope</th></tr>
<tr><td>Uses</td><td>visible light</td><td>electron waves</td></tr>
<tr><td>Wavelength</td><td>about 4&ndash;7 &times; 10<sup>&minus;7</sup> m</td><td>about 10<sup>&minus;10</sup> m or less</td></tr>
<tr><td>Can separate points about</td><td>a few hundred nm apart</td><td>less than 1 nm apart</td></tr>
<tr><td>Resolving power adjusted by</td><td>changing the lenses</td><td>changing the accelerating voltage</td></tr></table>
<p><b>Advantages of an electron microscope:</b> a much higher resolving power and magnification, because the electron wavelength is much shorter than the wavelength of light. A transmission electron microscope (TEM) sends electrons through a very thin specimen. A scanning electron microscope (SEM) scans the beam across the surface.</p>

C9[0].html = `
<p>A nucleus is made of protons and neutrons, together called <b>nucleons</b>. A nucleus is written <b><sup>A</sup><sub>Z</sub>X</b>, where A is the <b>nucleon number</b> (protons + neutrons) and Z is the <b>proton number</b>. The number of neutrons is N = A &minus; Z.</p>
<h4>Units for tiny masses and energies</h4>
<ul><li>The <b>atomic mass unit</b>: 1 u is exactly 1/12 of the mass of a carbon-12 atom. 1 u = 1.66 &times; 10<sup>&minus;27</sup> kg.</li>
<li>The <b>electron-volt</b>: 1 eV is the kinetic energy gained by an electron accelerated through 1 V. 1 eV = 1.60 &times; 10<sup>&minus;19</sup> J, and 1 MeV = 10<sup>6</sup> eV.</li>
<li>Using E = mc<sup>2</sup>, a mass of 1 u is equivalent to <b>931.5 MeV</b>.</li></ul>
<h4>Mass defect</h4>
<p>If you weigh a nucleus and then weigh all its protons and neutrons separately, the nucleus is always <b>lighter</b>. This difference is the <b>mass defect</b>.</p>
${fig(f9_defect, "Figure 9.1: Pulling a nucleus apart needs energy, and the separate nucleons have more mass. Putting them together releases that energy, and mass is lost.")}
${fx("\\Delta m=Zm_p+(A-Z)m_n-m_{\\text{nucleus}}||E_B=\\Delta m\\,c^2||1\\ \\text{u}=931.5\\ \\text{MeV}/c^2", "&Delta;m = Zm<sub>p</sub> + (A &minus; Z)m<sub>n</sub> &minus; m<sub>nucleus</sub> &nbsp;&nbsp; E<sub>B</sub> = &Delta;mc<sup>2</sup>")}
<h4>Binding energy</h4>
<p>The <b>binding energy</b> E<sub>B</sub> is the energy needed to separate a nucleus completely into its individual protons and neutrons. It is equal to the energy released when the nucleus is formed. The missing mass &Delta;m has become this energy, by E = mc<sup>2</sup>.</p>
<h4>Binding energy per nucleon and stability</h4>
<p>A big nucleus has a big binding energy just because it has many nucleons. To compare how tightly different nuclei are held together, divide by A: the <b>binding energy per nucleon</b>, E<sub>B</sub>/A. The <b>higher</b> it is, the <b>more stable</b> the nucleus.</p>
${fig(f9_be, "Figure 9.2: Binding energy per nucleon against nucleon number. The curve peaks near iron-56. Moving towards the peak releases energy.")}
<ul><li>The curve rises steeply for light nuclei, peaks at about <b>8.8 MeV per nucleon near iron-56</b>, then falls slowly for heavy nuclei.</li>
<li>Nuclei near the peak (A around 50 to 60) are the most stable.</li>
<li><b>Fusion:</b> very light nuclei can join to form a nucleus higher up the curve, releasing energy (as in the Sun).</li>
<li><b>Fission:</b> very heavy nuclei, such as uranium-235, can split into two medium nuclei higher up the curve, releasing energy (as in nuclear power stations).</li></ul>
${ex("helium-4", `<div class="exq"><div class="exh">Question</div><p>For a helium-4 nucleus, <sup>4</sup><sub>2</sub>He, calculate</p><ol class="parts"><li><span class="pl">(a)</span> the mass defect,</li><li><span class="pl">(b)</span> the binding energy in MeV,</li><li><span class="pl">(c)</span> the binding energy per nucleon.</li></ol><p class="given">Given: mass of proton = 1.007276 u, mass of neutron = 1.008665 u, mass of <sup>4</sup><sub>2</sub>He nucleus = 4.001506 u, 1 u = 931.5 MeV/c<sup>2</sup></p></div><div class="exh">Solution</div><div class="pl2">(a)</div><p>Z = 2 protons and A &minus; Z = 2 neutrons.</p><div class="calc"><div>&Delta;m = Zm<sub>p</sub> + (A &minus; Z)m<sub>n</sub> &minus; m<sub>nucleus</sub></div><div>&Delta;m = 2(1.007276) + 2(1.008665) &minus; 4.001506</div><div><b>&Delta;m = 0.030376 u</b></div></div><div class="pl2">(b)</div><div class="calc"><div>E<sub>B</sub> = &Delta;m &times; 931.5</div><div>E<sub>B</sub> = 0.030376 &times; 931.5</div><div><b>E<sub>B</sub> = 28.3 MeV</b></div></div><div class="pl2">(c)</div><div class="calc"><div>E<sub>B</sub>/A = 28.3/4</div><div><b>E<sub>B</sub>/A = 7.07 MeV per nucleon</b></div></div>`)}
${trap(`Using the mass of the whole atom (including electrons) with the masses of bare protons, or forgetting to multiply by 931.5 when the mass is in u.`)}`;

C9[1].html = `
<p>Some nuclei are unstable. They change into more stable nuclei by giving out radiation. This is <b>radioactive decay</b>. It is <b>spontaneous</b> (nothing triggers it) and <b>random</b> (you cannot predict when a particular nucleus will decay). Temperature and pressure have no effect on it.</p>
<h4>Types of decay</h4>
<table class="cmp"><tr><th>Decay</th><th>What is emitted</th><th>Change in A</th><th>Change in Z</th></tr>
<tr><td>&alpha;</td><td>helium nucleus <sup>4</sup><sub>2</sub>He</td><td>&minus;4</td><td>&minus;2</td></tr>
<tr><td>&beta;<sup>&minus;</sup></td><td>electron <sup>0</sup><sub>&minus;1</sub>e (and an antineutrino). A neutron becomes a proton.</td><td>0</td><td>+1</td></tr>
<tr><td>&beta;<sup>+</sup></td><td>positron <sup>0</sup><sub>+1</sub>e (and a neutrino). A proton becomes a neutron.</td><td>0</td><td>&minus;1</td></tr>
<tr><td>&gamma;</td><td>a high-energy photon from an excited nucleus</td><td>0</td><td>0</td></tr></table>
<p>Examples: <sup>238</sup><sub>92</sub>U &rarr; <sup>234</sup><sub>90</sub>Th + <sup>4</sup><sub>2</sub>He (&alpha;). <sup>14</sup><sub>6</sub>C &rarr; <sup>14</sup><sub>7</sub>N + <sup>0</sup><sub>&minus;1</sub>e + antineutrino (&beta;<sup>&minus;</sup>). <sup>22</sup><sub>11</sub>Na &rarr; <sup>22</sup><sub>10</sub>Ne + <sup>0</sup><sub>+1</sub>e + neutrino (&beta;<sup>+</sup>). In every equation, <b>A and Z are both conserved</b>: the totals on each side match.</p>
${fig(f9_pen, "Figure 9.3: Penetrating power. &#945; is stopped by paper, &#946; by a few mm of aluminium, and &#947; is only reduced by thick lead.")}
<p>&alpha; particles are the most ionising and least penetrating. &gamma; rays are the least ionising and most penetrating.</p>
<h4>The decay law</h4>
<p>The rate of decay is directly proportional to the number of undecayed nuclei present. More nuclei means more decays per second.</p>
${fx("\\dfrac{dN}{dt}=-\\lambda N||N=N_0e^{-\\lambda t}||A=\\lambda N=A_0e^{-\\lambda t}", "dN/dt = &minus;&lambda;N &nbsp;&nbsp; N = N<sub>0</sub>e<sup>&minus;&lambda;t</sup> &nbsp;&nbsp; A = &lambda;N = A<sub>0</sub>e<sup>&minus;&lambda;t</sup>")}
<ul><li>The <b>decay constant &lambda;</b> is the probability that a nucleus decays per unit time. Unit: s<sup>&minus;1</sup>. A bigger &lambda; means a faster decay.</li>
<li>The <b>activity A</b> is the number of decays per second. Unit: the <b>becquerel</b>, 1 Bq = 1 decay per second.</li></ul>
<h4>Half-life</h4>
${fig(f9_decay, "Figure 9.4: Exponential decay. In every half-life, the number of undecayed nuclei halves.")}
<p>The <b>half-life T<sub>&frac12;</sub></b> is the time taken for the number of undecayed nuclei (or the activity) to fall to <b>half</b> its initial value. Putting N = N<sub>0</sub>/2 into the decay law gives:</p>
${fx("T_{1/2}=\\dfrac{\\ln2}{\\lambda}=\\dfrac{0.693}{\\lambda}", "T<sub>&frac12;</sub> = ln 2/&lambda; = 0.693/&lambda;")}
<p>The half-life is constant for a given nuclide: it does not depend on how many nuclei are left. A longer half-life means a smaller decay constant and a slower decay. In every half-life the number of undecayed nuclei halves: N<sub>0</sub> &rarr; N<sub>0</sub>/2 &rarr; N<sub>0</sub>/4 &rarr; N<sub>0</sub>/8.</p>
${ex("iodine-131", `<div class="exq"><div class="exh">Question</div><p>A sample of iodine-131 contains 2.0 &times; 10<sup>20</sup> undecayed nuclei. The half-life of iodine-131 is 8.0 days.</p><ol class="parts"><li><span class="pl">(a)</span> Calculate the decay constant in s<sup>&minus;1</sup>.</li><li><span class="pl">(b)</span> Calculate the initial activity.</li><li><span class="pl">(c)</span> Calculate the activity after 24 days.</li></ol></div><div class="exh">Solution</div><div class="pl2">(a)</div><div class="calc"><div>&lambda; = ln 2/T<sub>&frac12;</sub></div><div>&lambda; = 0.693 / (8.0 &times; 24 &times; 3600)</div><div><b>&lambda; = 1.0 &times; 10<sup>&minus;6</sup> s<sup>&minus;1</sup></b></div></div><div class="pl2">(b)</div><div class="calc"><div>A<sub>0</sub> = &lambda;N<sub>0</sub></div><div>A<sub>0</sub> = (1.0 &times; 10<sup>&minus;6</sup>)(2.0 &times; 10<sup>20</sup>)</div><div><b>A<sub>0</sub> = 2.0 &times; 10<sup>14</sup> Bq</b></div></div><div class="pl2">(c)</div><div class="calc"><div>A = A<sub>0</sub>e<sup>&minus;&lambda;t</sup></div><div>A = (2.0 &times; 10<sup>14</sup>) e<sup>&minus;(1.0 &times; 10<sup>&minus;6</sup>)(24 &times; 24 &times; 3600)</sup></div><div><b>A = 2.5 &times; 10<sup>13</sup> Bq</b></div></div><p>Check: 24 days is three half-lives, so the activity has halved three times: 2.0 &rarr; 1.0 &rarr; 0.50 &rarr; 0.25 &times; 10<sup>14</sup> Bq.</p>`)}
${trap(`Using the half-life in days with &lambda; in s<sup>&minus;1</sup>. Keep the time units the same throughout.`)}`;

C9[2].html = `
<p>To look inside a nucleon, physicists smash particles into it at very high energy. Machines that give charged particles these energies are called <b>particle accelerators</b>.</p>
<h4>Getting the particles: thermionic emission</h4>
<p><b>Thermionic emission</b> is the release of electrons from the surface of a heated metal. The heat gives some electrons enough energy to escape. A hot filament is the usual source of electrons in accelerators, electron guns and electron microscopes.</p>
<h4>The roles of the two fields</h4>
<ul><li>An <b>electric field</b> does work on a charged particle (W = qV), so it <b>speeds the particle up</b>. A charge entering at an angle follows a parabola.</li>
<li>A <b>magnetic field</b> exerts a force perpendicular to the velocity, so it <b>bends the path</b> into a circle without changing the speed (r = mv/qB). It does no work.</li>
<li>With both fields together, a particle can follow a spiral (helical) path.</li></ul>
<h4>Linear accelerator (linac)</h4>
${fig(f9_linac, "Figure 9.5: A linac. The particle is accelerated across each gap. The tubes get longer so that it spends the same time inside each one.")}
<ol><li>A row of hollow metal <b>drift tubes</b> is connected to an alternating voltage, so neighbouring tubes have opposite charges.</li>
<li>The particle is attracted across the <b>gap</b> to the next tube, and speeds up.</li>
<li>Inside a tube there is no electric field, so the particle coasts at constant speed while the voltage reverses.</li>
<li>When it reaches the next gap, the polarity is right to accelerate it again. Its energy builds up in steps, without needing a huge voltage.</li>
<li>Because the particle keeps getting faster but the voltage switches at a fixed frequency, each tube must be <b>longer</b> than the one before.</li></ol>
<h4>Cyclotron</h4>
${fig(f9_cyc, "Figure 9.6: A cyclotron. The magnetic field bends the particle round inside each dee, and the electric field across the gap speeds it up twice per revolution.")}
<ol><li>Two hollow D-shaped electrodes (<b>dees</b>) sit between the poles of a strong magnet, with an alternating voltage across the gap between them.</li>
<li>The <b>magnetic field</b> bends the particle into a semicircle inside each dee.</li>
<li>Each time the particle crosses the gap, the voltage has reversed, so the <b>electric field</b> accelerates it again.</li>
<li>As it speeds up, the radius r = mv/qB gets bigger, so the particle spirals outwards until it leaves the cyclotron.</li></ol>
<h4>Detectors</h4>
${fig(f9_tracks, "Figure 9.7: Tracks in a detector with a magnetic field. Opposite charges curve opposite ways, and faster (higher momentum) particles curve less.")}
<ul><li>A charged particle moving through a detector <b>ionises</b> the material, leaving a visible or electrical track.</li>
<li>Thicker tracks mean more ionisation and a slower particle.</li>
<li>In a magnetic field, positive and negative particles curve in <b>opposite</b> directions. The amount of curvature gives the momentum: a straighter track means more momentum. As particles lose energy, they spiral inwards.</li></ul>
<h4>Why such high energies?</h4>
<p>A nucleus is about 10<sup>&minus;15</sup> to 10<sup>&minus;14</sup> m across (r = r<sub>0</sub>A<sup>1/3</sup>, with r<sub>0</sub> about 1.2 &times; 10<sup>&minus;15</sup> m). To see detail this small, the probing particles need a de Broglie wavelength &lambda; = h/p about this size or smaller. A short wavelength needs a <b>large momentum</b>, which means a <b>very high energy</b>.</p>
${ex("energy needed to probe a nucleon", `<div class="exq"><div class="exh">Question</div><p>To study the inside of a nucleon, a particle beam needs a de Broglie wavelength of about 1.0 &times; 10<sup>&minus;15</sup> m. Calculate the momentum each particle needs.</p><p class="given">Given: h = 6.63 &times; 10<sup>&minus;34</sup> J s</p></div><div class="exh">Solution</div><div class="calc"><div>p = h/&lambda;</div><div>p = (6.63 &times; 10<sup>&minus;34</sup>) / (1.0 &times; 10<sup>&minus;15</sup>)</div><div><b>p = 6.6 &times; 10<sup>&minus;19</sup> kg m s<sup>&minus;1</sup></b></div></div><p>This is an enormous momentum for a particle. A proton would need over a thousand million electron-volts (GeV) of energy to reach it, which only large accelerators can provide.</p>`)}
${trap(`Saying the magnetic field speeds the particle up. The magnetic force is perpendicular to the motion, so it only changes the direction. The electric field does the accelerating.`)}`;

C9[3].html = `
<p>Are protons and neutrons the smallest pieces of matter? Experiments in accelerators showed they are not: they are made of even smaller particles. The <b>Standard Model</b> describes the particles that are truly fundamental (with no internal structure) and the forces between them.</p>
${fig(f9_tree, "Figure 9.8: How particles are classified. Quarks and leptons are fundamental. Quarks combine to form hadrons.")}
<h4>Quarks</h4>
<ul><li>There are <b>six quarks</b>, in three pairs: up and down, charm and strange, top and bottom.</li>
<li>Quarks have fractional charges: up (u) = +&#8532;e and down (d) = &minus;&#8531;e.</li>
<li>Quarks are never found alone. They combine to form <b>hadrons</b>, particles that feel the strong force.</li></ul>
<h4>Hadrons: baryons and mesons</h4>
<table class="cmp"><tr><th>Type</th><th>Made of</th><th>Examples</th></tr>
<tr><td><b>Baryons</b></td><td>three quarks</td><td>proton = uud, neutron = udd</td></tr>
<tr><td><b>Mesons</b></td><td>one quark and one antiquark</td><td>pion &pi;<sup>+</sup> = u d&#773;</td></tr></table>
<p>Check the charges: proton uud = +&#8532; + &#8532; &minus; &#8531; = <b>+1</b>. Neutron udd = +&#8532; &minus; &#8531; &minus; &#8531; = <b>0</b>.</p>
<h4>Leptons</h4>
<p>There are <b>six leptons</b>: the electron, the muon, the tau, and a neutrino for each of them. Leptons are fundamental (they contain no quarks), are light, and do <b>not</b> feel the strong force.</p>
<h4>Force carriers (gauge bosons)</h4>
<table class="cmp"><tr><th>Force</th><th>Carried by</th></tr>
<tr><td>Electromagnetic</td><td>photon</td></tr><tr><td>Weak</td><td>W and Z bosons</td></tr><tr><td>Strong</td><td>gluon</td></tr><tr><td>Gravity</td><td>(not yet part of the Standard Model)</td></tr></table>
<h4>Antiparticles</h4>
<p>Every particle has an <b>antiparticle</b> with the <b>same mass</b> but <b>opposite charge</b> (and other opposite properties). The positron e<sup>+</sup> is the antiparticle of the electron. Quarks have antiquarks: the anti-up quark has charge &minus;&#8532;e. When a particle meets its antiparticle, they can annihilate and turn into energy (photons).</p>
${trap(`Calling the proton a fundamental particle. It is a baryon made of three quarks. The electron is fundamental, because it is a lepton.`)}`;

/* ---------- Saved progress and past attempts (on this device) ---------- */
const HIST_MAX = 60;
function mkey(kind){ const st = state.student || loadStudent() || {}; return "sp025_"+kind+"_"+String(st.matric||"anon").toUpperCase(); }
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function rawProg(){ const P = lsGet(mkey("prog"), {}); P.theory = P.theory || {}; P.diag = P.diag || {}; return P; }
function getProg(){ const P = rawProg(), out = {theory:{}, diag:{}};
  ["theory","diag"].forEach(k => Object.keys(P[k]).forEach(c => { if(P[k][c] && !P[k][c].del) out[k][c] = P[k][c]; })); return out; }
function setProg(kind, chId, snap){
  const P = rawProg(); const v = snap ? Object.assign(snap, {savedAt: Date.now()}) : {del:true, savedAt: Date.now()};
  P[kind][chId] = v; lsSet(mkey("prog"), P); queuePut("prog:"+kind+":"+chId, v);
}
function getHist(){ return lsGet(mkey("hist"), []); }
function storeHist(H){ H.sort((a,b) => b.at - a.at); H = H.slice(0, HIST_MAX); while(H.length && !lsSet(mkey("hist"), H)) H.pop(); }
function addHist(entry){ const H = getHist(); H.unshift(entry); storeHist(H); queuePut("hist:"+entry.at, entry); }

/* ---------- Online sync (PIN sign-in) ---------- */
function tokKey(m){ return "sp025_tok_" + String(m||"").toUpperCase(); }
function getTok(m){ try{ return localStorage.getItem(tokKey(m)) || ""; }catch(e){ return ""; } }
function setTok(m, t){ try{ if(t) localStorage.setItem(tokKey(m), t); else localStorage.removeItem(tokKey(m)); }catch(e){} }
function api(payload){
  return new Promise(res => {
    if(GAS){ google.script.run.withSuccessHandler(r => res(r || {ok:false})).withFailureHandler(e => res({ok:false, offline:true, error:String(e && e.message || e)})).api(payload); return; }
    if(!ON_WEB_HOST){ res({ok:false, preview:true}); return; }
    const attempt = n => fetch(EXEC_URL, { method:"POST", body: JSON.stringify(payload), headers:{ "Content-Type":"text/plain;charset=utf-8" }, credentials:"omit", redirect:"follow" })
      .then(r => r.json()).then(res)
      .catch(() => n > 0 ? setTimeout(() => attempt(n-1), 1500) : res({ok:false, offline:true, error:"no internet connection or server busy"}));
    attempt(1);
  });
}
function signedIn(){ const st = state.student; return !!(HAS_BACKEND && st && st.matric && getTok(st.matric)); }
function authFailed(){ const st = state.student; if(st) setTok(st.matric, ""); }
let flushTimer = null, flushing = false;
function queuePut(key, value){
  if(!signedIn()) return;
  const q = lsGet(mkey("queue"), {}); q[key] = JSON.stringify(value); lsSet(mkey("queue"), q);
  clearTimeout(flushTimer); flushTimer = setTimeout(flushQueue, 1200);
}
async function flushQueue(){
  if(flushing || !signedIn()) return; flushing = true;
  try{
    const st = state.student, qk = mkey("queue");
    for(const key of Object.keys(lsGet(qk, {}))){
      const data = lsGet(qk, {})[key]; if(data == null) continue;
      const r = await api({action:"put", matric:st.matric, token:getTok(st.matric), key, data});
      if(r.ok){ const q = lsGet(qk, {}); if(q[key] === data){ delete q[key]; lsSet(qk, q); } }
      else { if(r.auth === false) authFailed(); clearTimeout(flushTimer); flushTimer = setTimeout(flushQueue, 15000); return; }
    }
  } finally { flushing = false; }
  if(Object.keys(lsGet(mkey("queue"), {})).length){ clearTimeout(flushTimer); flushTimer = setTimeout(flushQueue, 1200); }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flushQueue(); });
async function pull(){
  if(!signedIn()) return false;
  const st = state.student;
  const r = await api({action:"load", matric:st.matric, token:getTok(st.matric)});
  if(!r.ok){ if(r.auth === false) authFailed(); return false; }
  let changed = false;
  const P = rawProg(), H = getHist(), have = new Set(H.map(h => h.at)), onServer = {};
  (r.items || []).forEach(it => { let v; try{ v = JSON.parse(it.data); }catch(e){ return; } onServer[it.key] = v;
    const m = /^prog:(theory|diag):(\d+)$/.exec(it.key);
    if(m){ const cur = P[m[1]][m[2]]; if(!cur || (v.savedAt||0) > (cur.savedAt||0)){ P[m[1]][m[2]] = v; changed = true; } }
    else if(/^hist:/.test(it.key) && !have.has(v.at)){ H.push(v); have.add(v.at); changed = true; } });
  lsSet(mkey("prog"), P); if(changed) storeHist(H);
  ["theory","diag"].forEach(k => Object.keys(P[k]).forEach(c => { const sv = onServer["prog:"+k+":"+c];
    if(!sv || (P[k][c].savedAt||0) > (sv.savedAt||0)) queuePut("prog:"+k+":"+c, P[k][c]); }));
  getHist().forEach(h => { if(!onServer["hist:"+h.at]) queuePut("hist:"+h.at, h); });
  flushQueue();
  return changed;
}
function withTimeout(p, ms){ return Promise.race([p, new Promise(r => setTimeout(() => r("timeout"), ms))]); }
function permOf(shuffled, orig){ return shuffled.map(o => orig.indexOf(o)); }
/* theory snapshot */
function theorySnap(){
  const T = state.theory, ch = state.chapter;
  return { ch: ch.id, wk: (state.lesson||{}).wk, idx: T.idx, startedAt: T.startedAt, ans: T.ans,
    secs: T.secs.map((s,si) => {
      const base = (THEORY[ch.id]||[]).find(x => x.sub === s.sub);
      if(s.review) return { sub:s.sub, symqs:s.qs };
      if(!base) return { sub:s.sub, full:s };
      return { sub:s.sub, perms: s.qs.map((q,qi) => permOf(q.opts, base.qs[qi].opts)) };
    }) };
}
function theoryFromSnap(snap){
  try{
    const secs = snap.secs.map(s => {
      if(s.full) return s.full;
      if(s.symqs){ const L = weekOf(snap.wk); const sym = symbolsSection(snap.ch, L && L.subs)[0]; return Object.assign({}, sym, {qs: s.symqs}); }
      const base = THEORY[snap.ch].find(x => x.sub === s.sub);
      return Object.assign({}, base, { qs: s.perms.map((perm,qi) => { const oq = base.qs[qi];
        if(!oq || perm.some(j => j < 0 || !oq.opts[j])) throw 0;
        return Object.assign({type:"mcq", sub:base.sub, skill:"theory"}, oq, {opts: perm.map(j => oq.opts[j])}); }) });
    });
    return { secs, idx: Math.min(snap.idx, secs.length-1), ans: snap.ans, startedAt: snap.startedAt };
  }catch(e){ return null; }
}
/* diagnostic snapshot */
function diagSnap(){
  const ch = state.chapter;
  return { ch: ch.id, i: state.i, startedAt: state.startedAt, answers: state.answers,
    perms: state.qs.map((q,i) => q.parts.map((p,pi) => p.type==="mcq" ? permOf(p.opts, ch.diagnostic[i].parts[pi].opts) : null)) };
}
function diagFromSnap(ch, snap){
  try{
    const qs = ch.diagnostic.map((oq,i) => Object.assign({}, oq, { parts: oq.parts.map((p,pi) => {
      if(p.type !== "mcq") return p;

/* ---------- Symbols and units ---------- */
const SYMQ_N = 6;
/* Lessons: each replaces one 1-hour lecture (number per chapter follows the SP025 planner).

const WEEKS = [

/* Chapter start dates, set by the lecturer in the Settings tab of the Sheet */
let SETTINGS = { starts:{} };
try{ SETTINGS = JSON.parse(localStorage.getItem("sp025_settings")) || SETTINGS; }catch(e){}

function startOf(ch){ const v = (SETTINGS.starts||{})[ch]; if(!v) return null; const [y,m,d] = v.split("-").map(Number); return new Date(y, m-1, d); }
function today0(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function fmtDay(d){ try{ return d.toLocaleDateString("en-GB",{weekday:"short", day:"numeric", month:"short"}); }catch(e){ return ""; } }
function doneLessons(){ const S = new Set(); try{ getHist().forEach(h => { if(h.type==="Theory" && h.wk) S.add(h.wk); }); }catch(e){} return S; }
function dueBoxHTML(){

const lessonSecs = L => (THEORY[L.ch]||[]).filter(s => L.subs.includes(s.sub));
const lessonQs = L => lessonSecs(L).reduce((t,s)=>t+s.qs.length,0) + SYMQ_N;
const UNIT_POOL = ["N","J","W","C","V","Ω","T","Hz","m","s","kg","A","F","H","Wb","m s<sup>−1</sup>","no unit"];
function symTable(sym, title){
  if(!sym || !sym.length) return "";
  return `<div class="symbox"><div class="symh">${title}</div><table class="sym"><tr><th>Symbol</th><th>Meaning</th><th>SI unit</th></tr>${sym.map(r => `<tr><td class="s">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>`;
}
function noUnit(u){ return String(u).charAt(0) === "—"; }
function baseSym(x){ return String(x).split(" (")[0].trim(); }
function baseUnit(u){ return String(u).split(" (")[0].trim(); }
function chapterSyms(id, subs){
  const seen = {}, out = [];
  (THEORY[id]||[]).filter(s => !subs || subs.includes(s.sub)).forEach(s => (s.sym||[]).forEach(r => { const k = r[0]+"|"+r[1]; if(!seen[k]){ seen[k]=1; out.push(r); } }));
  return out;
}
function symbolsSection(id, subs){
  const mine = chapterSyms(id, subs), all = chapterSyms(id); if(mine.length < 2) return [];
  const pick = shuffle(mine.slice()), qs = [];
  for(const r of pick){
    if(qs.length >= SYMQ_N) break;
    const askUnit = qs.length % 2 === 1 && !noUnit(r[2]);
    const sb = baseSym(r[0]);
    if(askUnit){
      const cu = baseUnit(r[2]);
      let w = shuffle(all.map(x => x[2]).filter(u => !noUnit(u) && baseUnit(u) !== cu));
      w = w.concat(shuffle(UNIT_POOL.filter(u => baseUnit(u) !== cu)));
      const ds = []; w.forEach(u => { if(ds.length<3 && !ds.some(d => baseUnit(d)===baseUnit(u))) ds.push(u); });
      qs.push(Q("C1", `What is the SI unit of <b>${sb}</b> (${r[1].charAt(0).toLowerCase()+r[1].slice(1)})?`, r[2], ds, `${sb} is the ${r[1].charAt(0).toLowerCase()+r[1].slice(1)}, measured in ${r[2]}.`));
    } else {
      const ds = []; shuffle(all.filter(x => baseSym(x[0]) !== sb && x[1] !== r[1])).forEach(x => { if(ds.length<3 && !ds.includes(x[1])) ds.push(x[1]); });
      if(ds.length < 3) continue;
      qs.push(Q("C1", `In this chapter, what does the symbol <b>${sb}</b> represent?`, r[1], ds, noUnit(r[2]) ? `${sb}: ${r[1]}.` : `${sb}: ${r[1]} (SI unit: ${r[2]}).`));
    }
  }
  return [{ sub:"Sym", title:"Symbols and units check", review:true,
    html:`<p>Before you finish, check that you know what every symbol in this lesson means and what it is measured in. PSPM questions expect the correct SI unit in every final answer.</p>`,
    sym: mine, qs }];
}

/* ---------- Theory lesson ---------- */

/* ---------- Diagnostic ---------- */
function startDiagnostic(ch){
  state.chapter = ch; state.result = null; state.saveMsg = null; state.practice = null;
  const saved = getProg().diag[ch.id], qs = saved && diagFromSnap(ch, saved);
  if(qs){ state.qs = qs; state.answers = saved.answers; state.i = Math.min(saved.i, qs.length-1); state.startedAt = saved.startedAt; renderQ(); return; }
  state.qs = ch.diagnostic.map(prepQ);

}
function renderQ(){
  toTop();

  app.innerHTML = `
