      Q("C1","Magnetic flux is defined as","the scalar product of the magnetic flux density and the area vector",[["the force on a unit current in a magnetic field","That describes B."],["the rate of change of magnetic field","Flux is BA cos θ, not a rate."],["the vector product of B and A","Flux is a scalar (dot) product."]],"φ = B · A = BA cos θ."),
      Q("C2","Which statement about magnetic flux is NOT TRUE?","It does not depend on the area it passes through",
        [["It is zero when the field is parallel to the surface","This is true: cos 90° = 0."],["It represents the total magnetic field passing through a surface","This is true: it counts the field lines through the area."],["It is a scalar quantity","This is true: it is a dot product."]],"φ = BA cos θ depends directly on the area A."),
      Q("C2","The flux through a flat coil is maximum when","the magnetic field is perpendicular to the plane of the coil",[["the field is parallel to the plane of the coil","Then no field lines pass through, so φ = 0."],["the field is at 45° to the plane","cos θ &lt; 1 at that angle."],["the coil has no turns","The number of turns affects flux linkage, not φ."]],"θ (between B and the normal) = 0 gives cos θ = 1.") ] },

  { sub:"5.2", title:"Induced emf, Faraday's law and Lenz's law",
    html:`<p><b>Faraday's experiment:</b> moving a magnet into or out of a coil makes a galvanometer deflect. An emf is induced only while the flux through the coil is <b>changing</b>. A magnet held still inside the coil induces nothing.</p>
    <p><b>Faraday's law:</b> the magnitude of the induced emf is directly proportional to the <b>rate of change of magnetic flux linkage</b>.</p>
    <p><b>Lenz's law:</b> the induced current always flows in a direction that <b>opposes the change</b> in flux producing it. This is the meaning of the minus sign.</p>
    <div class="formula" data-tex="\\varepsilon=-N\\dfrac{d\\phi}{dt}||\\text{straight conductor: } \\varepsilon=Blv\\sin\\theta||\\text{rotating coil: } \\varepsilon=NAB\\omega\\sin\\omega t">ε = −N dφ/dt &nbsp;&nbsp; straight conductor: ε = Blv sin θ &nbsp;&nbsp; rotating coil: ε = NABω sin ωt</div>
    <ul><li>The induced current direction in a moving straight conductor is given by Fleming's right-hand rule.</li>
    <li>For a rotating coil, the peak emf NABω increases with more turns, a stronger field, a larger area, or faster rotation.</li></ul>`,
    sym:[["ε","Induced emf","V"],["dφ/dt","Rate of change of magnetic flux","Wb s<sup>−1</sup>"],["l","Length of the moving conductor","m"],["v","Speed of the conductor","m s<sup>−1</sup>"],["ω","Angular velocity of the rotating coil","rad s<sup>−1</sup>"]],
    qs:[
      Q("C1","Faraday's law states that the induced emf is directly proportional to","the rate of change of magnetic flux linkage",[["the change of magnetic flux","It is how <i>fast</i> the flux changes that matters."],["the magnetic field multiplied by time","That is not the law."],["the current divided by time","Faraday's law is about flux, not current."]],"ε = −N dφ/dt."),
      Q("C1","Which law is used to find the direction of the induced current?","Lenz's law",[["Faraday's law","Faraday gives the size of the emf."],["Coulomb's law","Coulomb's law is about forces between charges."],["Ohm's law","Ohm's law relates V, I and R."]],"Lenz: the induced current opposes the change that causes it."),
      Q("C2","A magnet is held stationary inside a coil. The induced emf in the coil is","zero, because the flux is not changing",[["maximum, because the flux is largest","A large but steady flux induces nothing."],["equal to the magnet's field strength","Emf depends on the rate of change of flux."],["changing direction continuously","Nothing is changing, so there is no emf."]],"Induction needs a changing flux: dφ/dt = 0 gives ε = 0."),
      Q("C2","The negative sign in ε = −N dφ/dt shows that","the induced emf opposes the change in flux that produces it (Lenz's law)",[["the emf is always negative","The sign is about direction relative to the change."],["the flux decreases with time","It applies to any change, increasing or decreasing."],["energy is destroyed","Lenz's law is a consequence of energy conservation."]],"The minus sign is Lenz's law."),
      Q("C2","Which change will NOT increase the maximum emf induced in a coil rotating in a uniform magnetic field?","Using thicker wire with the same number of turns",[["Increasing the number of turns","ε<sub>max</sub> = NABω increases with N."],["Rotating the coil faster","ε<sub>max</sub> increases with ω."],["Using a stronger magnet","ε<sub>max</sub> increases with B."]],"ε<sub>max</sub> = NABω. Wire thickness does not appear.") ] },

  { sub:"5.3", title:"Self-inductance",
    html:`<p><b>Self-inductance</b> is the property of a coil by which a <b>changing current in the coil itself</b> induces an emf (a back emf) that opposes the change. The self-inductance L is the ratio of the self-induced emf to the rate of change of current.</p>
    <div class="formula" data-tex="\\varepsilon=-L\\dfrac{dI}{dt}||L=\\dfrac{N\\phi}{I}||L_{\\text{solenoid}}=\\dfrac{\\mu_0N^2A}{l}||L_{\\text{coil}}=\\dfrac{\\mu_0N^2A}{2r}">ε = −L dI/dt &nbsp;&nbsp; L = Nφ / I &nbsp;&nbsp; L<sub>solenoid</sub> = μ<sub>0</sub>N<sup>2</sup>A / l &nbsp;&nbsp; L<sub>coil</sub> = μ<sub>0</sub>N<sup>2</sup>A / 2r</div>
    <ul><li>Unit: henry (H = V s A<sup>−1</sup> = Wb A<sup>−1</sup>).</li></ul>`,
    sym:[["L","Self-inductance","H"],["dI/dt","Rate of change of current","A s<sup>−1</sup>"],["l","Length of the solenoid","m"]],
    qs:[
      Q("C1","Producing an induced emf in a coil because of a changing current in the SAME coil is called","self-induction",[["mutual induction","Mutual induction involves a second, nearby coil."],["magnetic flux","Flux is a quantity, not a process."],["flux linkage","Flux linkage is Nφ, a quantity."]],"The coil induces a back emf in itself."),
      Q("C1","The henry is equivalent to","V s A<sup>−1</sup>",[["V A s<sup>−1</sup>","From L = ε/(dI/dt): V ÷ (A s<sup>−1</sup>) = V s A<sup>−1</sup>."],["Wb A","L = Nφ/I gives Wb A<sup>−1</sup>."],["T m<sup>2</sup>","That is the weber."]],"L = ε/(dI/dt), so 1 H = 1 V s A<sup>−1</sup>.") ] },

  { sub:"5.4", title:"Energy stored in an inductor",
    html:`<div class="formula" data-tex="U=\\tfrac12LI^2">U = ½LI<sup>2</sup></div><p>Work is done against the back emf while the current builds up. This energy is stored in the <b>magnetic field</b> of the inductor.</p>`,
    sym:[["U","Energy stored in the inductor","J"]],
    qs:[ Q("C2","The energy stored in a current-carrying inductor is stored in its","magnetic field",[["electric field","Capacitors store energy in electric fields."],["resistance, as heat","Heat is lost energy, not stored energy."],["insulation","The energy is in the magnetic field of the coil."]],"U = ½LI<sup>2</sup> is stored in the magnetic field.") ] },

  { sub:"5.5", title:"Mutual inductance",
    html:`<p><b>Mutual inductance</b> is the ratio of the emf induced in one coil to the rate of change of current in another, nearby coil.</p>
    <div class="formula" data-tex="\\varepsilon_2=-M\\dfrac{dI_1}{dt}||M=\\dfrac{\\mu_0N_1N_2A}{l}\\ \\text{(two coaxial solenoids)}">ε<sub>2</sub> = −M dI<sub>1</sub>/dt &nbsp;&nbsp; M = μ<sub>0</sub>N<sub>1</sub>N<sub>2</sub>A / l (two coaxial solenoids)</div><ul><li>Unit: henry (H).</li></ul>`,
    sym:[["M","Mutual inductance","H"],["N<sub>1</sub>, N<sub>2</sub>","Number of turns in coils 1 and 2","no unit"]],
    qs:[ Q("C2","Mutual induction is the production of an emf in a solenoid due to","a changing current in a nearby solenoid",[["a changing current in the same solenoid","That is self-induction."],["a steady current in a nearby solenoid","The current must change."],["the motion of a wire in a magnetic field","That is motional emf."]],"A changing I<sub>1</sub> changes the flux linking coil 2, which induces ε<sub>2</sub>.") ] }
];


/* ---------- Chapter 6: Alternating Current ---------- */
THEORY[6] = [
  { sub:"6.1", title:"Alternating current",
    html:`<p><b>Alternating current (AC)</b> is a current whose magnitude and direction change periodically. Its waveform is a sine curve (sinusoidal).</p>
    <div class="formula" data-tex="V=V_0\\sin\\omega t||I=I_0\\sin\\omega t||\\omega=2\\pi f=\\dfrac{2\\pi}{T}">V = V<sub>0</sub> sin ωt &nbsp;&nbsp; I = I<sub>0</sub> sin ωt &nbsp;&nbsp; ω = 2πf = 2π/T</div>
    <ul><li>V<sub>0</sub> and I<sub>0</sub> are the peak (maximum) values. The sign of I shows the direction of flow at that instant.</li></ul>`,
    sym:[["V","Instantaneous voltage","V"],["V<sub>0</sub>","Peak (maximum) voltage","V"],["I<sub>0</sub>","Peak (maximum) current","A"],["ω","Angular frequency","rad s<sup>−1</sup>"],["f","Frequency","Hz"],["T","Period","s"]],
    qs:[
      Q("C1","A current whose magnitude and direction reverse periodically is called","alternating current",[["direct current","Direct current flows in one direction only."],["induced current","An induced current may or may not alternate."],["steady current","A steady current does not change."]],"AC changes its direction and size periodically."),
      Q("C2","A supply is described by V = 325 sin (100πt). Its frequency is","50 Hz",[["100 Hz","ω = 100π = 2πf, so f = 50 Hz."],["100π Hz","100π is the angular frequency in rad s<sup>−1</sup>."],["325 Hz","325 V is the peak voltage."]],"ω = 2πf → f = 100π/2π = 50 Hz.") ] },

  { sub:"6.2", title:"Root mean square (rms) values",
    html:`<p><b>Rms current:</b> the value of the steady direct current that produces the same power (heating) in a resistor as the alternating current. The rms voltage is defined in the same way.</p>
    <div class="formula" data-tex="I_{\\text{rms}}=\\dfrac{I_0}{\\sqrt2}||V_{\\text{rms}}=\\dfrac{V_0}{\\sqrt2}">I<sub>rms</sub> = I<sub>0</sub>/√2 &nbsp;&nbsp; V<sub>rms</sub> = V<sub>0</sub>/√2</div>
    <ul><li>Rms values are also called the effective values. Mains ratings (e.g. 240 V) and AC meter readings are rms values.</li></ul>`,
    sym:[["I<sub>rms</sub>","Root mean square current","A"],["V<sub>rms</sub>","Root mean square voltage","V"]],
    qs:[
      Q("C1","The rms value of an alternating current is","the steady direct current that produces the same power in a resistor",[["the average value of the current over one cycle","The average over a full cycle is zero."],["the peak value of the current","I<sub>rms</sub> = I<sub>0</sub>/√2 is less than the peak."],["half of the peak current","I<sub>rms</sub> = I<sub>0</sub>/√2 ≈ 0.707 I<sub>0</sub>."]],"Rms is defined by equal heating."),
      Q("C2","A mains supply is labelled 240 V. This value is the","rms voltage",[["peak voltage","The peak is 240√2 ≈ 340 V."],["average voltage","The average over a full cycle is zero."],["peak-to-peak voltage","Ratings are given as rms values."]],"Mains and meter readings are rms values.") ] },

  { sub:"6.3", title:"Resistance, reactance and impedance",
    html:`<p>A <b>phasor</b> is a vector that rotates anticlockwise at angular frequency ω. Its length is the peak value, and its projection on the y-axis gives the instantaneous value.</p>
    <table class="cmp"><tr><th>Pure component</th><th>Phase</th><th>Opposition</th></tr>
    <tr><td>Resistor R</td><td>I and V <b>in phase</b></td><td>R (does not depend on f)</td></tr>
    <tr><td>Capacitor C</td><td>I <b>leads</b> V by π/2</td><td>X<sub>C</sub> = 1/2πfC (decreases as f increases)</td></tr>
    <tr><td>Inductor L</td><td>V <b>leads</b> I by π/2</td><td>X<sub>L</sub> = 2πfL (increases as f increases)</td></tr></table>
    <div class="formula" data-tex="Z=\\sqrt{R^2+\\left(X_L-X_C\\right)^2}||\\tan\\phi=\\dfrac{X_L-X_C}{R}">Z = √[R<sup>2</sup> + (X<sub>L</sub> − X<sub>C</sub>)<sup>2</sup>] &nbsp;&nbsp; tan φ = (X<sub>L</sub> − X<sub>C</sub>)/R</div>
    <ul><li><b>Impedance Z</b> is the total opposition of a circuit to alternating current. Unit: Ω.</li>
    <li><b>Resonance</b> in a series RLC circuit happens when X<sub>L</sub> = X<sub>C</sub>. Then Z is <b>minimum</b> (Z = R), the current is <b>maximum</b>, and V and I are in phase. The resonant frequency is f<sub>0</sub> = 1/(2π√LC).</li></ul>`,
    sym:[["X<sub>C</sub>","Capacitive reactance","Ω"],["X<sub>L</sub>","Inductive reactance","Ω"],["Z","Impedance","Ω"],["φ","Phase angle between the supply voltage and the current","rad (or °)"],["L","Inductance","H"],["C","Capacitance","F"],["f<sub>0</sub>","Resonant frequency","Hz"]],
    qs:[
      Q("C2","For a pure resistor in an AC circuit,","the current is in phase with the voltage",[["the current leads the voltage by π/2","That is a pure capacitor."],["the voltage leads the current by π/2","That is a pure inductor."],["the current lags the voltage by π","A resistor gives no phase difference."]],"In a resistor V = IR at every instant, so they are in phase."),
      Q("C2","For a pure capacitor in an AC circuit,","the current leads the voltage by π/2 rad",[["the current is in phase with the voltage","That is a resistor."],["the voltage leads the current by π/2 rad","That is an inductor."],["the current lags the voltage by π rad","The phase difference is π/2, with I ahead."]],"Remember 'ICE': in a Capacitor, I comes before E (voltage)."),
      Q("C2","For a pure inductor in an AC circuit,","the voltage leads the current by π/2 rad",[["the current leads the voltage by π/2 rad","That is a capacitor."],["the current and voltage are in phase","That is a resistor."],["the voltage lags the current by π/2 rad","In an inductor, V is ahead."]],"Remember 'ELI': in an inductor (L), E (voltage) comes before I."),
      Q("C2","When the frequency of the AC supply increases, the inductive reactance","increases in direct proportion to the frequency",[["decreases in direct proportion","X<sub>L</sub> = 2πfL increases with f."],["increases with the square of the frequency","X<sub>L</sub> ∝ f, not f<sup>2</sup>."],["is inversely proportional to the frequency","That describes X<sub>C</sub>."]],"X<sub>L</sub> = 2πfL ∝ f."),
      Q("C2","When the frequency of the AC supply increases, the capacitive reactance","decreases",[["increases","X<sub>C</sub> = 1/2πfC falls as f rises."],["stays the same","X<sub>C</sub> depends on f."],["becomes infinite","X<sub>C</sub> is infinite only for DC (f = 0)."]],"X<sub>C</sub> ∝ 1/f."),
      Q("C1","The impedance Z of an AC circuit is","the total opposition of the circuit to alternating current",[["the frequency at which resonance occurs","That is the resonant frequency."],["the condition where voltage and current are in phase","That describes resonance or a pure resistor."],["the energy stored per cycle","Impedance is measured in ohms."]],"Z combines R, X<sub>L</sub> and X<sub>C</sub>."),
      Q("C2","Resonance in a series RLC circuit occurs when","the impedance is minimum",[["the resistance is maximum","R does not change with frequency."],["the current is minimum","At resonance the current is maximum."],["the power is negative","The average power is positive, and at its largest at resonance."]],"X<sub>L</sub> = X<sub>C</sub> gives Z = R (minimum), so I is maximum."),
      Q("C2","Which statement about a phasor diagram is NOT TRUE?","It shows the relationship between time and the maximum voltage",
        [["It shows the phase relationship between current and voltage","This is true: that is its purpose."],["The projection of a phasor on the y-axis gives the instantaneous value","This is true."],["Each phasor rotates about the origin at angular frequency ω, with length equal to the peak value","This is true."]],"A phasor diagram shows phase relationships, not a graph of voltage against time.") ] },

  { sub:"6.4", title:"Power and power factor",
    html:`<div class="formula" data-tex="P_{\\text{av}}=I_{\\text{rms}}V_{\\text{rms}}\\cos\\phi||P=IV\\ \\text{(instantaneous)}||\\text{power factor } \\cos\\phi=\\dfrac{P_{\\text{av}}}{I_{\\text{rms}}V_{\\text{rms}}}=\\dfrac{R}{Z}">P<sub>av</sub> = I<sub>rms</sub>V<sub>rms</sub> cos φ &nbsp;&nbsp; P = IV (instantaneous) &nbsp;&nbsp; power factor cos φ = P<sub>av</sub> / (I<sub>rms</sub>V<sub>rms</sub>) = R/Z</div>
    <ul><li>The <b>average (real) power</b> is dissipated only in the resistance.</li>
    <li>For a <b>pure resistor</b>, φ = 0, so cos φ = 1.</li>
    <li>For a <b>pure capacitor or pure inductor</b>, φ = π/2, so cos φ = 0. <b>No average power</b> is dissipated: energy is stored and returned each cycle.</li>
    <li>The power factor is the ratio of real power to apparent power. It has no unit.</li></ul>`,
    sym:[["P<sub>av</sub>","Average (real) power","W"],["P","Instantaneous power","W"],["cos φ","Power factor","no unit"],["I<sub>rms</sub>V<sub>rms</sub>","Apparent power","V A"]],
    qs:[
      Q("C2","An AC voltage is applied separately to a pure resistor, a pure capacitor and a pure inductor. Which statement is NOT TRUE?","The power factor of the pure capacitor circuit is 1",
        [["No average power is dissipated in the pure inductor","This is true: φ = π/2, so cos φ = 0."],["No average power is dissipated in the pure capacitor","This is true: φ = π/2, so cos φ = 0."],["The pure resistor dissipates average power I<sub>rms</sub>V<sub>rms</sub>","This is true: cos φ = 1."]],"For a pure capacitor φ = π/2, so the power factor is 0, not 1."),
      Q("C1","The power factor of an AC circuit is","the ratio of the average (real) power to the apparent power",[["the product of I<sub>rms</sub> and V<sub>rms</sub>","That is the apparent power."],["the ratio of reactance to resistance","That is tan φ."],["the peak power divided by the rms power","The power factor is cos φ = P<sub>av</sub>/(I<sub>rms</sub>V<sub>rms</sub>)."]],"cos φ = P<sub>av</sub>/(I<sub>rms</sub>V<sub>rms</sub>) = R/Z."),
      Q("C2","In a series RLC circuit, average power is dissipated in","the resistor only",[["the inductor only","An ideal inductor stores and returns energy."],["the capacitor only","An ideal capacitor stores and returns energy."],["all three components equally","Only R turns electrical energy into heat."]],"Real power loss happens only in resistance.") ] }
];

/* ---------- Chapter 7: Optics ---------- */
THEORY[7] = [
  { sub:"7.1", title:"Reflection at a spherical surface",
    html:`<div class="formula" data-tex="R=2f||\\dfrac1f=\\dfrac1u+\\dfrac1v||M=\\dfrac{h_i}{h_o}=-\\dfrac{v}{u}">R = 2f &nbsp;&nbsp; 1/f = 1/u + 1/v &nbsp;&nbsp; M = h<sub>i</sub>/h<sub>o</sub> = −v/u</div>
    <ul><li><b>Sign convention:</b> f and R are <b>positive for a concave</b> mirror and <b>negative for a convex</b> mirror. A positive v is a real image (in front of the mirror). A negative v is a virtual image (behind the mirror).</li>
    <li><b>Magnification:</b> negative M means an <b>inverted</b> image. Positive M means an upright image. |M| &gt; 1 means magnified, and |M| &lt; 1 means diminished.</li>
    <li>A <b>convex mirror</b> always forms a virtual, upright, diminished image.</li>
    <li>Ray diagrams use at least two rays: parallel to the axis then through (or from) F, through C back on itself, or through F then parallel.</li></ul>`,
    sym:[["f","Focal length","m"],["R","Radius of curvature","m"],["u","Object distance","m"],["v","Image distance","m"],["M","Linear magnification","no unit"],["h<sub>i</sub>, h<sub>o</sub>","Image height and object height","m"]],
    qs:[
      Q("C1","The focal length of a convex mirror is always","negative",[["positive","Positive f is for concave mirrors."],["infinite","Only a plane mirror has infinite f."],["zero","A curved mirror has a finite focal length."]],"Sign convention: convex mirror f and R are negative."),
      Q("C2","A negative magnification, M, means the image is","inverted",[["upright","Upright images have positive M."],["magnified","Size depends on |M|, not on the sign."],["diminished","Size depends on |M|, not on the sign."]],"The sign of M shows orientation. Its size shows magnification."),
      Q("C2","The image formed by a convex mirror is always","virtual, upright and diminished",[["real, inverted and diminished","A convex mirror cannot form a real image of a real object."],["virtual, upright and magnified","That is a concave mirror with the object inside F."],["real, inverted and the same size","That is a concave mirror with the object at C."]],"This is why convex mirrors are used as wide-view security and car wing mirrors."),
      Q("C1","For a spherical mirror, the radius of curvature R and the focal length f are related by","R = 2f",[["f = 2R","The focus is halfway between the pole and C."],["R = f","C and F are different points."],["R = f/2","The focus is halfway between the pole and C, so R = 2f."]],"F is halfway between the pole and the centre of curvature.") ] },

  { sub:"7.2", title:"Refraction at a spherical surface",
    html:`<div class="formula" data-tex="\\dfrac{n_1}{u}+\\dfrac{n_2}{v}=\\dfrac{n_2-n_1}{R}">n<sub>1</sub>/u + n<sub>2</sub>/v = (n<sub>2</sub> − n<sub>1</sub>)/R</div>
    <ul><li>n<sub>1</sub> is the refractive index of the medium the object is in. n<sub>2</sub> is the refractive index of the medium the light enters.</li>
    <li><b>Sign convention for R:</b> positive for a <b>convex</b> surface facing the object, negative for a <b>concave</b> surface.</li>
    <li>Refractive index is a ratio of speeds, so it has no unit.</li></ul>`,
    sym:[["n<sub>1</sub>","Refractive index of the medium containing the object","no unit"],["n<sub>2</sub>","Refractive index of the second medium","no unit"],["R","Radius of curvature of the refracting surface","m"]],
    qs:[
      Q("C2","When using n<sub>1</sub>/u + n<sub>2</sub>/v = (n<sub>2</sub> − n<sub>1</sub>)/R, the radius of curvature of a concave refracting surface is taken as","negative",[["positive","Positive R is for convex surfaces."],["zero","A curved surface has a finite R."],["always equal to the focal length","There is no such rule."]],"Sign convention: convex R is positive, concave R is negative."),
      Q("C1","The refractive index of a material has the unit","none (it is dimensionless)",[["m s<sup>−1</sup>","n = c/v is a ratio of two speeds."],["m","n is a ratio, not a length."],["degree","n is not an angle."]],"n = c/v: speed ÷ speed gives no unit.") ] },

  { sub:"7.3", title:"Thin lenses",
    html:`<div class="formula" data-tex="\\dfrac1f=\\dfrac1u+\\dfrac1v||M=\\dfrac{h_i}{h_o}=-\\dfrac{v}{u}||\\text{lens maker's: } \\dfrac1f=\\left(\\dfrac{n_{\\text{material}}}{n_{\\text{medium}}}-1\\right)\\left(\\dfrac{1}{R_1}-\\dfrac{1}{R_2}\\right)">1/f = 1/u + 1/v &nbsp;&nbsp; M = h<sub>i</sub>/h<sub>o</sub> = −v/u &nbsp;&nbsp; lens maker's: 1/f = (n<sub>material</sub>/n<sub>medium</sub> − 1)(1/R<sub>1</sub> − 1/R<sub>2</sub>)</div>
    <ul><li><b>Sign convention:</b> f is <b>positive for a convex</b> (converging) lens and <b>negative for a concave</b> (diverging) lens.</li>
    <li>A concave lens always forms a virtual, upright, diminished image.</li>
    <li>A convex lens with the object at 2F forms a real, inverted, same-size image at 2F.</li>
    <li>If a lens is placed in a medium closer in refractive index to the glass (e.g. water), (n<sub>material</sub>/n<sub>medium</sub> − 1) becomes smaller, so the focal length <b>increases</b>.</li>
    <li>For two lenses: the image from the first lens is the object for the second.</li></ul>`,
    sym:[["n<sub>material</sub>","Refractive index of the lens material","no unit"],["n<sub>medium</sub>","Refractive index of the surrounding medium","no unit"],["R<sub>1</sub>, R<sub>2</sub>","Radii of curvature of the two lens surfaces","m"]],
    qs:[
      Q("C2","The image formed by a concave lens is always","virtual, upright and diminished",[["real, inverted and magnified","A diverging lens cannot form a real image of a real object."],["real, inverted and diminished","A diverging lens cannot form a real image of a real object."],["virtual, upright and magnified","A magnified virtual image comes from a convex lens with the object inside F."]],"Diverging rays only appear to come from a point in front of the lens."),
      Q("C2","A glass convex lens is moved from air into water. Its focal length","increases",[["decreases","n<sub>glass</sub>/n<sub>water</sub> is closer to 1, so 1/f is smaller."],["stays the same","f depends on the surrounding medium."],["becomes negative","Glass (n ≈ 1.5) is still denser than water (n ≈ 1.33), so the lens still converges."]],"The lens maker's equation: a smaller (n<sub>material</sub>/n<sub>medium</sub> − 1) gives a larger f."),
      Q("C1","For the thin lens equation, the focal length of a concave lens is taken as","negative",[["positive","Positive f is for a convex (converging) lens."],["infinite","A curved lens has a finite f."],["equal to its radius of curvature","That relation is not used for lenses."]],"Concave lenses diverge light, so f &lt; 0.") ] },

  { sub:"7.4", title:"Huygens's principle",
    html:`<p><b>Huygens's principle:</b> every point on a wavefront acts as a source of secondary spherical wavelets. The new wavefront a short time later is the surface tangent to (the envelope of) all these wavelets.</p>
    <ul><li>It explains how light spreads out after passing through a slit or around an obstacle (diffraction). It also underlies interference.</li>
    <li>A plane wavefront stays plane in open space. At a narrow slit, the wavelets spread out to form curved (circular) wavefronts.</li></ul>`,
    sym:[["λ","Wavelength","m"]],
    qs:[
      Q("C1","According to Huygens's principle,","each point on a wavefront acts as a source of secondary spherical wavelets",[["light travels as a stream of particles","Huygens's principle is a wave model."],["wavefronts always remain plane","Wavefronts curve after passing through a narrow gap."],["only the centre of a wavefront produces new waves","Every point on the wavefront is a source."]],"The new wavefront is the envelope of these wavelets."),
      Q("C2","Which statement about Huygens's principle is NOT TRUE?","It can explain interference only",[["It can explain diffraction and interference","This is true."],["Each point on a wavefront acts as a secondary source","This is true."],["The new wavefront is tangent to all the secondary wavelets","This is true."]],"Huygens's principle explains diffraction as well as interference.") ] },

  { sub:"7.5", title:"Coherence and interference",
    html:`<p><b>Interference</b> is the superposition of two or more waves meeting at a point, giving a resultant displacement equal to the sum of their displacements (principle of superposition).</p>
    <p><b>Coherent sources</b> have the same frequency (wavelength) and a constant phase difference.</p>
    <p><b>Conditions for observable interference:</b> coherent sources, (nearly) equal amplitudes, monochromatic light, and slit separation small compared with the screen distance.</p>
    <table class="cmp"><tr><th>Sources</th><th>Constructive (bright)</th><th>Destructive (dark)</th></tr>
    <tr><td>In phase</td><td>path difference = mλ</td><td>path difference = (m + ½)λ</td></tr>
    <tr><td>Antiphase</td><td>path difference = (m + ½)λ</td><td>path difference = mλ</td></tr></table>
    <div class="formula" data-tex="\\text{phase difference}=\\dfrac{2\\pi}{\\lambda}\\times\\text{path difference}">phase difference = (2π/λ) × path difference</div>`,
    sym:[["Δ","Path difference between the two waves","m"],["m","Order number (0, 1, 2, ...)","no unit"],["φ","Phase difference","rad"]],
    qs:[
      Q("C1","Two light sources are coherent if they emit waves of","the same wavelength with a constant phase difference",[["the same wavelength only","They must also keep a constant phase difference."],["the same amplitude only","Equal amplitude helps contrast, but coherence means a constant phase difference."],["the same amplitude and wavelength","Coherence needs a constant phase difference, not equal amplitude."]],"Coherent = same frequency and constant phase relationship."),
      Q("C2","Two in-phase coherent sources produce waves that meet at P with a path difference of 1.5λ. At P there is","destructive interference (a dark fringe)",[["constructive interference (a bright fringe)","Constructive needs a whole number of wavelengths for in-phase sources."],["no interference","Coherent waves always interfere."],["a bright fringe of double intensity","1.5λ = (m + ½)λ, which gives destructive interference."]],"For in-phase sources, (m + ½)λ gives a dark fringe."),
      Q("C2","Two antiphase coherent sources produce waves with a path difference of λ at point Q. At Q there is","destructive interference",[["constructive interference","For antiphase sources the conditions are swapped: mλ gives a dark fringe."],["maximum intensity","The initial π phase difference makes mλ destructive."],["no change in intensity","The waves cancel."]],"Antiphase sources: path difference mλ gives destructive interference."),
      Q("C2","Which pair of optical phenomena produces both bright and dark fringes on a screen?","Interference and diffraction",[["Interference and reflection","Reflection alone does not make fringes."],["Diffraction and refraction","Refraction alone does not make fringes."],["Reflection and refraction","Neither produces fringe patterns on its own."]],"Fringes come from superposition, which happens in interference and diffraction.") ] },

  { sub:"7.6", title:"Young's double-slit interference",
    html:`<div class="formula" data-tex="\\text{bright: } y_m=\\dfrac{m\\lambda D}{d}||\\text{dark: } y_m=\\dfrac{\\left(m+\\frac12\\right)\\lambda D}{d}||\\text{fringe separation } \\Delta y=\\dfrac{\\lambda D}{d}">bright: y<sub>m</sub> = mλD/d &nbsp;&nbsp; dark: y<sub>m</sub> = (m + ½)λD/d &nbsp;&nbsp; fringe separation Δy = λD/d</div>
    <ul><li>The central fringe (m = 0) is bright.</li>
    <li>To <b>increase</b> the fringe separation: use a longer wavelength, move the screen further away (larger D), or <b>decrease</b> the slit separation d.</li>
    <li>Blue light (shorter λ) gives fringes closer together than red light.</li></ul>`,
    sym:[["y<sub>m</sub>","Distance of the m-th fringe from the central fringe","m"],["D","Distance from the slits to the screen","m"],["d","Separation between the two slits","m"],["Δy","Fringe separation (fringe width)","m"]],
    qs:[
      Q("C2","Which change increases the fringe separation in a double-slit experiment?","Decreasing the distance between the two slits, d",[["Increasing the distance between the two slits, d","Δy = λD/d gets smaller when d increases."],["Using light of a shorter wavelength","Δy ∝ λ, so a shorter λ gives closer fringes."],["Moving the screen closer to the slits","Δy ∝ D, so a smaller D gives closer fringes."]],"Δy = λD/d."),
      Q("C2","Red light is replaced by blue light in a double-slit experiment. The fringes become","closer together",[["further apart","Blue light has a shorter wavelength, so Δy decreases."],["brighter but at the same spacing","The spacing depends on λ."],["all dark","There are still bright and dark fringes."]],"Δy ∝ λ, and λ<sub>blue</sub> &lt; λ<sub>red</sub>."),
      Q("C2","In Young's double-slit pattern, the central fringe (m = 0) is","bright, because the path difference is zero",[["dark, because the waves cancel","Zero path difference from in-phase slits gives constructive interference."],["the dimmest fringe","It is the central maximum."],["missing","There is always a central fringe."]],"At the centre, both waves travel equal distances.") ] },

  { sub:"7.7", title:"Interference in thin films",
    html:`<p>Light reflected from the top and bottom surfaces of a thin film interferes.</p>
    <ul><li><b>Phase change on reflection:</b> a ray reflecting off a medium of <b>higher</b> refractive index gains a phase change of π (equivalent to a path of ½λ). Reflection off a lower-index medium gives no phase change.</li>
    <li>For a soap film in air, the ray from the top surface (air → film) gains π, and the ray from the bottom surface (film → air) does not. So the two reflected rays are antiphase.</li></ul>
    <table class="cmp"><tr><th>Relative phase of the reflected rays</th><th>Constructive</th><th>Destructive</th></tr>
    <tr><td>No phase difference (non-reflective coating, e.g. air–MgF<sub>2</sub>–glass)</td><td>2nt = mλ</td><td>2nt = (m + ½)λ</td></tr>
    <tr><td>Phase difference π (reflective coating, e.g. soap film in air)</td><td>2nt = (m + ½)λ</td><td>2nt = mλ</td></tr></table>
    <ul><li><b>Applications:</b> anti-reflective coatings on solar panels and lenses (reflected light cancels, so more light is transmitted), and tinted glass that reflects heat.</li></ul>`,
    sym:[["n","Refractive index of the film","no unit"],["t","Thickness of the film","m"]],
    qs:[
      Q("C2","Monochromatic light falls on a soap film in air. What phase change does the ray reflected from the TOP surface of the film experience?","π rad",[["0 rad","It reflects off a denser medium (air → soap), so it gains π."],["π/2 rad","The phase change on reflection is either 0 or π."],["π/4 rad","The phase change on reflection is either 0 or π."]],"Reflection off a higher-index medium gives a phase change of π."),
      Q("C2","A ray inside a soap film reflects off the film–air boundary at the bottom surface. Its phase change is","0",[["π rad","It reflects off a lower-index medium (soap → air), so there is no phase change."],["π/2 rad","The phase change on reflection is either 0 or π."],["2π rad","There is no phase change."]],"Going from a higher to a lower index on reflection gives no phase change."),
      Q("C2","Why is an anti-reflective coating applied to solar panels?","Reflected rays interfere destructively, so more light is transmitted into the panel",[["Reflected rays interfere constructively, so the panel looks brighter","That would reflect more and waste light."],["The coating absorbs all wavelengths","The coating works by interference, not absorption."],["The coating increases the panel's temperature","The aim is to transmit more light."]],"Destructive interference of the reflected light means less energy is reflected and more is transmitted.") ] },

  { sub:"7.8", title:"Diffraction by a single slit",
    html:`<p><b>Diffraction</b> is the spreading (bending) of waves as they pass through an aperture or around the edge of an obstacle. It is most noticeable when the gap is comparable to the wavelength.</p>
    <div class="formula" data-tex="\\text{dark: } y_m=\\dfrac{m\\lambda D}{a}||\\text{bright: } y_m=\\dfrac{\\left(m+\\frac12\\right)\\lambda D}{a}||\\text{width of central maximum}=\\dfrac{2\\lambda D}{a}">dark: y<sub>m</sub> = mλD/a &nbsp;&nbsp; bright: y<sub>m</sub> = (m + ½)λD/a &nbsp;&nbsp; width of central maximum = 2λD/a</div>
    <ul><li>The central bright fringe is the widest and brightest, about <b>twice</b> as wide as the others.</li>
    <li>A <b>narrower slit</b> (smaller a) gives a <b>wider</b> central maximum.</li></ul>`,
    sym:[["a","Width of the single slit","m"]],
    qs:[
      Q("C1","Diffraction is","the spreading of waves as they pass through an opening or around an obstacle",[["the bending of light as it passes from one medium to another","That is refraction."],["the bouncing of light off a surface","That is reflection."],["the splitting of white light into colours by a prism","That is dispersion."]],"Diffraction is most noticeable when the slit width is comparable to λ."),
      Q("C2","In single-slit diffraction, the slit is made narrower. Which statement is TRUE?","The central bright fringe becomes wider",[["The intensity of every fringe becomes the same","The central fringe stays the brightest."],["The central bright fringe becomes dark","The centre is always a bright maximum."],["The pattern becomes brighter overall","Less light gets through a narrower slit."]],"y<sub>1</sub> = λD/a: a smaller a gives a wider central maximum."),
      Q("C2","Compared with the other bright fringes, the central bright fringe in single-slit diffraction is","about twice as wide",[["the same width","It spans from the first dark fringe on one side to the first dark fringe on the other."],["half as wide","The central fringe is the widest."],["narrower but brighter","It is both the widest and the brightest."]],"Its width is 2λD/a, while each other fringe is about λD/a.") ] },

  { sub:"7.9", title:"Diffraction grating",
    html:`<p>A <b>diffraction grating</b> has a large number of equally spaced parallel slits. Light diffracted from all the slits interferes to give sharp, bright maxima.</p>
    <div class="formula" data-tex="d\\sin\\theta=m\\lambda||d=\\dfrac1N">d sin θ = mλ &nbsp;&nbsp; d = 1/N</div>
    <ul><li>The highest order seen is the largest whole number m ≤ d/λ (because sin θ ≤ 1).</li>
    <li><b>More lines per mm</b> (larger N, smaller d) spreads the maxima <b>further apart</b> but gives <b>fewer orders</b>.</li>
    <li>Everyday examples: a CD, muslin cloth.</li></ul>`,
    sym:[["N","Number of lines (slits) per unit length","m<sup>−1</sup>"],["d","Grating spacing (distance between adjacent slits)","m"],["θ","Angle of the m-th order maximum","°"]],
    qs:[
      Q("C2","In a diffraction grating experiment, the number of orders seen can be increased by","using a grating with a larger slit spacing d",[["using light of a longer wavelength","m<sub>max</sub> ≤ d/λ, so a longer λ gives fewer orders."],["moving the screen closer to the grating","The orders depend on d and λ, not on the screen distance."],["using a grating with more lines per unit length","More lines means a smaller d, so fewer orders."]],"m<sub>max</sub> = d/λ (rounded down)."),
      Q("C1","The grating spacing d is related to the number of lines per unit length N by","d = 1/N",[["d = N","More lines per mm means a smaller spacing."],["d = N<sup>2</sup>","d is simply the inverse of N."],["d = Nλ","λ is not part of this relation."]],"If there are N lines per metre, each spacing is 1/N metres."),
      Q("C2","A grating with more lines per millimetre is used with the same light. The first-order maxima appear","at larger angles",[["at smaller angles","A smaller d gives a larger sin θ = λ/d."],["at the same angles","θ depends on d."],["only on one side","Maxima appear symmetrically on both sides."]],"sin θ = mλ/d: a smaller d gives a larger θ.") ] }
];


/* ---------- Chapter 8: Wave Properties of Particle ---------- */
THEORY[8] = [
  { sub:"8.1", title:"De Broglie wavelength",
    html:`<p><b>Wave–particle duality:</b> light behaves as a wave (interference, diffraction) and as a particle (photoelectric effect). In the same way, moving particles such as electrons have wave properties.</p>
    <p><b>De Broglie's hypothesis:</b> every moving particle has a wavelength associated with it, called the de Broglie wavelength.</p>
    <div class="formula" data-tex="\\lambda=\\dfrac{h}{p}=\\dfrac{h}{mv}||\\text{charge accelerated through } V\\text{: } \\lambda=\\dfrac{h}{\\sqrt{2meV}}||\\text{from kinetic energy: } \\lambda=\\dfrac{h}{\\sqrt{2mK}}">λ = h/p = h/mv &nbsp;&nbsp; for a charge accelerated through V: λ = h/√(2meV) &nbsp;&nbsp; from kinetic energy: λ = h/√(2mK)</div>
    <ul><li>A larger momentum gives a <b>shorter</b> wavelength.</li>
    <li>Everyday objects have huge momentum, so their λ is far too small to detect. Wave behaviour is noticeable only for very small particles.</li></ul>`,
    sym:[["λ","De Broglie wavelength","m"],["h","Planck's constant (6.63 × 10<sup>−34</sup>)","J s"],["p","Momentum of the particle","kg m s<sup>−1</sup>"],["m","Mass of the particle","kg"],["v","Speed of the particle","m s<sup>−1</sup>"],["V","Accelerating potential difference","V"],["K","Kinetic energy of the particle","J"]],
    qs:[
      Q("C1","The de Broglie hypothesis states that","a moving particle has a wavelength associated with it",[["light consists only of waves","Light shows both wave and particle behaviour."],["electrons can only behave as particles","De Broglie said electrons also behave as waves."],["the wavelength of a particle increases with its momentum","λ = h/p, so λ decreases as p increases."]],"λ = h/p links a particle property (p) to a wave property (λ)."),
      Q("C2","An electron is accelerated through a larger potential difference. Its de Broglie wavelength","decreases",[["increases","A larger V gives a larger momentum, so λ = h/p is smaller."],["stays the same","λ depends on momentum, which depends on V."],["becomes zero","λ gets smaller but never reaches zero."]],"λ = h/√(2meV) ∝ 1/√V."),
      Q("C2","Why is the wave nature of a moving car never observed?","Its momentum is so large that its de Broglie wavelength is far too small to detect",[["A car has no momentum","A moving car has momentum."],["Only charged objects have a wavelength","Any moving particle has a de Broglie wavelength."],["Its wavelength is too long to detect","λ = h/p is extremely short for a large p."]],"h is tiny (≈10<sup>−34</sup> J s), so a large mv gives a negligible λ."),
      Q("C1","Wave–particle duality means that","both light and matter can show wave properties and particle properties",[["light is a wave and matter is a particle","Each can behave as either."],["particles turn into waves when they stop","A stationary particle has p = 0, and λ = h/p is then undefined."],["only electrons can diffract","Any small particle (e.g. neutrons) can show diffraction."]],"The behaviour you observe depends on the experiment.") ] },

  { sub:"8.2", title:"Electron diffraction and the electron microscope",
    html:`<p><b>Davisson–Germer experiment:</b> a beam of electrons fired at a nickel crystal was scattered strongly at particular angles, giving a diffraction pattern. Diffraction is a wave property, so this confirmed that electrons behave as waves. The measured wavelength agreed with λ = h/p.</p>
    <p><b>Electron microscope:</b> uses a beam of electrons instead of light. Magnetic (or electric) fields act as lenses to focus the beam.</p>
    <ul><li><b>Advantage over an optical microscope:</b> electrons can have a de Broglie wavelength much <b>shorter</b> than visible light. A shorter wavelength gives less diffraction and therefore a <b>higher resolving power</b> (finer detail) and higher magnification.</li>
    <li>A higher accelerating voltage gives a shorter λ and better resolution.</li></ul>`,
    sym:[["d","Spacing between atomic planes in the crystal","m"],["e","Charge of an electron (1.60 × 10<sup>−19</sup>)","C"],["m<sub>e</sub>","Mass of an electron (9.11 × 10<sup>−31</sup>)","kg"]],
    qs:[
      Q("C2","The Davisson–Germer experiment provided evidence that","electrons behave as waves",[["light behaves as particles","That is the photoelectric effect."],["electrons have no mass","Electrons do have mass."],["atoms have a nucleus","That was Rutherford's scattering experiment."]],"A diffraction pattern can only be produced by waves."),
      Q("C2","An electron microscope can resolve finer detail than an optical microscope because","the electrons have a much shorter wavelength than visible light",[["electrons travel faster than light","Electrons always travel slower than light."],["electrons have a longer wavelength than light","A longer λ would give poorer resolution."],["electrons are not affected by diffraction","They are diffracted, but less so because λ is small."]],"Shorter λ → less diffraction → higher resolving power."),
      Q("C1","In an electron microscope, the electron beam is focused by","magnetic (or electric) fields",[["glass lenses","Glass lenses focus light, not electrons."],["curved mirrors","Mirrors are used for light."],["a diffraction grating","A grating spreads waves rather than focusing them."]],"Charged particles are bent by electric and magnetic fields.") ] }
];

/* ---------- Chapter 9: Nuclear and Particle Physics ---------- */
THEORY[9] = [
  { sub:"9.1", title:"Binding energy and mass defect",
    html:`<p>A nucleus is written <b><sup>A</sup><sub>Z</sub>X</b>. A (nucleon number) is the number of protons plus neutrons. Z (proton number) is the number of protons. Neutron number = A − Z.</p>
    <p><b>Mass defect Δm:</b> the difference between the total mass of the separate nucleons and the mass of the nucleus.</p>
    <p><b>Binding energy:</b> the energy needed to separate a nucleus completely into its individual protons and neutrons. It is equal to the energy released when the nucleus forms.</p>
    <div class="formula" data-tex="\\Delta m=Zm_p+(A-Z)m_n-m_{\\text{nucleus}}||E_B=\\Delta m\\,c^2||1\\ \\text{u}=931.5\\ \\text{MeV}/c^2">Δm = Zm<sub>p</sub> + (A − Z)m<sub>n</sub> − m<sub>nucleus</sub> &nbsp;&nbsp; E<sub>B</sub> = Δmc<sup>2</sup> &nbsp;&nbsp; 1 u = 931.5 MeV/c<sup>2</sup></div>
    <ul><li><b>Binding energy per nucleon</b> = E<sub>B</sub>/A. The higher it is, the <b>more stable</b> the nucleus.</li>
    <li>The curve of E<sub>B</sub>/A against A peaks near iron-56 (≈ 8.8 MeV per nucleon). Light nuclei release energy by fusion, and heavy nuclei release energy by fission, because both processes move towards the peak.</li></ul>`,
    sym:[["A","Nucleon (mass) number","no unit"],["Z","Proton (atomic) number","no unit"],["Δm","Mass defect","kg (or u)"],["E<sub>B</sub>","Binding energy","J (or MeV)"],["c","Speed of light (3.00 × 10<sup>8</sup>)","m s<sup>−1</sup>"],["u","Atomic mass unit","— (1 u = 1.66 × 10<sup>−27</sup> kg)"],["m<sub>p</sub>, m<sub>n</sub>","Mass of a proton and mass of a neutron","kg (or u)"]],
    qs:[
      Q("C1","The binding energy of a nucleus is","the energy needed to separate the nucleus completely into its individual nucleons",[["the energy needed to remove one electron from the atom","That is ionisation energy."],["the kinetic energy of the nucleus","Binding energy is related to the mass defect, not motion."],["the energy holding electrons in their orbits","That is electron binding energy, not nuclear."]],"E<sub>B</sub> = Δmc<sup>2</sup>."),
      Q("C2","The mass of a nucleus is always","less than the total mass of its separate protons and neutrons",[["greater than the total mass of its separate nucleons","Energy is released when the nucleus forms, so mass is lost."],["equal to the total mass of its separate nucleons","The difference is the mass defect."],["equal to Z times the proton mass","This ignores the neutrons and the mass defect."]],"The missing mass (mass defect) became the binding energy."),
      Q("C2","Which nucleus is the most stable?","The one with the highest binding energy per nucleon",[["The one with the largest nucleon number","Very heavy nuclei (e.g. uranium) are less stable."],["The one with the highest total binding energy","Stability depends on binding energy per nucleon."],["The one with the smallest mass defect","A small mass defect means weak binding."]],"Fe-56 is near the peak of the E<sub>B</sub>/A curve."),
      Q("C1","For <sup>14</sup><sub>6</sub>C, the number of neutrons is","8",[["6","6 is the number of protons (Z)."],["14","14 is the nucleon number (A)."],["20","Neutron number = A − Z = 14 − 6."]],"N = A − Z.") ] },

  { sub:"9.2", title:"Radioactivity",
    html:`<p><b>Radioactive decay</b> is the spontaneous and random emission of radiation from an unstable nucleus.</p>
    <table class="cmp"><tr><th>Decay</th><th>Particle</th><th>Change in A</th><th>Change in Z</th></tr>
    <tr><td>α</td><td>helium nucleus <sup>4</sup><sub>2</sub>He</td><td>−4</td><td>−2</td></tr>
    <tr><td>β<sup>−</sup></td><td>electron <sup>0</sup><sub>−1</sub>e (a neutron → proton)</td><td>0</td><td>+1</td></tr>
    <tr><td>β<sup>+</sup></td><td>positron <sup>0</sup><sub>+1</sub>e (a proton → neutron)</td><td>0</td><td>−1</td></tr>
    <tr><td>γ</td><td>photon (electromagnetic radiation)</td><td>0</td><td>0</td></tr></table>
    <ul><li>In every nuclear equation, the <b>total A and the total Z are conserved</b>.</li>
    <li>Penetrating power: α &lt; β &lt; γ. Ionising power: α &gt; β &gt; γ.</li></ul>`,
    sym:[["α","Alpha particle (helium nucleus)","—"],["β<sup>−</sup>","Beta-minus particle (electron)","—"],["β<sup>+</sup>","Beta-plus particle (positron)","—"],["γ","Gamma ray (high-energy photon)","—"]],
    qs:[

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* number parsing: accepts 1.05, -4.5e-4, 4.5x10^-4, 4.5 × 10^-4, 4.5*10-4 */
function parseNum(s){
  if(s==null) return NaN;
  let t = String(s).trim().replace(/[−–—]/g,"-").replace(/,/g,"").replace(/\s+/g,"");
  t = t.replace(/[x×X*]10\^?\(?([+-]?\d+)\)?/, "e$1");
  const m = t.match(/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i);
  return m ? Number(m[0]) : NaN;
}
function close(x, target){ return target===0 ? Math.abs(x) < 1e-12 : Math.abs(x-target) <= TOL*Math.abs(target); }
function fmt(v){
  if(v===0) return "0";
  const a = Math.abs(v);
  if(a>=0.01 && a<1e4) return String(Number(v.toPrecision(3)));
  const ex = Math.floor(Math.log10(a)), m = v/Math.pow(10,ex);
  return `${Number(m.toPrecision(3))} &times; 10<sup>${ex}</sup>`;
}
function gradePart(p, resp){
  if(p.type==="mcq"){ const o = p.opts[resp]; return {ok:!!(o&&o.ok), mis:o&&!o.ok?o.mis:"", shown:o?o.t:""}; }
  const x = parseNum(resp);
  if(isNaN(x)) return {ok:false, mis:"That answer could not be read as a number.", shown:esc(resp)};
  const shown = fmt(x);
  if(close(x, p.ans)) return {ok:true, shown};
  for(const [v, m] of (p.wrong||[])) if(close(x, v)) return {ok:false, mis:m, shown};
  if(p.ans!==0 && close(-x, p.ans)) return {ok:false, mis:"The size is right but the sign is wrong. Check the signs of the charges and the direction of the change.", shown};
  if(p.ans!==0 && x/p.ans>0){ const r = Math.log10(x/p.ans), n = Math.round(r);
    if(n!==0 && Math.abs(r-n) < 0.022) return {ok:false, mis:`Your digits are right but the answer is off by a factor of 10<sup>${n}</sup>. Check your unit conversions (cm to m, &mu;C or nC to C, g to kg).`, shown}; }
  return {ok:false, mis:"", shown};
}
function answered(p, r){ return p.type==="mcq" ? r!=null : (r!=null && String(r).trim()!==""); }

function send(payload){
  payload.token = getTok(payload.matric);
  return api(payload).then(r => { if(r.auth === false) authFailed(); return r.preview ? {ok:false, preview:true} : r; });
}
function sendOld(payload){
  return new Promise(res => {
    if(!HAS_BACKEND){ res({ok:false, preview:true}); return; }
    if(GAS){
      google.script.run.withSuccessHandler(() => res({ok:true}))
        .withFailureHandler(e => res({ok:false, error:String(e && e.message || e)})).saveResult(payload);
      return;
    }
    const attempt = n => fetch(EXEC_URL, { method:"POST", body: JSON.stringify(payload),
        headers:{ "Content-Type":"text/plain;charset=utf-8" }, credentials:"omit", redirect:"follow" })
      .then(r => r.json())
      .then(j => j && j.ok ? res({ok:true}) : res({ok:false, error:(j && j.error) || "server did not confirm"}))
      .catch(e => n > 0 ? setTimeout(() => attempt(n-1), 1500) : res({ok:false, error:"no internet connection or server busy"}));
    attempt(2);
  });
}

/* ---------- part rendering ---------- */
function partHTML(p, pi, resp, opts){
  // opts: {locked, feedback, nameAttr}
  const label = `<span class="plabel">(${String.fromCharCode(97+pi)})</span>`;
  const tag = `<span class="skill">${opts.tag || SKILLS[p.skill]}</span>`;
  let body = "";
  const g = opts.feedback ? gradePart(p, resp) : null;
  if(p.type==="mcq"){
    body = `<div class="opts" style="margin-top:8px">${p.opts.map((o,k) => {
      let c = "opt"; if(g){ if(o.ok) c+=" right"; else if(k===resp) c+=" wrong"; } else if(resp===k) c+=" sel";
      return `<button class="${c}" data-p="${pi}" data-k="${k}" ${opts.locked?"disabled":""}><span class="L">${LETTERS[k]}</span><span>${o.t}</span></button>`; }).join("")}</div>`;
  } else {
    body = `<div class="numrow"><input inputmode="decimal" data-p="${pi}" value="${esc(resp||"")}" placeholder="e.g. 4.5x10^-4" class="${g?(g.ok?"right":"wrong"):""}" ${opts.locked?"disabled":""}>
      <span class="unit">${p.unit}</span>${opts.checkBtn && !opts.locked ? `<button class="btn sm" data-check="${pi}">Check</button>` : ""}</div>`;
  }
  let fb = "";
  if(g) fb = `<div class="fb ${g.ok?"good":"bad"}"><b>${g.ok?"Correct.":"Not quite."}</b> ${!g.ok && p.type==="num" ? `The answer is ${fmt(p.ans)} ${p.unit}. ` : ""}${g.mis ? g.mis+" " : ""}<br><span class="small">${p.exp}</span></div>`;
  return `<div class="part">${label}${p.prompt}${tag}${body}${fb}</div>`;
}

const C1 = THEORY[1];
C1[0].html = `
<p>Everything around you contains electric <b>charge</b>. There are two kinds: <b>positive</b> (protons) and <b>negative</b> (electrons). Charge is measured in coulombs (C). It is <b>quantised</b>: any charge is a whole-number multiple of the elementary charge e = 1.60 &times; 10<sup>&minus;19</sup> C. Charge is also <b>conserved</b>: it can be moved from one object to another, but never created or destroyed.</p>
<h4>Attraction and repulsion</h4>
<p>Charges push or pull on each other without touching. <b>Like charges repel. Unlike charges attract.</b></p>
${fig(f_forces, "Figure 1.1: The forces between two point charges. The two forces are always equal in size and opposite in direction.")}
<p>Notice in Figure 1.1 that each pair of arrows is the same length. Even if one charge is much bigger than the other, the two forces are equal and opposite. They are a Newton's third law pair.</p>
<h4>Coulomb's law</h4>
<p><b>Coulomb's law</b> states that the magnitude of the electrostatic force between two point charges is <b>directly proportional to the product of the magnitudes of the charges</b> and <b>inversely proportional to the square of the distance</b> between them.</p>
${fx("F=\\dfrac{kq_1q_2}{r^2}||k=\\dfrac{1}{4\\pi\\varepsilon_0}=9.0\\times10^{9}\\ \\text{N m}^2\\,\\text{C}^{-2}||\\varepsilon_0=8.85\\times10^{-12}\\ \\text{C}^2\\,\\text{N}^{-1}\\,\\text{m}^{-2}", "F = kq<sub>1</sub>q<sub>2</sub>/r<sup>2</sup>")}
<p>What the formula tells you:</p>
<ul><li><b>Double one charge</b> and the force doubles. Double both and it becomes 4 times bigger.</li>
<li><b>Double the distance</b> and the force becomes one quarter (2<sup>2</sup> = 4). Triple it and the force becomes one ninth. This is an <b>inverse-square law</b>.</li>
<li>The force acts <b>along the straight line</b> joining the two charges.</li></ul>
<p><b>How to use it:</b> put in the <b>sizes</b> of the charges only (ignore their signs). Then decide the direction separately, using "like repel, unlike attract".</p>
${ex("force between two charges", `<p>A +3.0 &mu;C charge and a &minus;2.0 &mu;C charge are 30 cm apart. Find the force between them.</p>
<p>Convert first: 3.0 &mu;C = 3.0 &times; 10<sup>&minus;6</sup> C, 2.0 &mu;C = 2.0 &times; 10<sup>&minus;6</sup> C, 30 cm = 0.30 m.</p>
<p>F = (9.0 &times; 10<sup>9</sup>)(3.0 &times; 10<sup>&minus;6</sup>)(2.0 &times; 10<sup>&minus;6</sup>) / (0.30)<sup>2</sup> = <b>0.60 N</b>, attractive (unlike charges).</p>`)}
<h4>More than two charges</h4>
<p>When several charges act on one charge, work out each force on its own, as if the others were not there. Then add the forces as <b>vectors</b>. This is the <b>principle of superposition</b>.</p>
${fig(f_superpose, "Figure 1.2: q is repelled by q&#8321; and attracted by q&#8322;. The resultant force is the vector sum of F&#8321; and F&#8322;.")}
<ol><li>Find the size of each force with Coulomb's law.</li>
<li>Draw each force on a diagram, pointing towards or away from the charge that causes it.</li>
<li>Resolve each force into x and y components.</li>
<li>Add the x components, then the y components.</li>
<li>Find the resultant: F = &radic;(F<sub>x</sub><sup>2</sup> + F<sub>y</sub><sup>2</sup>), and its direction from tan &theta; = F<sub>y</sub>/F<sub>x</sub>.</li></ol>
${trap(`Putting the negative sign of a charge into F = kq<sub>1</sub>q<sub>2</sub>/r<sup>2</sup> and then treating the minus sign as a direction. A negative answer only tells you the force is attractive. Always draw the direction on a diagram.`)}
<p class="small muted">Prefixes you will meet: m = 10<sup>&minus;3</sup>, &mu; = 10<sup>&minus;6</sup>, n = 10<sup>&minus;9</sup>, p = 10<sup>&minus;12</sup>. Distances must be in metres.</p>`;

C1[1].html = `
<p>A charge does not need to touch another charge to push or pull it. We say the charge sets up an <b>electric field</b> around it: a region in which another charge experiences an electric force.</p>
<h4>Electric field strength</h4>
<p>To measure the field at a point, imagine placing a very small <b>positive test charge</b> q<sub>0</sub> there and measuring the force on it. <b>Electric field strength</b> at a point is the electric force per unit <b>positive</b> charge at that point.</p>
${fx("E=\\dfrac{F}{q_0}||\\text{point charge: } E=\\dfrac{kQ}{r^2}", "E = F/q<sub>0</sub> &nbsp;&nbsp; point charge: E = kQ/r<sup>2</sup>")}
<ul><li>E is a <b>vector</b>. Its direction is the direction of the force on a <b>positive</b> charge.</li>
<li>Unit: N C<sup>&minus;1</sup> (which is the same as V m<sup>&minus;1</sup>).</li>
<li>For a point charge, divide Coulomb's law by q<sub>0</sub>: E = kQq<sub>0</sub>/(r<sup>2</sup>q<sub>0</sub>) = kQ/r<sup>2</sup>. The field also follows an inverse-square law.</li>
<li>Once you know E, the force on <b>any</b> charge q at that point is F = qE. A negative charge feels a force <b>opposite</b> to E.</li></ul>
${fig(f_radial, "Figure 1.3: Field lines of single point charges. Lines leave positive charges and enter negative charges.")}
<h4>Electric field lines</h4>
<p>Field lines are a picture of the field. Learn these rules:</p>
<ul><li>They start on positive charges and end on negative charges.</li>
<li>The arrow (or the tangent to a curved line) shows the direction of E at that point.</li>
<li>Where lines are <b>closer together</b>, the field is <b>stronger</b>.</li>
<li>Lines <b>never cross</b>, because the field can only have one direction at each point.</li></ul>
${fig(f_dipole, "Figure 1.4: A positive and a negative charge (unlike charges). Lines run from + to &#8722;, and the field between them is strong.")}
${fig(f_like, "Figure 1.5: Two positive charges (like charges). The lines push away from each other. At the neutral point midway between equal charges, E = 0.")}
${fig(f_plates, "Figure 1.6: Between two parallel plates the field lines are parallel and equally spaced, so the field is uniform.")}
${ex("field of a point charge", `<p>Find the electric field 0.20 m from a +5.0 nC charge, and the force on an electron placed there.</p>
<p>E = (9.0 &times; 10<sup>9</sup>)(5.0 &times; 10<sup>&minus;9</sup>) / (0.20)<sup>2</sup> = <b>1.1 &times; 10<sup>3</sup> N C<sup>&minus;1</sup></b>, pointing away from the charge.</p>
<p>F = eE = (1.60 &times; 10<sup>&minus;19</sup>)(1125) = <b>1.8 &times; 10<sup>&minus;16</sup> N</b>, towards the charge (the electron is negative, so the force is opposite to E).</p>`)}
<h4>Field from several charges</h4>
<p>Fields add as <b>vectors</b>, exactly like forces. Find E from each charge, draw its direction (away from +, towards &minus;), then add the components. Between two like charges there is a point where the fields cancel, called a <b>neutral point</b>.</p>
${trap(`Drawing E towards a positive charge. E always points <b>away</b> from a positive charge and <b>towards</b> a negative charge, whatever charge you later place in the field.`)}`;

C1[2].html = `
<p>Think of lifting a book: you do work against gravity, and the book gains gravitational potential energy. In the same way, pushing a positive charge towards another positive charge needs work, and the charge gains <b>electric potential energy</b>.</p>
<h4>Electric potential</h4>
<p><b>Electric potential</b> at a point is the work done by an external force in bringing a unit positive charge from infinity to that point. At infinity, V = 0.</p>
${fx("V=\\dfrac{kQ}{r}||U=qV=\\dfrac{kq_1q_2}{r}||W=q\\Delta V", "V = kQ/r &nbsp;&nbsp; U = qV = kq<sub>1</sub>q<sub>2</sub>/r &nbsp;&nbsp; W = q&Delta;V")}
<ul><li>Potential is a <b>scalar</b>. Unit: the volt, V = J C<sup>&minus;1</sup>.</li>
<li>In V = kQ/r you <b>keep the sign</b> of Q. Near a positive charge V is positive. Near a negative charge V is negative.</li>
<li>V falls off as 1/r, more slowly than E, which falls off as 1/r<sup>2</sup>.</li></ul>
${fig(f_vr, "Figure 1.7: How potential changes with distance from a positive and a negative point charge. Both approach zero far away.")}
<h4>Potential difference and work</h4>
<p>The <b>potential difference</b> between two points is the work done per unit charge in moving a charge from one point to the other. So the work done on a charge q is W = q&Delta;V.</p>
<ul><li>A positive charge, left alone, moves from <b>high to low</b> potential, like a ball rolling downhill.</li>
<li>An electron, left alone, moves from <b>low to high</b> potential.</li></ul>
<h4>Electric potential energy</h4>
<p>The <b>electric potential energy</b> of a charge at a point is the work done in bringing that charge from infinity to the point: U = qV = kq<sub>1</sub>q<sub>2</sub>/r. A positive U (like charges) means work was needed to push them together. A negative U (unlike charges) means the charges are bound together.</p>
${ex("potential and work", `<p>Find the potential 0.30 m from a +6.0 nC charge, and the work needed to bring a +2.0 &mu;C charge from infinity to that point.</p>
<p>V = (9.0 &times; 10<sup>9</sup>)(6.0 &times; 10<sup>&minus;9</sup>) / 0.30 = <b>180 V</b>.</p>
<p>W = qV = (2.0 &times; 10<sup>&minus;6</sup>)(180) = <b>3.6 &times; 10<sup>&minus;4</sup> J</b>.</p>`)}
<h4>Several charges: add potentials as numbers</h4>
<p>Potential is a scalar, so potentials from several charges are simply added, <b>with their signs</b>. There are no components.</p>
<p>Example: +4.0 nC and &minus;4.0 nC are 0.20 m apart. At the midpoint, V = kQ/0.10 &minus; kQ/0.10 = <b>0</b>. But the field there is <b>not</b> zero: both fields point towards the negative charge and add up to 7.2 &times; 10<sup>3</sup> N C<sup>&minus;1</sup>. Zero potential does not mean zero field.</p>
<h4>Equipotential surfaces</h4>
<p>An <b>equipotential surface</b> is a surface on which every point has the same potential.</p>
${fig(f_equi, "Figure 1.8: Equipotentials (dashed) are always perpendicular to the field lines (solid). The field points from higher to lower potential.")}
<ul><li>No work is done moving a charge along an equipotential, because &Delta;V = 0.</li>
<li>Field lines cross equipotentials at <b>right angles</b>, pointing towards <b>lower</b> potential.</li>
<li>Point charge: concentric spheres. Uniform field: parallel, equally spaced planes.</li></ul>
${trap(`Adding potentials as vectors, or ignoring their signs. Potentials are added as ordinary numbers, and a negative charge gives a negative potential.`)}`;

C1[3].html = `
<p>Two parallel metal plates connected to a battery give the simplest field of all: a <b>uniform</b> field, with the same size and direction everywhere between the plates.</p>
<h4>Field strength between plates</h4>
<p>Move a charge q from one plate to the other. The work done is W = qV, and also W = Fd = qEd. Setting these equal gives:</p>
${fx("E=\\dfrac{V}{d}||F=qE||a=\\dfrac{qE}{m}", "E = V/d &nbsp;&nbsp; F = qE &nbsp;&nbsp; a = qE/m")}
<ul><li>E = V/d shows why the unit V m<sup>&minus;1</sup> is the same as N C<sup>&minus;1</sup>.</li>
<li>A bigger voltage, or a smaller gap, gives a stronger field.</li>
<li>Because E is the same everywhere, the force on a charge is the same wherever it is between the plates.</li></ul>
${fig(f_charges_field, "Figure 1.9: In the field, a positive charge is pushed towards the negative plate, and an electron towards the positive plate. A charged oil drop can float when qE balances mg.")}
${ex("field between plates", `<p>Two plates 4.0 mm apart are connected to 200 V. Find E.</p>
<p>E = V/d = 200 / (4.0 &times; 10<sup>&minus;3</sup>) = <b>5.0 &times; 10<sup>4</sup> V m<sup>&minus;1</sup></b>.</p>`)}
<h4>Moving along the field</h4>
<p>A charge released between the plates accelerates in a straight line with constant acceleration a = qE/m, just like an object falling freely. The work done by the field becomes kinetic energy: <b>qV = &frac12;mv<sup>2</sup></b>.</p>
<p>A proton and an electron feel forces of the same size, because they have the same size of charge. But the electron is about 1800 times lighter, so its acceleration is about 1800 times bigger.</p>
${ex("electron accelerated from rest", `<p>An electron is accelerated from rest through 100 V. Find its final speed.</p>
<p>&frac12;mv<sup>2</sup> = eV, so v = &radic;(2eV/m) = &radic;(2 &times; 1.60 &times; 10<sup>&minus;19</sup> &times; 100 / 9.11 &times; 10<sup>&minus;31</sup>) = <b>5.9 &times; 10<sup>6</sup> m s<sup>&minus;1</sup></b>.</p>`)}
<h4>Entering at right angles to the field</h4>
${fig(f_deflect, "Figure 1.10: An electron entering between the plates at right angles to the field follows a parabola, bending towards the positive plate.")}
<p>This is the same as projectile motion. Horizontally there is no force, so the velocity u stays constant: x = ut. Vertically there is a constant force, so y = &frac12;at<sup>2</sup> with a = eE/m. Together these give a <b>parabola</b>. After leaving the plates, the electron travels in a straight line.</p>
${trap(`Giving the electron's force the same direction as E. Electrons are negative, so they are always pushed <b>against</b> the field, towards the positive plate.`)}`;

/* ===== Chapter 2 lessons ===== */
const C2 = THEORY[2];
C2[0].html = `
<p>A <b>capacitor</b> is a device that stores electric charge, and so stores electric potential energy. It is made of two conductors (usually metal plates) separated by a small gap of air or an insulator called a <b>dielectric</b>.</p>
${fig(f_cap, "Figure 2.1: A parallel-plate capacitor connected to a battery. Electrons are pulled off one plate and pushed onto the other, leaving +Q and &#8722;Q.")}
<h4>How a capacitor charges</h4>
<p>When a capacitor is connected to a battery, the battery pulls electrons off one plate and pushes the same number onto the other plate. No charge crosses the gap. One plate ends up with +Q and the other with &minus;Q. The "charge on a capacitor" means Q, the charge on <b>either</b> plate. The total charge is still zero.</p>
<h4>Capacitance</h4>
<p><b>Capacitance</b> is the ratio of the charge on either plate to the potential difference between the plates. It tells you how much charge is stored for every volt.</p>
${fx("C=\\dfrac{Q}{V}", "C = Q/V")}
<ul><li>Unit: the <b>farad</b>, F = C V<sup>&minus;1</sup>. One farad is very large, so you will usually see &mu;F, nF and pF.</li>
<li>1 farad is the capacitance when 1 coulomb is stored on each plate with a potential difference of 1 volt.</li>
<li>C depends only on the capacitor's construction, not on Q or V. Doubling V doubles Q, and C stays the same.</li></ul>
<h4>Capacitors in series</h4>
${fig(f_series, "Figure 2.2: Capacitors in series. The same charge Q is on every capacitor, and the voltages add up.")}
<p>Charge moved onto the first plate induces equal charges along the chain, so <b>every capacitor carries the same charge Q</b>. The battery voltage is shared: V = V<sub>1</sub> + V<sub>2</sub> + V<sub>3</sub>. Since V = Q/C:</p>
${fx("\\dfrac{1}{C_{\\text{eff}}}=\\dfrac{1}{C_1}+\\dfrac{1}{C_2}+\\dfrac{1}{C_3}", "1/C<sub>eff</sub> = 1/C<sub>1</sub> + 1/C<sub>2</sub> + 1/C<sub>3</sub>")}
<p>The effective capacitance in series is always <b>smaller</b> than the smallest capacitor.</p>
<h4>Capacitors in parallel</h4>
${fig(f_parallel, "Figure 2.3: Capacitors in parallel. Each capacitor has the same voltage V, and the charges add up.")}
<p>Each capacitor is connected straight across the battery, so <b>each has the same voltage V</b>. The total charge is Q = Q<sub>1</sub> + Q<sub>2</sub> + Q<sub>3</sub>, which gives:</p>
${fx("C_{\\text{eff}}=C_1+C_2+C_3", "C<sub>eff</sub> = C<sub>1</sub> + C<sub>2</sub> + C<sub>3</sub>")}
${ex("series and parallel", `<p>A 2.0 &mu;F and a 3.0 &mu;F capacitor are connected to a 10 V supply.</p>
<p><b>In series:</b> 1/C<sub>eff</sub> = 1/2.0 + 1/3.0, so C<sub>eff</sub> = 1.2 &mu;F. Q = C<sub>eff</sub>V = 12 &mu;C on each. V<sub>1</sub> = 12/2.0 = 6.0 V and V<sub>2</sub> = 12/3.0 = 4.0 V (they add to 10 V).</p>
<p><b>In parallel:</b> C<sub>eff</sub> = 5.0 &mu;F. Each has 10 V, so Q<sub>1</sub> = 20 &mu;C and Q<sub>2</sub> = 30 &mu;C (total 50 &mu;C).</p>`)}
${trap(`Using the resistor rules. For capacitors it is the other way round: the <b>reciprocal</b> formula is for <b>series</b>, and simple adding is for <b>parallel</b>.`)}
<h4>Energy stored</h4>
<p>As the capacitor charges, each extra bit of charge has to be pushed onto a plate against the growing voltage, so work is done. That work is stored as electric potential energy. On a graph of Q against V, the energy is the <b>area under the line</b>.</p>
${fig(f_qv, "Figure 2.4: Q against V is a straight line through the origin with gradient C. The shaded area is the energy stored.")}
${fx("U=\\tfrac12QV=\\tfrac12CV^2=\\dfrac{Q^2}{2C}", "U = &frac12;QV = &frac12;CV<sup>2</sup> = Q<sup>2</sup>/2C")}
${ex("energy stored", `<p>A 470 &mu;F capacitor is charged to 12 V. U = &frac12;CV<sup>2</sup> = &frac12;(470 &times; 10<sup>&minus;6</sup>)(12)<sup>2</sup> = <b>3.4 &times; 10<sup>&minus;2</sup> J</b>.</p>`)}`;

C2[1].html = `
<p>A capacitor connected through a resistor does not charge instantly. The resistor limits the current, so the charge builds up gradually. Discharging is gradual in the same way.</p>
${fig(f_rc, "Figure 2.5: An RC circuit. With the switch at A, the battery charges C through R. At B, C discharges through R.")}
<h4>Charging (switch at A)</h4>
<ol><li>At the instant the switch closes, the capacitor is empty, so V<sub>C</sub> = 0. All of the battery voltage is across R, and the current is at its <b>maximum</b>: I<sub>0</sub> = &epsilon;/R.</li>
<li>As charge builds up, V<sub>C</sub> grows. It opposes the battery, so the voltage across R gets smaller and the <b>current decreases</b>.</li>
<li>When V<sub>C</sub> equals the battery voltage, there is no voltage left across R. The current is <b>zero</b> and the capacitor is <b>fully charged</b>, with Q<sub>0</sub> = C&epsilon;.</li></ol>
<h4>Discharging (switch at B)</h4>
<ol><li>At the start V<sub>C</sub> is at its maximum, so the current I<sub>0</sub> = V<sub>0</sub>/R is at its maximum. It flows in the <b>opposite direction</b> to the charging current.</li>
<li>As charge leaves the plates, V<sub>C</sub> falls, so the current falls too, until both reach zero.</li></ol>
${fig(f_rcgraphs, "Figure 2.6: Charging and discharging graphs. All the curves are exponential, and the time constant &#964; is marked on each.")}
${fx("\\tau=RC||\\text{charging: } Q=Q_0\\left(1-e^{-t/RC}\\right)||\\text{discharging: } Q=Q_0e^{-t/RC}||I=I_0e^{-t/RC}", "&tau; = RC &nbsp;&nbsp; charging: Q = Q<sub>0</sub>(1 &minus; e<sup>&minus;t/RC</sup>) &nbsp;&nbsp; discharging: Q = Q<sub>0</sub>e<sup>&minus;t/RC</sup> &nbsp;&nbsp; I = I<sub>0</sub>e<sup>&minus;t/RC</sup>")}
<p>V across the capacitor follows the same shape as Q, because V = Q/C. The current always decays as I<sub>0</sub>e<sup>&minus;t/RC</sup>, whether charging or discharging.</p>
<h4>The time constant</h4>
<ul><li>&tau; = RC has the unit of time: &Omega; &times; F = (V/A) &times; (C/V) = C/A = s.</li>
<li><b>Charging:</b> &tau; is the time for the charge (or V<sub>C</sub>) to reach <b>63%</b> of its final value, because 1 &minus; e<sup>&minus;1</sup> = 0.63.</li>
<li><b>Discharging:</b> &tau; is the time for the charge to fall to <b>37%</b> of its starting value, because e<sup>&minus;1</sup> = 0.37.</li>
<li>A bigger R or a bigger C gives a bigger &tau;, so charging and discharging are slower. After about 5&tau;, the process is practically complete.</li></ul>
${ex("charging a capacitor", `<p>A 47 &mu;F capacitor charges through a 100 k&Omega; resistor from a 9.0 V battery.</p>
<p>&tau; = RC = (100 &times; 10<sup>3</sup>)(47 &times; 10<sup>&minus;6</sup>) = <b>4.7 s</b>.</p>
<p>The starting current is I<sub>0</sub> = 9.0 / (100 &times; 10<sup>3</sup>) = 9.0 &times; 10<sup>&minus;5</sup> A. After one time constant, V<sub>C</sub> = 9.0(1 &minus; e<sup>&minus;1</sup>) = <b>5.7 V</b> and I = 0.37 &times; I<sub>0</sub> = <b>3.3 &times; 10<sup>&minus;5</sup> A</b>.</p>`)}
${trap(`Forgetting to convert k&Omega; and &mu;F before working out RC, or leaving t in minutes. Use ohms, farads and seconds.`)}`;

C2[2].html = `
<p>A <b>dielectric</b> is an insulating (non-conducting) material, such as paper, plastic, mica or ceramic, placed between the plates of a capacitor. Putting a dielectric in <b>increases the capacitance</b>.</p>
<h4>Capacitance of a parallel-plate capacitor</h4>
${fx("\\text{air: } C_0=\\dfrac{\\varepsilon_0A}{d}||\\text{with dielectric: } C=\\dfrac{\\varepsilon_r\\varepsilon_0A}{d}=\\varepsilon_rC_0", "air: C<sub>0</sub> = &epsilon;<sub>0</sub>A/d &nbsp;&nbsp; with dielectric: C = &epsilon;<sub>r</sub>&epsilon;<sub>0</sub>A/d = &epsilon;<sub>r</sub>C<sub>0</sub>")}
<ul><li>A <b>bigger plate area A</b> gives a bigger C: there is more room for charge.</li>
<li>A <b>smaller separation d</b> gives a bigger C.</li>
<li>A dielectric with a <b>bigger &epsilon;<sub>r</sub></b> gives a bigger C.</li></ul>
<h4>Why a dielectric increases C</h4>
${fig(f_dielectric, "Figure 2.7: The molecules of the dielectric become small dipoles that line up with the field. Their charges at the surfaces of the dielectric oppose the plate charges, so the field inside is weaker.")}
<p>The field between the plates <b>polarises</b> the dielectric: its molecules become tiny dipoles, with their negative ends towards the positive plate. Along the surfaces of the dielectric this leaves a layer of negative charge next to the positive plate, and positive charge next to the negative plate. These induced charges create a field in the opposite direction, so the total field inside drops from E<sub>0</sub> to E. For the same charge Q, a weaker field means a smaller V, and C = Q/V is larger.</p>
<p>The <b>dielectric constant</b> (relative permittivity) &epsilon;<sub>r</sub> is the ratio of the permittivity of the material to the permittivity of free space. It has <b>no unit</b> and is always greater than 1 (air is about 1).</p>
${fx("\\varepsilon_r=\\dfrac{\\varepsilon}{\\varepsilon_0}=\\dfrac{C}{C_0}=\\dfrac{V_0}{V}=\\dfrac{E_0}{E}", "&epsilon;<sub>r</sub> = &epsilon;/&epsilon;<sub>0</sub> = C/C<sub>0</sub> = V<sub>0</sub>/V = E<sub>0</sub>/E")}
<h4>Two situations to compare</h4>
<table class="cmp"><tr><th>Dielectric inserted...</th><th>Q</th><th>V</th><th>E</th><th>C</th><th>U</th></tr>
<tr><td>after the battery is <b>disconnected</b></td><td>stays the same</td><td>decreases</td><td>decreases</td><td>increases</td><td>decreases</td></tr>
<tr><td>while still <b>connected</b> to the battery</td><td>increases</td><td>stays the same</td><td>stays the same</td><td>increases</td><td>increases</td></tr></table>
<p>With the battery disconnected, the charge has nowhere to go, so Q is fixed. With the battery connected, the battery holds V fixed and pushes more charge on.</p>
<h4>Advantages of a dielectric</h4>
<ul><li>It increases the capacitance.</li>
<li>It allows a higher working voltage before a spark jumps between the plates.</li>
<li>It holds the plates apart, so they can be very close without touching.</li></ul>
${ex("adding a dielectric", `<p>Air-filled plates have A = 0.010 m<sup>2</sup> and d = 1.0 mm.</p>
<p>C<sub>0</sub> = (8.85 &times; 10<sup>&minus;12</sup>)(0.010) / (1.0 &times; 10<sup>&minus;3</sup>) = <b>8.9 &times; 10<sup>&minus;11</sup> F</b> (89 pF).</p>
<p>With a dielectric of &epsilon;<sub>r</sub> = 4.0: C = 4.0 &times; C<sub>0</sub> = <b>3.5 &times; 10<sup>&minus;10</sup> F</b>. If it had first been charged to 100 V and then disconnected, inserting the dielectric would drop the voltage to 100/4.0 = <b>25 V</b>.</p>`)}
${trap(`Assuming the charge always stays the same. It only stays the same when the capacitor is <b>disconnected</b>. Read the question carefully.`)}`;
})();

/* ---------- Saved progress and past attempts (on this device) ---------- */
const HIST_MAX = 60;
function mkey(kind){ const st = state.student || loadStudent() || {}; return "sp025_"+kind+"_"+String(st.matric||"anon").toUpperCase(); }
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function rawProg(){ const P = lsGet(mkey("prog"), {}); P.theory = P.theory || {}; P.diag = P.diag || {}; return P; }
function getProg(){ const P = rawProg(), out = {theory:{}, diag:{}};
  ["theory","diag"].forEach(k => Object.keys(P[k]).forEach(c => { if(P[k][c] && !P[k][c].del) out[k][c] = P[k][c]; })); return out; }

function getHist(){ return lsGet(mkey("hist"), []); }
function storeHist(H){ H.sort((a,b) => b.at - a.at); H = H.slice(0, HIST_MAX); while(H.length && !lsSet(mkey("hist"), H)) H.pop(); }
function addHist(entry){ const H = getHist(); H.unshift(entry); storeHist(H); queuePut("hist:"+entry.at, entry); }

/* ---------- Online sync (PIN sign-in) ---------- */
function tokKey(m){ return "sp025_tok_" + String(m||"").toUpperCase(); }
function getTok(m){ try{ return localStorage.getItem(tokKey(m)) || ""; }catch(e){ return ""; } }
function setTok(m, t){ try{ if(t) localStorage.setItem(tokKey(m), t); else localStorage.removeItem(tokKey(m)); }catch(e){} }
function api(payload){
  return new Promise(res => {
    if(GAS){ google.script.run.withSuccessHandler(r => res(r || {ok:false})).withFailureHandler(e => res({ok:false, offline:true, error:String(e && e.message || e)})).api(payload); return; }
    if(!ON_WEB_HOST){ res({ok:false, preview:true}); return; }
    const attempt = n => fetch(EXEC_URL, { method:"POST", body: JSON.stringify(payload), headers:{ "Content-Type":"text/plain;charset=utf-8" }, credentials:"omit", redirect:"follow" })
      .then(r => r.json()).then(res)
