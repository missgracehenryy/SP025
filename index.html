<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP025 Physics with @missgracehenry</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1b2232;--muted:#5b6476;--line:#e2dfd6;--brand:#173f63;--brand2:#2a6aa3;--ok:#1d7448;--okbg:#e5f3eb;--mid:#9a6200;--midbg:#fcf1db;--bad:#ad2a20;--badbg:#fbe8e5}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px}
.top{background:var(--brand);color:#fff}
.top .wrap{display:flex;align-items:baseline;gap:12px;padding:14px 16px}
.brand{font-weight:700;letter-spacing:.3px;font-size:18px}
.top .sub{opacity:.8;font-size:14px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
h1{font-size:24px;line-height:1.25;margin:0 0 8px}
h2{font-size:20px;margin:0 0 8px}
h3{font-size:17px;margin:18px 0 6px}
.sec{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:26px 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
label{display:block;font-size:14px;font-weight:600;color:var(--muted)}
input{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:#fcfcfa}
input:focus{outline:2px solid var(--brand2);border-color:transparent}
.grid3{display:grid;grid-template-columns:2fr 1.2fr 1fr;gap:12px;margin-top:14px}
@media(max-width:600px){.grid3{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:14px;min-height:1em;margin:8px 0 0}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.chap{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;color:inherit;cursor:pointer}
.chap:hover:not(:disabled){border-color:var(--brand2);box-shadow:0 2px 0 var(--brand2)}
.chap .num{grid-row:1/3;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.chap .ct{font-weight:650}
.chap .cs{font-size:13px;color:var(--muted)}
.chap.locked{opacity:.55;cursor:not-allowed}
.chap.locked .num{background:#9aa3b2}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-top:6px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand2)}
.qtext{font-size:17px;margin-bottom:14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fcfcfa;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--brand2)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;background:#fff}
.opt.sel{border-color:var(--brand2);background:#eaf2fa}
.opt.sel .L{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.conf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.conf span{font-size:14px;font-weight:600;color:var(--muted);margin-right:4px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;color:inherit}
.pill.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer}
.btn:hover:not(:disabled){background:var(--brand2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:#fff;border-color:var(--brand2)}
.score{display:flex;align-items:center;gap:18px}
.ring{flex:none;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px}
.save{font-size:13px;margin-top:10px;padding:8px 10px;border-radius:8px;background:#f0efe9;color:var(--muted)}
.save.ok{background:var(--okbg);color:var(--ok)}
.save.bad{background:var(--badbg);color:var(--bad)}
.subrow{padding:12px 0;border-top:1px solid var(--line)}
.subrow:first-child{border-top:0}
.subline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.subname{font-weight:620}
.subname small{color:var(--muted);font-weight:500;margin-right:6px}
.chip{flex:none;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
.chip.Mastered{background:var(--okbg);color:var(--ok)}
.chip.Developing{background:var(--midbg);color:var(--mid)}
.chip.Weak{background:var(--badbg);color:var(--bad)}
.mbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0 4px}
.mbar i{display:block;height:100%}
.hint{font-size:13.5px;color:var(--muted)}
ul.mis{margin:6px 0 0;padding-left:20px}
ul.mis li{margin:6px 0}
.flag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--bad);margin-right:6px}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
.rev{font-size:14.5px;margin-top:8px}
.rev .q{margin-bottom:6px}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px}
.fb.good{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.note .tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--brand2);padding:2px 8px;border-radius:6px;margin-bottom:6px}
.note h4{margin:14px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand)}
.note p,.note ul{margin:4px 0}
.note ul{padding-left:20px}
.formula{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:18px;background:#f3f6fa;border-left:3px solid var(--brand2);padding:8px 12px;margin:8px 0;border-radius:4px}
.trap{background:var(--midbg);border-radius:8px;padding:10px 12px;margin-top:10px}
.ex{background:#f3f6fa;border-radius:8px;padding:10px 12px;margin-top:10px}
.preview{font-size:13px;background:#fff7e0;border:1px solid #f0dca6;color:#7a5a00;padding:8px 12px;border-radius:8px;margin-top:10px}
.part{padding:14px 0;border-top:1px dashed var(--line)}
.part:first-of-type{border-top:0;padding-top:4px}
.plabel{font-weight:700;color:var(--brand);margin-right:6px}
.numrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.numrow input{width:200px;display:inline-block;margin:0}
.numrow .unit{font-weight:600;color:var(--muted)}
.numrow input.right{border-color:var(--ok);background:var(--okbg)}
.numrow input.wrong{border-color:var(--bad);background:var(--badbg)}
.tip{font-size:13px;color:var(--muted);margin-top:4px}
.fig{display:block;margin:6px auto 14px;max-width:100%;height:auto}
.skill{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:6px;background:#eef2f7;color:var(--brand);margin-left:6px;vertical-align:2px}
.btn.sm{padding:9px 14px;font-size:14px}
.chap{cursor:default}
.chap .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chap .acts .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.25}
.chap .acts .btn small{font-weight:500;font-size:12px;opacity:.8}
.chapters{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.symbox{margin:14px 0 4px}.symh{font-weight:600;font-size:14px;color:var(--brand2);margin-bottom:6px}
table.sym,table.cmp{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
table.sym th,table.sym td,table.cmp th,table.cmp td{border:1px solid #dbe2ea;padding:6px 8px;text-align:left;vertical-align:top}
table.sym th,table.cmp th{background:#f3f6fa;font-weight:600}
table.sym td.s{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:16px;white-space:nowrap}
@media(max-width:560px){table.sym,table.cmp{font-size:13px}table.sym th,table.sym td,table.cmp th,table.cmp td{padding:5px}}
.hist .hrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist .hrow:last-child{border-bottom:0}.hist .hs{font-weight:700}

.cat{fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.cat .eye{fill:var(--brand);stroke:none;transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.cat .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s ease-out forwards}
.cat .tail{stroke-dasharray:1;stroke-dashoffset:1;transform-box:view-box;transform-origin:45px 57px;animation:draw 1.8s ease-out forwards,swish 2.6s ease-in-out 1.8s infinite}
.cat.head{position:absolute;right:16px;bottom:2px;width:44px;height:44px;stroke:#fff}
.cat.head .eye{fill:#fff}
header.top .wrap{position:relative}
.catbar{position:relative;margin-top:8px;padding-top:18px}
.catbar .bar{margin-top:0}
.barcat{position:absolute;top:-6px;transform:translateX(-50%);transition:left .6s ease}
.cat.tiny{width:26px;height:26px;stroke-width:3}
.cat.tiny .draw,.cat.tiny .tail{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
.cat.tiny .tail{animation:swish 2.6s ease-in-out infinite}
.cat.tiny .face path{display:none}
.nap{text-align:center;margin:26px 0 8px}
.cat.sleep{width:180px;height:90px}
.cat.sleep .breathe{transform-box:view-box;transform-origin:60px 62px;animation:breathe 3.6s ease-in-out infinite}
.cat .z{fill:var(--brand2);stroke:none;font:600 11px system-ui,sans-serif;opacity:0;animation:zz 3.6s ease-in-out infinite}
.cat .z2{animation-delay:.6s;font-size:13px}.cat .z3{animation-delay:1.2s;font-size:15px}
.cheer{display:flex;align-items:flex-end;gap:10px;margin:-6px 0 6px}
.cheer span{font-weight:650;color:var(--brand2);padding-bottom:10px}
.cat.peek{width:110px;height:68px;flex:none}
.cat.peek .wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave 1.1s ease-in-out 1.6s 3}
.cat.peek{animation:pop .7s cubic-bezier(.3,1.6,.6,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.06)}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}30%{opacity:1}100%{opacity:0;transform:translate(4px,-10px)}}
@keyframes wave{0%,100%{transform:rotate(0)}30%{transform:rotate(-18deg) translateY(-4px)}70%{transform:rotate(14deg) translateY(-4px)}}
@keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.cat *,.cat{animation:none!important;stroke-dashoffset:0!important}.cat .z{opacity:1}}
@media(max-width:420px){.cat.head{width:36px;height:36px;right:10px}}

/* background cats */
main.wrap,header.top{position:relative;z-index:1}
.bgcats{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.42}
.bgcats svg{overflow:visible}
.bc{fill:none;stroke:var(--brand);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bc .dot{fill:var(--brand);stroke:none}
.bc .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.bgcats .walker{position:absolute;bottom:10px;left:0;width:124px;height:72px;animation:walkx 46s linear infinite}
.bgcats .walker .flip{width:100%;height:100%;animation:walkflip 46s steps(1) infinite}
.bgcats .walker .bc{width:124px;height:72px;animation:bob .5s ease-in-out infinite}
.bc .lg{transform-box:fill-box;transform-origin:50% 0}
.bc .l1{animation:leg .5s ease-in-out infinite}.bc .l2{animation:leg .5s ease-in-out -.25s infinite}
.bc .tl{transform-box:fill-box;transform-origin:100% 100%;animation:swish 1.6s ease-in-out infinite}
.bc .tl2{transform-box:fill-box;transform-origin:0 100%;animation:swish 2.2s ease-in-out infinite}
.bgcats .roller{position:absolute;top:38%;left:0;width:70px;height:70px;animation:rollx 30s ease-in-out infinite}
.bgcats .roller .spin{width:70px;height:70px;animation:rollspin 30s ease-in-out infinite}
.bgcats .roller .bc{width:70px;height:70px}
.bgcats .sleeper{position:absolute;top:84px;left:8px}
.bgcats .sleeper .cat.sleep{width:150px;height:75px}
.bgcats .sleeper .cat .draw{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
.bgcats .players{position:absolute;right:14px;bottom:110px;display:flex;align-items:flex-end;gap:4px}
.bgcats .players .p1 .bc,.bgcats .players .p2 .bc{width:64px;height:70px}
.bgcats .players .p2{transform:scaleX(-1)}
.bgcats .players .p2 .bat{animation-delay:-.9s}
.bc .bat{transform-box:fill-box;transform-origin:0 100%;animation:bat 1.8s ease-in-out infinite}
.bgcats .yarn{width:30px;height:30px;margin-bottom:2px;animation:yarn 1.8s ease-in-out infinite}
.bgcats .yarn .bc{width:30px;height:30px}
@keyframes walkx{0%{transform:translateX(-140px)}50%{transform:translateX(calc(100vw + 20px))}100%{transform:translateX(-140px)}}
@keyframes walkflip{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes leg{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes rollx{0%,8%{transform:translateX(-90px)}50%,58%{transform:translateX(calc(100vw + 20px))}100%{transform:translateX(-90px)}}
@keyframes rollspin{0%,8%{transform:rotate(0)}50%,58%{transform:rotate(1440deg)}100%{transform:rotate(0)}}
@keyframes bat{0%,40%,100%{transform:rotate(0)}55%{transform:rotate(-38deg)}70%{transform:rotate(6deg)}}
@keyframes yarn{0%,100%{transform:translate(-14px,0) rotate(0)}25%{transform:translate(0,-16px) rotate(140deg)}50%{transform:translate(14px,0) rotate(280deg)}75%{transform:translate(0,-12px) rotate(140deg)}}
.linkbtn{background:none;border:0;color:var(--brand2);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:4px}
@media (prefers-reduced-motion:reduce){.bgcats *{animation:none!important}.bgcats .walker{left:30%}.bgcats .roller{left:70%}}
@media (max-width:560px){.bgcats .sleeper{top:auto;bottom:90px;left:4px}.bgcats .sleeper .cat.sleep{width:110px;height:55px}.bgcats .players{bottom:170px}}
.formula.tex{display:flex;flex-wrap:wrap;align-items:center;gap:10px 30px;font-family:inherit;padding:12px 14px;overflow-x:auto}
.formula.tex .fi{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 8px;max-width:100%}
.formula.tex .fe{white-space:nowrap;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.formula.tex .fl{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;color:var(--muted)}
.formula.tex .katex{font-size:1.15em}
@media(max-width:560px){.formula.tex .katex{font-size:1.02em}.formula.tex{gap:8px 22px}.bgcats{opacity:.28}}

.card,.chap{background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px)}
input{background:rgba(252,252,250,.55)}
.opt{background:rgba(252,252,250,.5)}
.opt.sel{background:rgba(234,242,250,.75)}

figure.tfig{margin:16px 0 18px;text-align:center}
.tsvg{display:block;margin:0 auto;max-width:100%;height:auto;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:10px;padding:8px}
figure.tfig figcaption{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4;padding:0 6px}

.note ol{padding-left:22px}.note ol li{margin:4px 0}
.ex p,.trap p{margin:6px 0}
.homebtn{margin-left:auto;margin-right:56px;align-self:center;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 14px;font:600 13.5px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer}
.top .brand{white-space:nowrap}.homebtn{white-space:nowrap}

.calc b{color:var(--brand)}

.exq .exh{margin-top:0}
ol.parts{list-style:none;padding-left:0;margin:6px 0}ol.parts li{margin:5px 0;padding-left:30px;text-indent:-30px}

.given{font-size:14px;color:var(--muted);margin:8px 0 0}

<script>
/* =====================================================================
   FIGURES (simple SVG drawings used in questions)
   ===================================================================== */
function chg(x, y, sign, label, lx, ly){
  const c = sign === "+" ? "#c0392b" : "#2a6aa3";
  return `<circle cx="${x}" cy="${y}" r="13" fill="${c}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">${sign==="+"?"+":"&#8722;"}</text>`
    + (label ? `<text x="${x+(lx||0)}" y="${y+(ly==null?-20:ly)}" text-anchor="middle" font-size="13" fill="#1b2232">${label}</text>` : "");
}

const CH5 = {
  id: 5, title: "Electromagnetic Induction", open: true,
  subtopics: [
    { id:"5.1", name:"Magnetic flux and flux linkage",
      note:`<p>Magnetic flux is B times the area, using the component of B along the <b>normal</b> to the surface. Flux linkage is the flux through one turn times the number of turns.</p>
      <div class="formula" data-tex="\\phi=BA\\cos\\theta||\\Phi=N\\phi">&phi; = BA cos &theta; &nbsp;&nbsp; &Phi; = N&phi;</div>
      <h4>Problem-solving steps</h4>
      <ul><li>&theta; is the angle between B and the <b>normal</b>. If the question gives the angle with the <b>plane</b>, use &theta; = 90&deg; &minus; that angle.</li>
      <li>Area: 1 cm<sup>2</sup> = 10<sup>&minus;4</sup> m<sup>2</sup>. From a diameter, r = d/2 and A = &pi;r<sup>2</sup>.</li>
      <li>Flux linkage multiplies by N. Flux does not.</li></ul>
      <div class="trap"><b>Common trap:</b> using cos of the angle with the plane. Plane perpendicular to B means maximum flux (&theta; = 0&deg;).</div>
      <div class="ex"><b>Worked example.</b> 500 turns, r = 2.0 cm, B = 0.60 T at 30&deg; to the normal.<br>A = &pi;(0.020)<sup>2</sup><br>A = 1.26&times;10<sup>&minus;3</sup> m<sup>2</sup><br>&phi; = BA cos &theta;<br>&phi; = (0.60)(1.26&times;10<sup>&minus;3</sup>) cos 30&deg;<br>&phi; = 6.53&times;10<sup>&minus;4</sup> Wb<br>&Phi; = N&phi;<br>&Phi; = 500 &times; 6.53&times;10<sup>&minus;4</sup><br>&Phi; = 0.327 Wb</div>` },
    { id:"5.2", name:"Induced emf, Faraday's law and Lenz's law",
      note:`<p>An emf is induced whenever the flux linking a circuit changes. Its size is the rate of change of flux linkage (Faraday). The induced current flows to <b>oppose the change</b> that causes it (Lenz).</p>
      <div class="formula" data-tex="\\varepsilon=-N\\dfrac{d\\phi}{dt}||\\varepsilon=-NA\\dfrac{dB}{dt}||\\varepsilon=Blv\\sin\\theta||\\varepsilon=NBA\\omega\\sin\\omega t">&epsilon; = &minus;N d&phi;/dt &nbsp;&nbsp; &epsilon; = &minus;NA dB/dt &nbsp;&nbsp; &epsilon; = Blv sin &theta; &nbsp;&nbsp; &epsilon; = NBA&omega; sin &omega;t</div>
      <h4>Problem-solving steps</h4>
      <ul><li>Changing B: use the <b>change</b> B<sub>f</sub> &minus; B<sub>i</sub>, not B alone. Changing area: use A<sub>f</sub> &minus; A<sub>i</sub>.</li>
      <li>Moving rod: &epsilon; = Blv. Then I = &epsilon;/R.</li>
      <li>Rotating coil: &omega; = 2&pi;f, with f in revolutions per second. Maximum emf = NBA&omega;, when the plane of the coil is parallel to B.</li>
      <li>Lenz: flux increasing, the induced B opposes it. Flux decreasing, the induced B is in the same direction to keep it. Then use the right-hand grip rule for the current.</li></ul>
      <div class="ex"><b>Worked example.</b> 50 turns, A = 8.0 cm<sup>2</sup>, B falls from 1.80 T to 0.60 T in 0.020 s.<br>&epsilon; = &minus;NA(B<sub>f</sub> &minus; B<sub>i</sub>)/t<br>&epsilon; = &minus;(50)(8.0&times;10<sup>&minus;4</sup>)(0.60 &minus; 1.80)/0.020<br>&epsilon; = 2.4 V</div>` },
    { id:"5.3", name:"Self-inductance",
      note:`<p>A changing current in a coil changes its own flux linkage, so it induces a back emf in itself. Self-inductance L is the back emf per unit rate of change of current.</p>
      <div class="formula" data-tex="\\varepsilon=-L\\dfrac{dI}{dt}||L=\\dfrac{N\\phi}{I}||L_{\\text{solenoid}}=\\dfrac{\\mu_0N^2A}{l}||\\mu_0=4\\pi\\times10^{-7}\\ \\text{T m A}^{-1}">&epsilon; = &minus;L dI/dt &nbsp;&nbsp; L = N&phi;/I &nbsp;&nbsp; L = &mu;<sub>0</sub>N<sup>2</sup>A/l &nbsp;&nbsp; &mu;<sub>0</sub> = 4&pi; &times; 10<sup>&minus;7</sup> T m A<sup>&minus;1</sup></div>
      <h4>Problem-solving steps</h4>
      <ul><li>Length in metres, area in m<sup>2</sup>, radius = diameter / 2.</li>
      <li>"n turns per cm": N = n &times; (length in cm).</li>
      <li>Flux linkage NΦ = LI. Flux through one turn = LI / N.</li></ul>
      <div class="ex"><b>Worked example.</b> 5.0 V is induced when the current changes at 25 A s<sup>&minus;1</sup>.<br>L = &epsilon; / (dI/dt)<br>L = 5.0 / 25<br>L = 0.20 H</div>` },
    { id:"5.4", name:"Energy stored in an inductor",
      note:`<p>An inductor carrying a current stores energy in its magnetic field.</p>
      <div class="formula" data-tex="U=\\tfrac12LI^2">U = &frac12;LI<sup>2</sup></div>
      <h4>Problem-solving steps</h4>
      <ul><li>A coil with resistance across a battery: the steady (maximum) current is I = V/R.</li>
      <li>Keep the &frac12; and square the current.</li></ul>
      <div class="ex"><b>Worked example.</b> L = 30 mH, R = 0.25 &Omega;, V = 12 V.<br>I = V / R<br>I = 12 / 0.25<br>I = 48 A<br>U = &frac12;LI<sup>2</sup><br>U = &frac12;(30&times;10<sup>&minus;3</sup>)(48)<sup>2</sup><br>U = 34.6 J</div>` },
    { id:"5.5", name:"Mutual inductance",
      note:`<p>A changing current in one coil changes the flux through a nearby coil and induces an emf in it.</p>
      <div class="formula" data-tex="\\varepsilon_2=-M\\dfrac{dI_1}{dt}||M=\\dfrac{N_2\\phi_2}{I_1}||M=\\dfrac{\\mu_0N_1N_2A}{l}">&epsilon;<sub>2</sub> = &minus;M dI<sub>1</sub>/dt &nbsp;&nbsp; M = N<sub>2</sub>&phi;<sub>2</sub>/I<sub>1</sub> &nbsp;&nbsp; M = &mu;<sub>0</sub>N<sub>1</sub>N<sub>2</sub>A/l</div>
      <h4>Problem-solving steps</h4>
      <ul><li>For a coil wound on a solenoid, A and l are the <b>solenoid's</b> area and length.</li>

      <div class="ex"><b>Worked example.</b> Current in coil 1 rises from 2 A to 10 A in 0.4 s and 60 mV is induced in coil 2.<br>M = &epsilon;<sub>2</sub> / (dI<sub>1</sub>/dt)<br>M = 0.060 / (8/0.4)<br>M = 3.0&times;10<sup>&minus;3</sup> H</div>` }

      <ul><li>Read I<sub>0</sub> (or V<sub>0</sub>) and &omega; straight from the equation. Then f = &omega;/2&pi; and T = 1/f.</li>
      <li>From a graph: peak from the highest point, T from one full cycle, then &omega; = 2&pi;/T.</li>
      <li>For an instantaneous value, &omega;t is in <b>radians</b>: set your calculator to RAD.</li></ul>
      <div class="trap"><b>Common trap:</b> calculating sin &omega;t in DEG mode, or giving &omega; as the frequency.</div>
      <div class="ex"><b>Worked example.</b> V = 520 sin 100t.<br>&omega; = 100 rad s<sup>&minus;1</sup><br>f = &omega; / 2&pi;<br>f = 100 / 2&pi;<br>f = 15.9 Hz</div>` },
    { id:"6.2", name:"Root mean square values",
      note:`<p>The rms value is the steady DC value that gives the same average power in a resistor as the AC. Meters and mains ratings (240 V) are rms values.</p>
      <div class="formula" data-tex="I_{\\text{rms}}=\\dfrac{I_0}{\\sqrt2}||V_{\\text{rms}}=\\dfrac{V_0}{\\sqrt2}">I<sub>rms</sub> = I<sub>0</sub>/&radic;2 &nbsp;&nbsp; V<sub>rms</sub> = V<sub>0</sub>/&radic;2</div>
      <h4>Problem-solving steps</h4>
      <ul><li>A rating such as "120 V" is rms. Use rms values in P = IV and V = IR.</li>
      <li>Peak = rms &times; &radic;2.</li></ul>
      <div class="ex"><b>Worked example.</b> V = 500 sin &omega;t across 250 &Omega;.<br>V<sub>rms</sub> = 500 / &radic;2<br>V<sub>rms</sub> = 354 V<br>I<sub>rms</sub> = 354 / 250<br>I<sub>rms</sub> = 1.41 A</div>` },
    { id:"6.3", name:"Reactance, impedance, phase angle and resonance",
      note:`<p>In a resistor V and I are in phase. In a capacitor the current leads the voltage by 90&deg;. In an inductor the voltage leads the current by 90&deg;. In a series circuit the same current flows through every component, and the voltages add as phasors.</p>
      <div class="formula" data-tex="X_C=\\dfrac{1}{2\\pi fC}||X_L=2\\pi fL||Z=\\sqrt{R^2+\\left(X_L-X_C\\right)^2}||\\tan\\phi=\\dfrac{X_L-X_C}{R}||f_r=\\dfrac{1}{2\\pi\\sqrt{LC}}">X<sub>C</sub> = 1/(2&pi;fC) &nbsp;&nbsp; X<sub>L</sub> = 2&pi;fL &nbsp;&nbsp; Z = &radic;[R<sup>2</sup> + (X<sub>L</sub> &minus; X<sub>C</sub>)<sup>2</sup>] &nbsp;&nbsp; tan &phi; = (X<sub>L</sub> &minus; X<sub>C</sub>)/R &nbsp;&nbsp; f<sub>r</sub> = 1/(2&pi;&radic;LC)</div>
      <h4>Problem-solving steps</h4>
      <ul><li>Convert mH and &mu;F first. Find X<sub>L</sub> and X<sub>C</sub>, then Z, then I = V/Z.</li>
      <li>From component voltages: V = &radic;[V<sub>R</sub><sup>2</sup> + (V<sub>L</sub> &minus; V<sub>C</sub>)<sup>2</sup>]. Do not add them.</li>
      <li>X<sub>L</sub> &gt; X<sub>C</sub>: inductive, voltage leads current. X<sub>C</sub> &gt; X<sub>L</sub>: capacitive, current leads voltage.</li>
      <li>Resonance: X<sub>L</sub> = X<sub>C</sub>, Z = R (minimum), current maximum, V and I in phase.</li></ul>
      <div class="trap"><b>Common trap:</b> adding X<sub>L</sub> and X<sub>C</sub>, or using a peak current with an rms voltage.</div>
      <div class="ex"><b>Worked example.</b> 2.0 &mu;F and 1000 &Omega; in series, 12 V, 50 Hz.<br>X<sub>C</sub> = 1 / (2&pi; &times; 50 &times; 2.0&times;10<sup>&minus;6</sup>)<br>X<sub>C</sub> = 1592 &Omega;<br>Z = &radic;(1000<sup>2</sup> + 1592<sup>2</sup>)<br>Z = 1880 &Omega;<br>I = 12 / 1880<br>I = 6.38&times;10<sup>&minus;3</sup> A</div>` },
    { id:"6.4", name:"Power and power factor",
      note:`<p>Only the resistor dissipates power. A pure capacitor or inductor takes energy in one quarter-cycle and returns it in the next, so its average power is zero.</p>
      <div class="formula" data-tex="P_{\\text{av}}=I_{\\text{rms}}V_{\\text{rms}}\\cos\\phi=I_{\\text{rms}}^2R||\\cos\\phi=\\dfrac{R}{Z}=\\dfrac{V_R}{V}">P<sub>av</sub> = I<sub>rms</sub>V<sub>rms</sub> cos &phi; = I<sub>rms</sub><sup>2</sup>R &nbsp;&nbsp; cos &phi; = R/Z = V<sub>R</sub>/V</div>
      <h4>Problem-solving steps</h4>
      <ul><li>Power factor = R/Z. Average (real) power = I<sub>rms</sub><sup>2</sup>R, using R only, not Z.</li>
      <li>I<sup>2</sup>Z or IV gives the apparent power, not the power used.</li></ul>
      <div class="ex"><b>Worked example.</b> I<sub>rms</sub> = 2.0 A, R = 30 &Omega;, Z = 50 &Omega;.<br>cos &phi; = R / Z<br>cos &phi; = 30 / 50<br>cos &phi; = 0.60<br>P = I<sup>2</sup>R<br>P = (2.0)<sup>2</sup>(30)<br>P = 120 W</div>` }
  ],

      note:`<p>Current is the rate of flow of charge. In a metal the charge carriers are free electrons. With no potential difference they move randomly, so there is no net flow. A potential difference sets up a field, and the electrons drift slowly opposite to E.</p>
      <div class="formula" data-tex="I=\\dfrac{dQ}{dt}||Q=ne||e=1.60\\times10^{-19}\\ \\text{C}">I = dQ / dt &nbsp;&nbsp; Q = ne &nbsp;&nbsp; e = 1.60 &times; 10<sup>&minus;19</sup> C</div>

      <ul><li>Convert time to seconds first (2 min = 120 s).</li>

    { id:"3.2", name:"Ohm's law and resistivity",

      <div class="formula" data-tex="V=IR||R=\\dfrac{\\rho l}{A}||\\rho=\\dfrac{RA}{l}">V = IR &nbsp;&nbsp; R = &rho;l / A &nbsp;&nbsp; &rho; = RA / l</div>

      <div class="ex"><b>Worked example.</b> 1.5 m of wire, A = 5.0&times;10<sup>&minus;8</sup> m<sup>2</sup>, carries 0.40 A at 0.20 V.<br>R = V / I<br>R = 0.20 / 0.40<br>R = 0.50 &Omega;<br>&rho; = RA / l<br>&rho; = (0.50)(5.0&times;10<sup>&minus;8</sup>) / 1.5<br>&rho; = 1.67&times;10<sup>&minus;8</sup> &Omega; m</div>` },
    { id:"3.3", name:"Variation of resistance with temperature",
      note:`<p>In a metal, resistance rises with temperature. The ions vibrate with greater amplitude, so the free electrons collide with them more often, and their drift is hindered.</p>
      <div class="formula" data-tex="R=R_0\\left[1+\\alpha\\left(T-T_0\\right)\\right]||\\alpha=\\dfrac{1}{\\rho_0}\\dfrac{\\Delta\\rho}{\\Delta T}">R = R<sub>0</sub>[1 + &alpha;(T &minus; T<sub>0</sub>)] &nbsp;&nbsp; &alpha; = (1/&rho;<sub>0</sub>)(&Delta;&rho;/&Delta;T)</div>
      <h4>Problem-solving steps</h4>
      <ul><li>Use the temperature <b>change</b>, T &minus; T<sub>0</sub>, not T alone.</li>

    { id:"3.4", name:"Emf, internal resistance and terminal potential difference",
      note:`<p>Emf is the energy given by the source to each unit charge passing through the external and internal resistances. Terminal p.d. is the work per unit charge through the external resistance only. When current flows, part of the emf is lost across r.</p>
      <div class="formula" data-tex="\\varepsilon=V+Ir||I=\\dfrac{\\varepsilon}{R+r}||V=IR">&epsilon; = V + Ir &nbsp;&nbsp; I = &epsilon; / (R + r) &nbsp;&nbsp; V = IR</div>
      <h4>Problem-solving steps</h4>

    { id:"3.6", name:"Kirchhoff's rules",

      <div class="formula" data-tex="\\Sigma I_{\\text{in}}=\\Sigma I_{\\text{out}}||\\Sigma\\varepsilon=\\Sigma IR">&Sigma;I<sub>in</sub> = &Sigma;I<sub>out</sub> &nbsp;&nbsp; &Sigma;&epsilon; = &Sigma;IR</div>
      <h4>Problem-solving steps</h4>
      <ul><li>Mark a current in every branch. Resistors in the same branch carry the same current.</li>

    { id:"3.7", name:"Electrical energy and power",
      note:`<div class="formula" data-tex="W=IVt||P=\\dfrac{W}{t}=IV=I^2R=\\dfrac{V^2}{R}">W = IVt &nbsp;&nbsp; P = W/t = IV = I<sup>2</sup>R = V<sup>2</sup>/R</div>

      note:`<p>Two point charges exert equal and opposite forces along the line joining them. Like charges repel, unlike charges attract.</p>
      <div class="formula" data-tex="F=\\dfrac{kq_1q_2}{r^2}||k=9.0\\times10^{9}\\ \\text{N m}^2\\,\\text{C}^{-2}">F = k q<sub>1</sub>q<sub>2</sub> / r<sup>2</sup> &nbsp;&nbsp; k = 9.0 &times; 10<sup>9</sup> N m<sup>2</sup> C<sup>&minus;2</sup></div>

{
  id: 2, title: "Capacitors and Dielectrics", open: true,
  subtopics: [
    { id:"2.1", name:"Capacitance, series and parallel, energy stored",
      note:`<div class="formula" data-tex="C=\\dfrac{Q}{V}||\\text{series: } \\dfrac{1}{C_{\\text{eff}}}=\\dfrac{1}{C_1}+\\dfrac{1}{C_2}+\\cdots||\\text{parallel: } C_{\\text{eff}}=C_1+C_2+\\cdots||U=\\tfrac12QV=\\tfrac12CV^2=\\dfrac{Q^2}{2C}">C = Q / V &nbsp;&nbsp; series: 1/C<sub>eff</sub> = 1/C<sub>1</sub> + 1/C<sub>2</sub> + ... &nbsp;&nbsp; parallel: C<sub>eff</sub> = C<sub>1</sub> + C<sub>2</sub> + ... &nbsp;&nbsp; U = &frac12;QV = &frac12;CV<sup>2</sup> = Q<sup>2</sup>/2C</div>
      <h4>Problem-solving steps</h4>
      <ul><li><b>Series:</b> every capacitor has the <b>same charge</b>. The voltages add up to the supply.</li>
      <li><b>Parallel:</b> every capacitor has the <b>same voltage</b>. The charges add up.</li>
      <li>Reduce the circuit step by step. Combine the innermost series or parallel group first, then redraw.</li>
      <li>To go back out: find Q<sub>total</sub> = C<sub>eff</sub>V, then work backwards using the series and parallel rules.</li>
      <li>Battery disconnected means Q is constant. Battery still connected means V is constant.</li></ul>
      <div class="trap"><b>Common traps:</b> the series and parallel formulas are the opposite of resistors. Remember the &frac12; in the energy formula. Convert &mu;F to F before calculating charge or energy.</div>
      <div class="ex"><b>Worked example.</b> 4 &mu;F and 6 &mu;F in series across 240 V. C<sub>eff</sub> = (4&times;6)/(4+6) = 2.4 &mu;F. Q = 2.4&times;10<sup>&minus;6</sup> &times; 240 = 5.76&times;10<sup>&minus;4</sup> C on <i>each</i>. V<sub>4</sub> = Q/4&micro;F = 144 V and V<sub>6</sub> = 96 V, which add up to 240 V.</div>` },
    { id:"2.2", name:"Charging, discharging and time constant",
      note:`<div class="formula" data-tex="\\tau=RC||\\text{discharging: } Q=Q_0e^{-t/RC}||\\text{charging: } Q=Q_0\\left(1-e^{-t/RC}\\right)||I_0=\\dfrac{V_0}{R}">&tau; = RC &nbsp;&nbsp; discharging: Q = Q<sub>0</sub>e<sup>&minus;t/RC</sup> &nbsp;&nbsp; charging: Q = Q<sub>0</sub>(1 &minus; e<sup>&minus;t/RC</sup>) &nbsp;&nbsp; I<sub>0</sub> = V<sub>0</sub>/R</div>
      <h4>Problem-solving steps</h4>
      <ul><li>Decide first: is it <b>charging</b> or <b>discharging</b>? Pick the matching equation.</li>
      <li>&tau; is in seconds: convert k&Omega;, M&Omega;, &mu;F and minutes first. Capacitors in the circuit? Use C<sub>eff</sub>.</li>
      <li>To find t or &tau; from a fraction, take ln of both sides: Q/Q<sub>0</sub> = e<sup>&minus;t/&tau;</sup> gives t = &tau; ln(Q<sub>0</sub>/Q). 0.05% means Q/Q<sub>0</sub> = 0.0005.</li>
      <li>Graphs: current always decays exponentially from I<sub>0</sub> to zero, both when charging and when discharging. Q rises towards Q<sub>0</sub> when charging and decays towards zero when discharging.</li></ul>
      <div class="trap"><b>Meaning of &tau;:</b> the time to reach 63% of the maximum charge when charging, or to fall to 37% of the initial charge when discharging.</div>

        exp:"F &prop; q<sub>1</sub>q<sub>2</sub> and F &prop; 1/r<sup>2</sup>, so F = kq<sub>1</sub>q<sub>2</sub>/r<sup>2</sup>." },
      { bloom:"C1", prompt:"What is the SI unit of the permittivity of free space, &epsilon;<sub>0</sub>?",
        opts:[ {t:"C<sup>2</sup> N<sup>&minus;1</sup> m<sup>&minus;2</sup>", ok:true}, {t:"N m<sup>2</sup> C<sup>&minus;2</sup>", mis:"That is the unit of k. &epsilon;<sub>0</sub> = 1/(4&pi;k), so its unit is the inverse."}, {t:"N C<sup>&minus;1</sup>", mis:"That is the unit of electric field strength."} ],
        exp:"From k = 1/(4&pi;&epsilon;<sub>0</sub>), the unit of &epsilon;<sub>0</sub> is the inverse of N m<sup>2</sup> C<sup>&minus;2</sup>, which is C<sup>2</sup> N<sup>&minus;1</sup> m<sup>&minus;2</sup> (also written F m<sup>&minus;1</sup>)." },
      { bloom:"C2", prompt:"A +4q charge exerts a force F on a nearby +q charge. What force does the +q charge exert on the +4q charge?",
        opts:[ {t:"F, in the opposite direction", ok:true}, {t:"4F, because the other charge is four times bigger", mis:"Both charges appear in the same product q<sub>1</sub>q<sub>2</sub>, so each feels the same size of force."}, {t:"F/4, because +q is smaller", mis:"Newton's third law: the forces on the two charges are equal in size and opposite in direction."} ],
        exp:"The forces form a Newton's third law pair, so they are equal in magnitude and opposite in direction." },
      { bloom:"C2", prompt:"The distance between two point charges is tripled. What happens to the force between them?",
        opts:[ {t:"It becomes one ninth of its original value", ok:true}, {t:"It becomes one third of its original value", mis:"F &prop; 1/r<sup>2</sup>, so tripling r divides F by 3<sup>2</sup> = 9."}, {t:"It is three times bigger", mis:"Force decreases as distance increases."} ],
        exp:"F &prop; 1/r<sup>2</sup>: F&prime; = F/3<sup>2</sup> = F/9." } ] },

  { sub:"1.2", title:"Electric field",
    html:`<p>An <b>electric field</b> is a region around a charge in which another charge experiences an electric force.</p>
    <p><b>Electric field strength</b> at a point is the electric force per unit <b>positive</b> test charge placed at that point. It is a vector, with unit N C<sup>&minus;1</sup> (equal to V m<sup>&minus;1</sup>).</p>
    <div class="formula" data-tex="E=\\dfrac{F}{q_0}||\\text{point charge: } E=\\dfrac{kQ}{r^2}">E = F / q<sub>0</sub> &nbsp;&nbsp; point charge: E = kQ / r<sup>2</sup></div>
    <h4>Electric field lines</h4>
    <ul><li>Start on positive charges and end on negative charges.</li>
    <li>Never cross, because the field has only one direction at any point.</li>
    <li>The tangent to a line gives the direction of E at that point.</li>
    <li>Closer lines mean a stronger field.</li>
    <li>Between parallel plates the lines are <b>parallel and equally spaced</b>, which shows a uniform field.</li></ul>`,
    qs:[
      { bloom:"C1", prompt:"Define electric field strength.",
        opts:[ {t:"The electric force per unit positive charge at a point", ok:true}, {t:"The work done per unit positive charge in bringing it from infinity", mis:"That is the definition of electric potential."}, {t:"The electric force per unit mass at a point", mis:"Electric field is force per unit <i>charge</i>, not mass."} ],
        exp:"E = F/q<sub>0</sub>, where q<sub>0</sub> is a small positive test charge." },
      { bloom:"C2", prompt:"Why can electric field lines never cross?",
        opts:[ {t:"The electric field has only one direction at any point", ok:true}, {t:"Field lines repel each other", mis:"Field lines are a drawing tool. They do not exert forces on each other."}, {t:"The field is zero wherever two lines would meet", mis:"If two lines crossed, the point would need two field directions at once, which is impossible."} ],
        exp:"At a crossing point, a test charge would have two possible force directions. Since E has a single direction at each point, lines cannot cross." },
      { bloom:"C2", prompt:"Which field line pattern represents a <b>uniform</b> electric field?",
        opts:[ {t:"Parallel, equally spaced straight lines", ok:true}, {t:"Straight lines spreading out from a point charge", mis:"Radial lines spread apart, so the field gets weaker with distance. It is not uniform."}, {t:"Curved lines from a positive charge to a negative charge", mis:"The spacing of curved lines changes, so the field strength changes from point to point."} ],
        exp:"Uniform means the same magnitude and direction everywhere: parallel lines with equal spacing, as between parallel plates." },
      { bloom:"C2", prompt:"An electron is placed at a point where the electric field points east. In which direction is the force on the electron?",
        opts:[ {t:"West", ok:true}, {t:"East", mis:"E is defined using a <i>positive</i> test charge. A negative charge is pushed the opposite way."}, {t:"There is no force on it, because the electron is negative", mis:"Any charge in a field feels a force, F = qE. The sign of q only sets the direction."} ],
        exp:"F = qE with q = &minus;e, so the force is opposite to E." } ] },

  { sub:"1.3", title:"Electric potential, potential energy and equipotentials",
    html:`<p><b>Electric potential</b> at a point is the work done by an external force in bringing a unit positive charge from infinity to that point. It is a <b>scalar</b>, with unit volt (V = J C<sup>&minus;1</sup>).</p>
    <div class="formula" data-tex="V=\\dfrac{kQ}{r}||U=qV=\\dfrac{kq_1q_2}{r}||W=q\\Delta V">V = kQ / r &nbsp;&nbsp; U = qV = kq<sub>1</sub>q<sub>2</sub> / r &nbsp;&nbsp; W = q&Delta;V</div>
    <ul><li><b>Potential difference</b> between two points is the work done per unit charge in moving a charge from one point to the other.</li>
    <li><b>Electric potential energy</b> of a charge at a point is the work done in bringing that charge from infinity to the point.</li>
    <li>Potentials from several charges are added algebraically, with signs. There are no components.</li></ul>
    <h4>Equipotential surfaces</h4>
    <ul><li>An equipotential surface is a surface on which every point has the same potential.</li>
    <li>No work is done moving a charge along it, because &Delta;V = 0.</li>
    <li>Field lines are always <b>perpendicular</b> to equipotentials and point from higher to lower potential.</li>
    <li>Point charge: concentric spheres. Uniform field: parallel planes.</li></ul>`,
    qs:[
      { bloom:"C1", prompt:"Define electric potential at a point.",
        opts:[ {t:"The work done in bringing a unit positive charge from infinity to that point", ok:true}, {t:"The force acting on a unit positive charge at that point", mis:"Force per unit charge is electric field strength."}, {t:"The work done in moving a unit positive charge through 1 m", mis:"Potential is measured from infinity, not over a fixed distance."} ],
        exp:"V = W/q<sub>0</sub>, measured from infinity, where V = 0." },
      { bloom:"C1", prompt:"The volt is equivalent to which unit?",
        opts:[ {t:"J C<sup>&minus;1</sup>", ok:true}, {t:"N C<sup>&minus;1</sup>", mis:"N C<sup>&minus;1</sup> is the unit of electric field strength (equal to V m<sup>&minus;1</sup>), not potential."}, {t:"C J<sup>&minus;1</sup>", mis:"That is upside down. Potential is energy per unit charge."} ],
        exp:"Potential is work (energy) per unit charge: 1 V = 1 J C<sup>&minus;1</sup>." },
      { bloom:"C2", prompt:"Why is no work done when a charge moves along an equipotential surface?",
        opts:[ {t:"The potential difference between any two points on it is zero", ok:true}, {t:"The electric field is zero on an equipotential surface", mis:"The field is not zero there. It is perpendicular to the surface, so it has no component along the motion."}, {t:"The charge moves at constant speed", mis:"The work depends on &Delta;V, not on the speed."} ],
        exp:"W = q&Delta;V, and &Delta;V = 0 between points at the same potential." },
      { bloom:"C2", prompt:"How are electric field lines related to equipotential surfaces?",
        opts:[ {t:"They are perpendicular, and the field points towards lower potential", ok:true}, {t:"They are parallel to each other", mis:"If E had a component along an equipotential, moving along it would need work, which contradicts &Delta;V = 0."}, {t:"They are perpendicular, and the field points towards higher potential", mis:"The field points the way a positive charge naturally moves, which is towards lower potential."} ],
        exp:"E is perpendicular to equipotentials and points in the direction of decreasing potential." } ] },

  { sub:"1.4", title:"Charge in a uniform electric field",
    html:`<p>Between two parallel charged plates the field is uniform, and its strength depends on the potential difference and the separation.</p>
    <div class="formula" data-tex="E=\\dfrac{V}{d}||F=qE||a=\\dfrac{qE}{m}">E = V / d &nbsp;&nbsp; F = qE &nbsp;&nbsp; a = qE / m</div>
    <ul><li>The force on a charge is the same everywhere between the plates.</li>
    <li>Positive charges accelerate in the direction of E. Electrons accelerate opposite to E, towards the positive plate.</li>
    <li>A proton and an electron feel forces of the same size (same |q|), but the electron's acceleration is about 1800 times bigger because its mass is much smaller.</li>
    <li>A charge entering at right angles to the field follows a <b>parabola</b>, like a projectile. Its horizontal velocity stays constant.</li></ul>`,
    qs:[
      { bloom:"C1", prompt:"For two parallel plates with potential difference V and separation d, the electric field between them is",
        opts:[ {t:"E = V / d", ok:true}, {t:"E = Vd", mis:"A bigger gap gives a weaker field, so d must be in the denominator."}, {t:"E = kQ / d<sup>2</sup>", mis:"That is the field of a point charge, not of parallel plates."} ],
        exp:"For a uniform field, E = V/d (unit V m<sup>&minus;1</sup>)." },
      { bloom:"C2", prompt:"A proton and an electron are placed in the same uniform field. Which statement is correct?",
        opts:[ {t:"They feel forces of equal size in opposite directions, and the electron has a much larger acceleration", ok:true}, {t:"They feel forces of equal size in the same direction, and have equal accelerations", mis:"Opposite charges are pushed in opposite directions, and a = F/m depends on mass."}, {t:"The proton feels a larger force because it is heavier", mis:"F = qE depends on charge, not mass. Both have |q| = e."} ],
        exp:"F = eE for both, in opposite directions. a = F/m, and m<sub>e</sub> is about 1/1836 of m<sub>p</sub>." },
      { bloom:"C2", prompt:"An electron enters the space between horizontal plates at right angles to the field. What path does it follow?",
        opts:[ {t:"A parabola curving towards the positive plate", ok:true}, {t:"A straight line, because the field is uniform", mis:"A uniform field gives a constant force, which still bends the path."}, {t:"A circular arc curving towards the negative plate", mis:"A constant force at right angles to the initial velocity gives a parabola. Electrons are attracted to the positive plate."} ],
        exp:"Constant horizontal velocity plus constant vertical acceleration gives a parabola, just like projectile motion." } ] }
],

2: [
  { sub:"2.1", title:"Capacitance, series and parallel, energy stored",
    html:`<p>A <b>capacitor</b> is a device that stores electric charge, and so stores electric potential energy. It consists of two conductors separated by a small air gap or a thin insulator, called a <b>dielectric</b>.</p>
    <p><b>Capacitance</b> is defined as the ratio of the charge on either plate to the potential difference between the plates. It is a scalar with SI unit the <b>farad</b> (F = C V<sup>&minus;1</sup>).</p>
    <div class="formula" data-tex="C=\\dfrac{Q}{V}">C = Q / V</div>
    <ul><li><b>1 farad</b> is the capacitance when 1 coulomb of charge is stored on each plate with a potential difference of 1 volt.</li>
    <li>A capacitor's capacitance does not change unless it is designed to be variable.</li>
    <li><b>Series:</b> each capacitor carries the same charge Q. The voltages add up.</li>
    <li><b>Parallel:</b> each capacitor has the same voltage V. The charges add up.</li></ul>
    <h4>Energy stored</h4>
    <p>Work must be done to push extra charge onto the plates against the growing potential difference. That work is stored as electric potential energy.</p>
    <div class="formula" data-tex="U=\\tfrac12QV=\\tfrac12CV^2=\\dfrac{Q^2}{2C}">U = &frac12;QV = &frac12;CV<sup>2</sup> = Q<sup>2</sup>/2C</div>`,
    qs:[
      { bloom:"C1", prompt:"Define capacitance.",
        opts:[ {t:"The ratio of the charge on either plate to the potential difference between the plates", ok:true}, {t:"The product of the charge on a plate and the potential difference", mis:"Q &times; V is related to energy. Capacitance is Q divided by V."}, {t:"The total charge stored on both plates per second", mis:"Capacitance has nothing to do with time. It is charge per unit potential difference."} ],
        exp:"C = Q/V, where Q is the charge on either plate." },
      { bloom:"C1", prompt:"A capacitance of 1 farad means that",
        opts:[ {t:"1 C of charge is stored on each plate for a potential difference of 1 V", ok:true}, {t:"1 J of energy is stored for a potential difference of 1 V", mis:"The farad is defined from charge and voltage: 1 F = 1 C V<sup>&minus;1</sup>."}, {t:"1 A of current flows for 1 s", mis:"That is the definition of 1 coulomb, not 1 farad."} ],
        exp:"1 F = 1 C V<sup>&minus;1</sup>." },
      { bloom:"C2", prompt:"For capacitors connected in series, which quantity is the same for every capacitor?",
        opts:[ {t:"The charge", ok:true}, {t:"The potential difference", mis:"Equal voltage is the rule for <i>parallel</i>. In series the voltages share the supply."}, {t:"The capacitance", mis:"Capacitors in series can have different capacitances. What they share is charge."} ],
        exp:"In series, the charge pushed onto one plate induces the same charge on every plate along the chain." },
      { bloom:"C2", prompt:"Why does a charged capacitor store energy?",
        opts:[ {t:"Work is done to move charge onto the plates against the increasing potential difference, and this is stored as electric potential energy", ok:true}, {t:"It stores the current that flowed while it was charging", mis:"Current cannot be stored. The capacitor stores charge, and energy in its electric field."}, {t:"The dielectric heats up and holds the energy as heat", mis:"The energy is stored in the electric field between the plates, not as heat."} ],
        exp:"Each extra bit of charge must be pushed against the existing voltage. That work, U = &frac12;QV, is stored in the electric field." } ] },

  { sub:"2.2", title:"Charging, discharging and time constant",
    html:`<h4>Charging through a resistor</h4>
    <ul><li>When the switch closes, a current I<sub>0</sub> flows immediately. It is at its largest at the start.</li>
    <li>As charge builds up, the potential difference across the capacitor grows and opposes the battery, so the <b>current decreases</b>.</li>
    <li>When the capacitor's voltage equals the battery voltage V<sub>0</sub>, the current stops and the charge has reached its maximum Q<sub>0</sub>.</li></ul>
    <h4>Discharging through a resistor</h4>
    <ul><li>At the start, the voltage across the capacitor is at its maximum, so the current I<sub>0</sub> = V<sub>0</sub>/R is at its maximum.</li>
    <li>As charge flows off the plates, the voltage falls, and so does the current, until both reach zero.</li></ul>
    <h4>Time constant</h4>
    <div class="formula" data-tex="\\tau=RC||\\text{charging: } Q=Q_0\\left(1-e^{-t/RC}\\right)||\\text{discharging: } Q=Q_0e^{-t/RC}">&tau; = RC &nbsp;&nbsp; charging: Q = Q<sub>0</sub>(1 &minus; e<sup>&minus;t/RC</sup>) &nbsp;&nbsp; discharging: Q = Q<sub>0</sub>e<sup>&minus;t/RC</sup></div>
    <ul><li>&tau; is a scalar with SI unit the <b>second</b>. It measures how quickly the capacitor charges or discharges.</li>
    <li><b>Charging:</b> &tau; is the time for the charge to reach 63% of its maximum value.</li>
    <li><b>Discharging:</b> &tau; is the time for the charge to fall to 37% of its initial value.</li>
    <li>A bigger R or a bigger C gives a bigger &tau;, so the process is slower.</li></ul>`,
    qs:[
      { bloom:"C1", prompt:"What is the SI unit of the time constant &tau;?",
        opts:[ {t:"Second", ok:true}, {t:"Farad", mis:"The farad is the unit of capacitance. &tau; = RC has the unit of time."}, {t:"Coulomb", mis:"The coulomb is the unit of charge. &tau; is a time."} ],
        exp:"&tau; = RC: &Omega; &times; F = (V A<sup>&minus;1</sup>)(C V<sup>&minus;1</sup>) = C A<sup>&minus;1</sup> = s." },
      { bloom:"C2", prompt:"Why does the current decrease while a capacitor is charging?",
        opts:[ {t:"The potential difference across the capacitor increases and opposes the battery", ok:true}, {t:"The battery gradually runs out of charge", mis:"An ideal battery keeps its emf. The current falls because the capacitor's own voltage builds up against it."}, {t:"The resistor heats up and its resistance increases", mis:"R is treated as constant. The current falls because there is less net voltage across R."} ],
        exp:"The current is (V<sub>0</sub> &minus; V<sub>C</sub>)/R. As V<sub>C</sub> grows towards V<sub>0</sub>, the current falls towards zero." },
      { bloom:"C2", prompt:"State the physical meaning of the time constant for a <b>charging</b> capacitor.",
        opts:[ {t:"The time for the charge to reach 63% of its maximum value", ok:true}, {t:"The time for the charge to reach 37% of its maximum value", mis:"37% is the discharging definition (falling to 37% of the initial charge)."}, {t:"The time for the capacitor to become fully charged", mis:"In theory an exponential never quite reaches the maximum. At t = &tau; it has 63%."} ],
        exp:"At t = &tau;, Q = Q<sub>0</sub>(1 &minus; e<sup>&minus;1</sup>) = 0.63Q<sub>0</sub>." },
      { bloom:"C2", prompt:"The resistor in an RC circuit is replaced with one of larger resistance. What happens?",
        opts:[ {t:"The capacitor charges more slowly, because &tau; increases", ok:true}, {t:"The capacitor charges faster, because more voltage is across the resistor", mis:"A larger R means a smaller current, so charge builds up more slowly."}, {t:"The maximum charge stored increases", mis:"The maximum charge is Q<sub>0</sub> = CV<sub>0</sub>, which does not depend on R."} ],
        exp:"&tau; = RC, so a larger R gives a larger &tau; and slower charging. Q<sub>0</sub> is unchanged." } ] },

  { sub:"2.3", title:"Capacitors with dielectrics",
    html:`<p>The capacitance of a parallel-plate capacitor is <b>proportional to the plate area</b>, <b>inversely proportional to the plate separation</b>, and depends on the dielectric between the plates.</p>
    <div class="formula" data-tex="\\text{air: } C_0=\\dfrac{\\varepsilon_0A}{d}||\\text{with dielectric: } C=\\dfrac{\\varepsilon_r\\varepsilon_0A}{d}=\\varepsilon_rC_0">air: C<sub>0</sub> = &epsilon;<sub>0</sub>A / d &nbsp;&nbsp; with dielectric: C = &epsilon;<sub>r</sub>&epsilon;<sub>0</sub>A / d = &epsilon;<sub>r</sub>C<sub>0</sub></div>
    <p>A <b>dielectric</b> is a non-conducting (insulating) material placed between the plates. The <b>dielectric constant</b> &epsilon;<sub>r</sub> is the ratio of the permittivity of the material to the permittivity of free space. It has no unit and is always greater than 1.</p>
    <div class="formula" data-tex="\\varepsilon_r=\\dfrac{\\varepsilon}{\\varepsilon_0}=\\dfrac{C}{C_0}=\\dfrac{V_0}{V}=\\dfrac{E_0}{E}">&epsilon;<sub>r</sub> = &epsilon;/&epsilon;<sub>0</sub> = C/C<sub>0</sub> = V<sub>0</sub>/V = E<sub>0</sub>/E</div>
    <h4>Advantages of a dielectric</h4>
    <ul><li>Increases the capacitance.</li><li>Increases the maximum operating voltage.</li><li>Gives mechanical support, so the plates can be closer without touching.</li></ul>
    <h4>How it works</h4>
    <ul><li>The dipoles in the dielectric line up and create a reverse field, so the field between the plates decreases: E = E<sub>0</sub> &minus; E<sub>d</sub>.</li>
    <li><b>Battery disconnected:</b> Q stays constant, so V decreases and C increases.</li>
    <li><b>Battery still connected:</b> V stays constant, so extra charge flows on and Q increases.</li></ul>`,
    qs:[
      { bloom:"C1", prompt:"Define dielectric constant.",
        opts:[ {t:"The ratio of the permittivity of the dielectric material to the permittivity of free space", ok:true}, {t:"The ratio of the permittivity of free space to the permittivity of the material", mis:"That is upside down. &epsilon;<sub>r</sub> = &epsilon;/&epsilon;<sub>0</sub>, which is always greater than 1."}, {t:"The charge stored per unit thickness of the dielectric", mis:"The dielectric constant is a ratio of permittivities. It has no unit."} ],
        exp:"&epsilon;<sub>r</sub> = &epsilon;/&epsilon;<sub>0</sub>. It is dimensionless and greater than 1." },
      { bloom:"C1", prompt:"Which of these is <b>not</b> an advantage of inserting a dielectric?",
        opts:[ {t:"It allows current to flow through the capacitor", ok:true}, {t:"It increases the capacitance", mis:"This is an advantage: C = &epsilon;<sub>r</sub>C<sub>0</sub>."}, {t:"It increases the maximum operating voltage", mis:"This is an advantage: the dielectric can withstand a larger voltage before it breaks down."} ],
        exp:"A dielectric is an insulator, so it does not let current through. Its advantages are larger C, a larger maximum operating voltage and mechanical support." },
      { bloom:"C2", prompt:"The plate separation of an air-filled parallel-plate capacitor is doubled. What happens to its capacitance?",
        opts:[ {t:"It is halved", ok:true}, {t:"It is doubled", mis:"C = &epsilon;<sub>0</sub>A/d, so C is inversely proportional to d."}, {t:"It is unchanged", mis:"Capacitance depends on the geometry: area, separation and dielectric."} ],
        exp:"C &prop; 1/d, so doubling d halves C." },
      { bloom:"C2", prompt:"A dielectric is inserted while the capacitor <b>remains connected</b> to the battery. Which statement is correct?",
        opts:[ {t:"V stays the same and Q increases", ok:true}, {t:"Q stays the same and V decreases", mis:"That happens when the battery is <i>disconnected</i>. When connected, the battery holds V fixed."}, {t:"Both Q and V stay the same", mis:"C increases, and with V fixed by the battery, Q = CV must increase."} ],
        exp:"The battery fixes V. C increases by &epsilon;<sub>r</sub>, so Q = CV increases and extra charge flows onto the plates." } ] }
]
};

/* ---------- helpers for writing theory questions ----------
   Q(bloom, prompt, correct, wrongs, explanation)
   wrongs: list of "text" or ["text", "why it's wrong"] */
function Q(bloom, prompt, correct, wrongs, exp){
  return { bloom, prompt, exp,
    opts: [{t:correct, ok:true}].concat(wrongs.map(w => Array.isArray(w) ? {t:w[0], mis:w[1]} : {t:w})) };
}

/* ---------- Chapter 3: Electric Current and Direct-Current Circuits ---------- */
THEORY[3] = [
  { sub:"3.1", title:"Electric current",
    html:`<p><b>Microscopic model:</b> a metal contains free electrons that act as charge carriers. With no electric field, they move randomly in all directions, so there is no net flow. When a potential difference is applied, the field E pushes them (F = eE) so they drift slowly along the conductor, <b>opposite</b> to E, with a small average speed called the <b>drift velocity</b>, v<sub>d</sub>.</p>
    <p><b>Electric current</b> is defined as the <b>rate of flow of charge</b>. It is a scalar with SI unit the ampere (A).</p>
    <div class="formula" data-tex="I=\\dfrac{dQ}{dt}||Q=ne">I = dQ/dt &nbsp;&nbsp; Q = ne</div>
    <ul><li><b>1 ampere</b> is a flow of 1 coulomb of charge past a point in 1 second.</li>
    <li>Current flows only while there is a potential difference.</li>
    <li>Conventional current flows from + to −. Electrons flow the opposite way, from − to +.</li>
    <li>Current is measured with an ammeter connected in series.</li></ul>`,
    sym:[["I","Electric current","A"],["Q","Charge","C"],["t","Time","s"],["n","Number of electrons","no unit"],["e","Charge of one electron, 1.60 × 10<sup>−19</sup>","C"],["v<sub>d</sub>","Drift velocity of free electrons","m s<sup>−1</sup>"]],
    qs:[
      Q("C1","Electric current is defined as","the rate of flow of electric charge",
        [["the total amount of charge in a conductor","Current is about how fast charge flows, not how much there is."],["the flow of electrons from the positive to the negative terminal","Electrons flow from − to +, and the definition is about rate of charge flow."],["the product of charge and time","I = Q/t, not Q × t."]],
        "I = dQ/dt: current is the rate at which charge passes a point."),
      Q("C2","In a metal wire with no potential difference across it, the free electrons","move randomly, so there is no net flow of charge",
        [["are all at rest","Free electrons are always moving. Without a field, their motion is random."],["drift steadily towards one end","A steady drift needs an electric field."],["form a current that slowly dies away","With no field, the random motion gives no net current at all."]],
        "Random thermal motion averages to zero net flow. A field adds the small drift velocity."),
      Q("C2","How does the direction of conventional current compare with the direction of electron flow in a wire?","They are opposite",
        [["They are the same","Electrons are negative, so they move opposite to conventional current."],["They are at right angles","Both are along the wire, in opposite directions."],["It depends on the material of the wire","In metals the charge carriers are always electrons, so it is always opposite."]],
        "Conventional current is defined as the direction positive charge would flow, from + to −. Electrons go from − to +."),
      Q("C1","One ampere is equivalent to","one coulomb per second",
        [["one joule per coulomb","That is the volt."],["one coulomb per volt","That is the farad."],["one volt per ohm squared","I = V/R gives V Ω<sup>−1</sup>, not V Ω<sup>−2</sup>."]],
        "1 A = 1 C s<sup>−1</sup>.") ] },

  { sub:"3.2", title:"Ohm's law and resistivity",
    html:`<p><b>Ohm's law:</b> the potential difference across a conductor is <b>directly proportional</b> to the current flowing through it, <b>provided its temperature and other physical conditions stay constant</b>.</p>
    <div class="formula" data-tex="V=IR||R=\\dfrac{\\rho l}{A}||\\rho=\\dfrac{RA}{l}">V = IR &nbsp;&nbsp; R = ρl / A &nbsp;&nbsp; ρ = RA / l</div>
    <ul><li><b>Resistance</b> is the ratio of the potential difference across a component to the current through it. Unit: ohm (Ω).</li>
    <li>Conductors that obey Ohm's law are called <b>ohmic</b>. Their V–I graph is a straight line through the origin.</li>
    <li>R is directly proportional to length l and inversely proportional to cross-sectional area A.</li>
    <li><b>Resistivity</b> is the resistance of a sample of unit length and unit cross-sectional area. It measures how strongly a material opposes current. Unit: Ω m. It depends only on the <b>material</b> and its <b>temperature</b>, not on the shape of the wire.</li></ul>`,
    sym:[["V","Potential difference across the conductor","V"],["R","Resistance","Ω"],["ρ","Resistivity of the material","Ω m"],["l","Length of the conductor","m"],["A","Cross-sectional area of the conductor","m<sup>2</sup>"]],
    qs:[
      Q("C1","Which statement of Ohm's law is CORRECT?","The potential difference across a metal conductor is directly proportional to the current through it, if its temperature stays constant",
        [["The potential difference across a metal conductor is directly proportional to the current through it","The condition of constant temperature (physical conditions) is essential."],["The potential difference across a metal conductor is inversely proportional to the current through it, if its temperature stays constant","V ∝ I, not 1/I."],["The resistance of a metal conductor is proportional to the current through it","For an ohmic conductor R is constant."]],
        "Ohm's law: V ∝ I at constant temperature and physical conditions."),
      Q("C1","What is the SI unit of resistivity?","Ω m",[["Ω m<sup>−1</sup>","From ρ = RA/l: Ω × m<sup>2</sup> / m = Ω m."],["Ω<sup>−1</sup> m<sup>−1</sup>","That is the unit of conductivity, the inverse of resistivity."],["Ω<sup>−1</sup> m","Work it out from ρ = RA/l."]],"ρ = RA/l, so the unit is Ω m<sup>2</sup>/m = Ω m."),
      Q("C2","Wires X and Y are made of the same metal with the same cross-sectional area. Y is twice as long as X. How does the resistance of Y compare with X?","Twice the resistance of X",
        [["Half the resistance of X","R ∝ l, so a longer wire has more resistance."],["The same resistance, since the material is the same","Same material means the same resistivity, but R also depends on length."],["Four times the resistance of X","R is proportional to l, not l<sup>2</sup>."]],
        "R = ρl/A: doubling l doubles R."),
      Q("C2","What does the V–I graph of an ohmic conductor at constant temperature look like?","A straight line passing through the origin",
        [["A curve that bends towards the V-axis","That is the shape for a filament lamp, whose temperature rises."],["A horizontal straight line","That would mean V stays fixed while I changes."],["A straight line that does not pass through the origin","V = IR gives V = 0 when I = 0."]],
        "V ∝ I gives a straight line through the origin, and its gradient is R."),
      Q("C2","The resistivity of a metal depends on","the type of material and its temperature",
        [["the length and cross-sectional area of the wire","Those change the resistance R, not the resistivity ρ."],["the current flowing through it","At constant temperature, ρ is a property of the material only."],["the potential difference across it","ρ is a property of the material at a given temperature."]],
        "ρ is a material property that changes with temperature. Shape affects R, not ρ.") ] },

  { sub:"3.3", title:"Variation of resistance with temperature",
    html:`<p>The resistance of a <b>metal increases with temperature</b>. As the temperature rises, the metal ions vibrate with larger amplitude, so the free electrons collide with them more often. This hinders the drift of the electrons, so the resistance increases.</p>
    <div class="formula" data-tex="R=R_0\\left[1+\\alpha\\left(T-T_0\\right)\\right]||\\rho=\\rho_0\\left[1+\\alpha\\left(T-T_0\\right)\\right]">R = R<sub>0</sub>[1 + α(T − T<sub>0</sub>)] &nbsp;&nbsp; ρ = ρ<sub>0</sub>[1 + α(T − T<sub>0</sub>)]</div>
    <ul><li>α is the <b>temperature coefficient of resistivity</b>: the fractional increase in resistivity per degree rise in temperature. It is usually quoted at 20 °C.</li>
    <li>Unit of α: °C<sup>−1</sup> (equivalent to K<sup>−1</sup>).</li></ul>`,
    sym:[["R<sub>0</sub>","Resistance at the reference temperature T<sub>0</sub>","Ω"],["R","Resistance at temperature T","Ω"],["T, T<sub>0</sub>","Final and reference (initial) temperature","°C"],["α","Temperature coefficient of resistivity","°C<sup>−1</sup>"],["ρ<sub>0</sub>","Resistivity at the reference temperature","Ω m"]],
    qs:[
      Q("C2","Why does the resistance of a metal increase when its temperature rises?","The metal ions vibrate more, so free electrons collide with them more often",
        [["The metal ions vibrate less, so they block the electrons","Heating makes the ions vibrate <i>more</i>, not less."],["More current flows, so resistance increases","R increases because of collisions, not because of the current."],["The kinetic energy of the ions decreases","Heating increases the ions' vibrational energy."]],
        "Larger-amplitude vibrations mean more frequent electron–ion collisions, which hinder the drift."),
      Q("C1","What is the SI unit of the temperature coefficient of resistivity, α?","°C<sup>−1</sup>",[["Ω °C<sup>−1</sup>","α is a fractional change per degree, so it has no ohms."],["Ω m","That is the unit of resistivity."],["°C","It is <i>per</i> degree, so °C<sup>−1</sup>."]],"α = Δρ/(ρ<sub>0</sub>ΔT): a fraction per degree, unit °C<sup>−1</sup>."),
      Q("C2","A metal wire is heated from 20 °C to 80 °C. Its resistance will","increase",[["decrease","For metals α is positive, so R rises with temperature."],["stay exactly the same","Metal resistance depends on temperature."],["drop to zero","Only superconductors at very low temperatures have zero resistance."]],"For metals, R = R<sub>0</sub>[1 + α(T − T<sub>0</sub>)] with α > 0, so R increases.") ] },

  { sub:"3.4", title:"Emf, internal resistance and terminal potential difference",
    html:`<p><b>Electromotive force (emf), ε</b>: the energy supplied by the source to each unit charge that flows through the whole circuit (external and internal resistances).</p>
    <p><b>Terminal potential difference, V</b>: the work done in moving a unit charge through the external resistance only.</p>
    <p><b>Internal resistance, r</b>: the resistance of the chemicals inside the battery, between its terminals.</p>
    <div class="formula" data-tex="V=\\varepsilon-Ir||\\varepsilon=V+Ir||I=\\dfrac{\\varepsilon}{R+r}">V = ε − Ir &nbsp;&nbsp; ε = V + Ir &nbsp;&nbsp; I = ε / (R + r)</div>
    <ul><li>When current flows, part of the emf is used to drive current through r (a "lost volt" Ir), so V &lt; ε.</li>
    <li>V = ε only when <b>no current</b> flows (an open circuit).</li>
    <li>The smaller r is, the more current and power the source can deliver.</li>
    <li><b>Factors affecting r:</b> the concentration of ions in the electrolyte, the temperature, the distance between the electrodes, and the age of the cell (r increases as the electrolyte dries out).</li></ul>`,
    sym:[["ε","Electromotive force (emf) of the source","V"],["V","Terminal potential difference","V"],["r","Internal resistance of the battery","Ω"],["R","External (load) resistance","Ω"]],
    qs:[
      Q("C1","The emf of a battery is","the energy supplied by the battery to each unit charge that flows through the whole circuit",
        [["the force that pushes electrons around the circuit","Despite its name, emf is energy per unit charge, not a force."],["the work done per unit charge through the external resistor only","That is the terminal potential difference."],["the resistance of the chemicals in the battery","That is the internal resistance."]],
        "ε is energy per unit charge for the complete circuit, including the internal resistance."),
      Q("C2","Why is the terminal potential difference less than the emf when current flows?","Some energy per unit charge is used to drive current through the internal resistance",
        [["The external resistor uses up some of the charge","Charge is conserved. Energy is what gets transferred."],["The emf decreases whenever current flows","ε is fixed. The terminal voltage drops by Ir."],["The battery stores some of the current","Current cannot be stored."]],
        "V = ε − Ir: the 'lost volts' Ir are dropped across the internal resistance."),
      Q("C1","Which factors affect the internal resistance of a battery?","The concentration of ions in the electrolyte, the temperature and the distance between the electrodes",
        [["Only the external resistance connected to it","r is inside the battery and does not depend on the load."],["Only the emf of the battery","r depends on the chemistry and construction of the cell."],["The length of the connecting wires","Wire resistance is external, not internal."]],
        "r depends on the electrolyte, the temperature, the electrode separation and the age of the cell."),
      Q("C2","The terminal potential difference of a battery equals its emf when","no current is flowing",[["the external resistance is zero","Then I is largest and the lost volts Ir are largest."],["the current is at its maximum","More current means a larger Ir drop."],["the internal resistance is large","A large r makes the drop larger, not smaller."]],"With I = 0, Ir = 0, so V = ε.") ] },

    <tr><td>R<sub>eff</sub> is larger than the largest resistor</td><td>R<sub>eff</sub> is smaller than the smallest resistor</td></tr></table>`,

  { sub:"3.6", title:"Kirchhoff's rules",
    html:`<p><b>First rule (junction rule):</b> the sum of the currents entering any junction equals the sum of the currents leaving it. This follows from <b>conservation of charge</b>.</p>
    <p><b>Second rule (loop rule):</b> in any closed loop, the sum of the emfs equals the sum of the IR products. This follows from <b>conservation of energy</b>.</p>
    <div class="formula" data-tex="\\Sigma I_{\\text{in}}=\\Sigma I_{\\text{out}}||\\Sigma\\varepsilon=\\Sigma IR">ΣI<sub>in</sub> = ΣI<sub>out</sub> &nbsp;&nbsp; Σε = ΣIR</div>
    <ul><li>Choose a direction for each current and for travelling around each loop.</li>
    <li>If a current comes out <b>negative</b>, its actual direction is opposite to the one you assumed.</li></ul>`,
    sym:[["ΣI<sub>in</sub>, ΣI<sub>out</sub>","Total current entering and leaving a junction","A"],["Σε","Sum of emfs around a loop","V"],["ΣIR","Sum of potential drops across resistors in a loop","V"]],
    qs:[
      Q("C1","Kirchhoff's first (junction) rule is based on the conservation of","charge",[["energy","Energy conservation is the basis of the loop rule."],["momentum","Momentum is not involved in circuit rules."],["mass","Mass is not involved in circuit rules."]],"Charge cannot pile up at a junction, so what flows in must flow out."),
      Q("C1","Kirchhoff's second (loop) rule is based on the conservation of","energy",[["charge","Charge conservation is the basis of the junction rule."],["current","Current is not a conserved quantity around a loop."],["power","The rule is a statement about energy per unit charge."]],"Around a closed loop, energy gained from emfs equals energy dropped across resistances."),
      Q("C2","After solving Kirchhoff's equations, one current comes out as −0.5 A. This means","the current is 0.5 A, flowing opposite to the direction you assumed",
        [["the working has an error, because current cannot be negative","A negative answer is fine. It only means the assumed direction was wrong."],["no current flows in that branch","The size is 0.5 A, which is not zero."],["the current is 0.5 A, in the direction you assumed","The sign shows it flows the other way."]],
        "The sign shows direction relative to your assumption. The magnitude is still 0.5 A.") ] },

  { sub:"3.7", title:"Electrical energy and power",
    html:`<p><b>Electrical energy</b> is the energy transferred by charge passing through a device. <b>Power</b> is the rate of energy transfer.</p>
    <div class="formula" data-tex="W=IVt||P=\\dfrac{W}{t}=IV=I^2R=\\dfrac{V^2}{R}">W = IVt &nbsp;&nbsp; P = W/t = IV = I<sup>2</sup>R = V<sup>2</sup>/R</div>
    <ul><li>For a resistor, I<sup>2</sup>R and V<sup>2</sup>/R give the rate at which heat is produced (power loss).</li>
    <li>Units: energy in joules (J), power in watts (W = J s<sup>−1</sup>).</li></ul>`,

      Q("C2","For a resistor, the expressions I<sup>2</sup>R and V<sup>2</sup>/R both give","the rate at which electrical energy is converted to heat",

        "They are forms of P = IV, the power dissipated as heat in the resistor.") ] },

  { sub:"3.8", title:"Potential divider",
    html:`<p>A potential divider uses resistors <b>in series</b> to provide a fraction of the supply voltage. The same current passes through each resistor, so the supply voltage is shared <b>in proportion to the resistances</b>.</p>
    <div class="formula" data-tex="V_1=\\left(\\dfrac{R_1}{R_1+R_2+\\cdots+R_n}\\right)V">V<sub>1</sub> = [R<sub>1</sub> / (R<sub>1</sub> + R<sub>2</sub> + ... + R<sub>n</sub>)] V</div>
    <ul><li>The larger resistor takes the larger share of the voltage.</li>
    <li>Connecting a meter or load across one resistor puts it in parallel, which lowers that part's resistance and so reduces the output voltage.</li></ul>`,
    sym:[["V","Supply (input) voltage","V"],["V<sub>1</sub>","Output voltage across R<sub>1</sub>","V"],["R<sub>1</sub>, R<sub>2</sub>","Resistances in series","Ω"]],
    qs:[
      Q("C2","Which statement describes the principle of a potential divider?","Resistors in series share the supply voltage in the ratio of their resistances, so the output is a fraction of the input",

      Q("C2","In a potential divider, R<sub>1</sub> = 2 kΩ and R<sub>2</sub> = 8 kΩ are across 10 V. Which resistor has the larger voltage across it?","R<sub>2</sub>, because it has the larger resistance",

        "V<sub>2</sub> = (8/10) × 10 = 8 V and V<sub>1</sub> = 2 V.") ] },

  { sub:"3.9", title:"Potentiometer",
    html:`<p>A potentiometer is used to <b>measure an unknown emf</b>, <b>compare the emfs</b> of two cells, and <b>measure the internal resistance</b> of a cell.</p>
    <ul><li>A steady current flows through a uniform resistance wire AB, so the potential drop along it is <b>proportional to length</b>: V = kl.</li>
    <li>The jockey is moved along the wire until the galvanometer reads <b>zero</b>. This is the balance point, and the length is the <b>balance length</b>.</li>
    <li>At balance <b>no current is drawn</b> from the cell being tested, so its full emf is measured, with no Ir drop.</li></ul>
    <div class="formula" data-tex="V\\propto l||\\dfrac{\\varepsilon_1}{\\varepsilon_2}=\\dfrac{l_1}{l_2}">V ∝ l &nbsp;&nbsp; ε<sub>1</sub>/ε<sub>2</sub> = l<sub>1</sub>/l<sub>2</sub></div>`,
    sym:[["l","Balance length on the potentiometer wire","m"],["k","Potential drop per unit length of the wire","V m<sup>−1</sup>"],["ε<sub>1</sub>, ε<sub>2</sub>","Emfs being compared","V"]],
    qs:[
      Q("C1","A potentiometer is used to","measure the unknown emf of a cell",[["measure power","A wattmeter, or I and V together, gives power."],["measure current","An ammeter measures current."],["measure the energy lost in a circuit","That is not what a potentiometer does."]],"It compares an unknown voltage with a known potential drop along a uniform wire."),
      Q("C2","At the balance point of a potentiometer, the galvanometer reads","zero, because no current flows through it",[["its maximum value","Balance means the opposing voltages are equal, so the current is zero."],["the emf of the cell","A galvanometer detects current. It does not show emf."],["half of the driver cell's current","At balance it reads zero."]],"At balance the p.d. along AC exactly opposes the cell's emf, so no current flows in the galvanometer."),
      Q("C2","Why does a potentiometer measure emf more accurately than an ordinary voltmeter?","No current is drawn from the cell at balance, so there is no voltage drop across its internal resistance",

        "With I = 0, V = ε − Ir = ε exactly.") ] }
];
