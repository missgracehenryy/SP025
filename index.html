}
function signedIn(){ const st = state.student; return !!(HAS_BACKEND && st && st.matric && getTok(st.matric)); }
function authFailed(){ const st = state.student; if(st) setTok(st.matric, ""); }
let flushTimer = null, flushing = false;
function queuePut(key, value){
  if(!signedIn()) return;
  const q = lsGet(mkey("queue"), {}); q[key] = JSON.stringify(value); lsSet(mkey("queue"), q);
  clearTimeout(flushTimer); flushTimer = setTimeout(flushQueue, 1200);
}
async function flushQueue(){
  if(flushing || !signedIn()) return; flushing = true;
  try{
    const st = state.student, qk = mkey("queue");
    for(const key of Object.keys(lsGet(qk, {}))){
      const data = lsGet(qk, {})[key]; if(data == null) continue;
      const r = await api({action:"put", matric:st.matric, token:getTok(st.matric), key, data});
      if(r.ok){ const q = lsGet(qk, {}); if(q[key] === data){ delete q[key]; lsSet(qk, q); } }
      else { if(r.auth === false) authFailed(); clearTimeout(flushTimer); flushTimer = setTimeout(flushQueue, 15000); return; }
    }
  } finally { flushing = false; }
  if(Object.keys(lsGet(mkey("queue"), {})).length){ clearTimeout(flushTimer); flushTimer = setTimeout(flushQueue, 1200); }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flushQueue(); });
async function pull(){
  if(!signedIn()) return false;
  const st = state.student;
  const r = await api({action:"load", matric:st.matric, token:getTok(st.matric)});
  if(!r.ok){ if(r.auth === false) authFailed(); return false; }
  let changed = false;
  const P = rawProg(), H = getHist(), have = new Set(H.map(h => h.at)), onServer = {};
  (r.items || []).forEach(it => { let v; try{ v = JSON.parse(it.data); }catch(e){ return; } onServer[it.key] = v;
    const m = /^prog:(theory|diag):(\d+)$/.exec(it.key);
    if(m){ const cur = P[m[1]][m[2]]; if(!cur || (v.savedAt||0) > (cur.savedAt||0)){ P[m[1]][m[2]] = v; changed = true; } }
    else if(/^hist:/.test(it.key) && !have.has(v.at)){ H.push(v); have.add(v.at); changed = true; } });
  lsSet(mkey("prog"), P); if(changed) storeHist(H);
  ["theory","diag"].forEach(k => Object.keys(P[k]).forEach(c => { const sv = onServer["prog:"+k+":"+c];
    if(!sv || (P[k][c].savedAt||0) > (sv.savedAt||0)) queuePut("prog:"+k+":"+c, P[k][c]); }));
  getHist().forEach(h => { if(!onServer["hist:"+h.at]) queuePut("hist:"+h.at, h); });
  flushQueue();
  return changed;
}
function withTimeout(p, ms){ return Promise.race([p, new Promise(r => setTimeout(() => r("timeout"), ms))]); }
function permOf(shuffled, orig){ return shuffled.map(o => orig.indexOf(o)); }
/* theory snapshot */
function theorySnap(){
  const T = state.theory, ch = state.chapter;
  return { ch: ch.id, idx: T.idx, startedAt: T.startedAt, ans: T.ans,
    secs: T.secs.map((s,si) => {
      const base = (THEORY[ch.id]||[]).find(x => x.sub === s.sub);
      if(s.review) return { sub:s.sub, symqs:s.qs };
      if(!base) return { sub:s.sub, full:s };
      return { sub:s.sub, perms: s.qs.map((q,qi) => permOf(q.opts, base.qs[qi].opts)) };
    }) };
}
function theoryFromSnap(snap){
  try{
    const secs = snap.secs.map(s => {
      if(s.full) return s.full;
      if(s.symqs){ const sym = symbolsSection(snap.ch)[0]; return Object.assign({}, sym, {qs: s.symqs}); }
      const base = THEORY[snap.ch].find(x => x.sub === s.sub);
      return Object.assign({}, base, { qs: s.perms.map((perm,qi) => { const oq = base.qs[qi];
        if(!oq || perm.some(j => j < 0 || !oq.opts[j])) throw 0;
        return Object.assign({type:"mcq", sub:base.sub, skill:"theory"}, oq, {opts: perm.map(j => oq.opts[j])}); }) });
    });
    return { secs, idx: Math.min(snap.idx, secs.length-1), ans: snap.ans, startedAt: snap.startedAt };

}
/* diagnostic snapshot */
function diagSnap(){

    perms: state.qs.map((q,i) => q.parts.map((p,pi) => p.type==="mcq" ? permOf(p.opts, ch.diagnostic[i].parts[pi].opts) : null)) };
}
function diagFromSnap(ch, snap){

    const qs = ch.diagnostic.map((oq,i) => Object.assign({}, oq, { parts: oq.parts.map((p,pi) => {
      if(p.type !== "mcq") return p;
      const perm = snap.perms[i][pi]; if(perm.length !== p.opts.length || perm.some(j => j < 0)) throw 0;
      return Object.assign({}, p, {opts: perm.map(j => p.opts[j])}); }) }));
    if(snap.answers.length !== qs.length) throw 0;

}

/* ---------- Symbols and units ---------- */
const SYMQ_N = 10;
const UNIT_POOL = ["N","J","W","C","V","Ω","T","Hz","m","s","kg","A","F","H","Wb","m s<sup>−1</sup>","no unit"];
function symTable(sym, title){
  if(!sym || !sym.length) return "";
  return `<div class="symbox"><div class="symh">${title}</div><table class="sym"><tr><th>Symbol</th><th>Meaning</th><th>SI unit</th></tr>${sym.map(r => `<tr><td class="s">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>`;
}
function noUnit(u){ return String(u).charAt(0) === "—"; }
function baseSym(x){ return String(x).split(" (")[0].trim(); }
function baseUnit(u){ return String(u).split(" (")[0].trim(); }
function chapterSyms(id){
  const seen = {}, out = [];
  (THEORY[id]||[]).forEach(s => (s.sym||[]).forEach(r => { const k = r[0]+"|"+r[1]; if(!seen[k]){ seen[k]=1; out.push(r); } }));
  return out;
}
function symbolsSection(id){
  const all = chapterSyms(id); if(all.length < 4) return [];
  const pick = shuffle(all.slice()), qs = [];
  for(const r of pick){
    if(qs.length >= SYMQ_N) break;
    const askUnit = qs.length % 2 === 1 && !noUnit(r[2]);
    const sb = baseSym(r[0]);
    if(askUnit){
      const cu = baseUnit(r[2]);
      let w = shuffle(all.map(x => x[2]).filter(u => !noUnit(u) && baseUnit(u) !== cu));
      w = w.concat(shuffle(UNIT_POOL.filter(u => baseUnit(u) !== cu)));
      const ds = []; w.forEach(u => { if(ds.length<3 && !ds.some(d => baseUnit(d)===baseUnit(u))) ds.push(u); });
      qs.push(Q("C1", `What is the SI unit of <b>${sb}</b> (${r[1].charAt(0).toLowerCase()+r[1].slice(1)})?`, r[2], ds, `${sb} is the ${r[1].charAt(0).toLowerCase()+r[1].slice(1)}, measured in ${r[2]}.`));
    } else {
      const ds = []; shuffle(all.filter(x => baseSym(x[0]) !== sb && x[1] !== r[1])).forEach(x => { if(ds.length<3 && !ds.includes(x[1])) ds.push(x[1]); });
      if(ds.length < 3) continue;
      qs.push(Q("C1", `In this chapter, what does the symbol <b>${sb}</b> represent?`, r[1], ds, noUnit(r[2]) ? `${sb}: ${r[1]}.` : `${sb}: ${r[1]} (SI unit: ${r[2]}).`));
    }
  }
  return [{ sub:"Sym", title:"Symbols and units check", review:true,
    html:`<p>Before you finish, check that you know what every symbol in this chapter means and what it is measured in. PSPM questions expect the correct SI unit in every final answer.</p>`,
    sym: all, qs }];
}

/* ---------- Diagnostic ---------- */
function startDiagnostic(ch){
  state.chapter = ch; state.result = null; state.saveMsg = null; state.practice = null;
  const saved = getProg().diag[ch.id], qs = saved && diagFromSnap(ch, saved);
  if(qs){ state.qs = qs; state.answers = saved.answers; state.i = Math.min(saved.i, qs.length-1); state.startedAt = saved.startedAt; renderQ(); return; }
  state.qs = ch.diagnostic.map(prepQ);
  state.i = 0; state.answers = state.qs.map(q => ({resp: q.parts.map(()=>null), sure:null}));
  state.startedAt = Date.now();
  renderQ();
}
function renderQ(){
  toTop();
  const ch = state.chapter, n = state.qs.length, q = state.qs[state.i], a = state.answers[state.i];
  app.innerHTML = `
  <div class="qhead"><span>Chapter ${ch.id}: ${esc(ch.title)}</span><span>Question ${state.i+1} of ${n}</span></div>
  ${catBar(state.i/n)}

    ${q.parts.map((p,pi) => partHTML(p, pi, a.resp[pi], {})).join("")}
    <div class="conf"><span>How sure are you about this question?</span>
      <button class="pill ${a.sure===true?"sel":""}" data-s="1">I'm sure</button>
      <button class="pill ${a.sure===false?"sel":""}" data-s="0">I'm guessing</button>
    </div>
    <div class="nav">
      <button class="btn ghost" id="back" ${state.i===0?"disabled":""}>Back</button>
      <button class="btn" id="next">${state.i===n-1?"Finish and see my diagnosis":"Next"}</button>
    </div>
    <p class="err" id="qerr"></p>
  </section>`;
  const ready = () => q.parts.every((p,pi) => answered(p, a.resp[pi])) && a.sure!=null;
  const upd = () => { $("#next").disabled = !ready(); setProg("diag", ch.id, diagSnap()); };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => { a.resp[+b.dataset.p] = +b.dataset.k; renderQKeep(); });
  app.querySelectorAll(".numrow input").forEach(inp => inp.oninput = () => { a.resp[+inp.dataset.p] = inp.value; upd(); });
  app.querySelectorAll(".pill").forEach(b => b.onclick = () => { a.sure = b.dataset.s==="1"; app.querySelectorAll(".pill").forEach(x => x.classList.toggle("sel", x===b)); upd(); });
  $("#back").onclick = () => { state.i--; renderQ(); };
  $("#next").onclick = () => {
    const bad = q.parts.findIndex((p,pi) => p.type==="num" && isNaN(parseNum(a.resp[pi])));
    if(bad>=0){ $("#qerr").textContent = `Part (${String.fromCharCode(97+bad)}) is not a number. Use a format like 4.5e-4 or 4.5x10^-4.`; return; }
    if(state.i < n-1){ state.i++; renderQ(); } else finishDiagnostic();
  };
  upd();
  function renderQKeep(){ const y = window.scrollY; renderQ(); try{ window.scrollTo(0,y); }catch(e){} }
}

function analyse(){
  const ch = state.chapter, per = {}, sk = {};
  ch.subtopics.forEach(s => per[s.id] = {sub:s, correct:0, total:0, guessedRight:0, sureWrong:0});
  Object.keys(SKILLS).forEach(k => sk[k] = {key:k, name:SKILLS[k], correct:0, total:0, guessedRight:0});
  const mis = []; let score = 0, total = 0, confidentWrong = 0;
  state.qs.forEach((q,i) => { const a = state.answers[i];
    q.parts.forEach((p,pi) => {
      const g = gradePart(p, a.resp[pi]); const P = per[p.sub], S = sk[p.skill];
      P.total++; S.total++; total++;
      if(g.ok){ P.correct++; S.correct++; score++; if(!a.sure){ P.guessedRight++; S.guessedRight++; } }
      else { if(a.sure){ P.sureWrong++; confidentWrong++; } if(g.mis) mis.push({sub:p.sub, text:g.mis, sure:a.sure}); }
    }); });
  const list = ch.subtopics.map(s => per[s.id]).filter(p => p.total);
  list.forEach(p => p.status = statusOf(p.correct, p.total, p.guessedRight>0));
  const skills = Object.values(sk).filter(s => s.total);
  skills.forEach(s => s.status = statusOf(s.correct, s.total, s.guessedRight>0));
  mis.sort((x,y) => ((y.sure?1:0)-(x.sure?1:0)) || x.sub.localeCompare(y.sub));
  return { list, skills, mis, score, total, confidentWrong };
}

function finishDiagnostic(){
  const r = analyse(); state.result = r; state.saveMsg = null;
  setProg("diag", state.chapter.id, null);
  addHist({ type:"Diagnostic", ch: state.chapter.id, at: Date.now(), score: r.score, total: r.total, snap: diagSnap() });
  renderResults();
  const st = state.student, ch = state.chapter;
  send({
    type:"Diagnostic", name:st.name, matric:st.matric, group:st.group, chapter: ch.id+" "+ch.title,
    score:r.score, total:r.total,
    subtopics: r.list.map(p => ({id:p.sub.id, name:p.sub.name, correct:p.correct, total:p.total, status:p.status})),
    skills: r.skills.map(s => ({name:s.name, correct:s.correct, total:s.total, status:s.status})),
    weak: r.list.filter(p => p.status!=="Mastered").map(p => p.sub.id+" "+p.sub.name),
    confidentWrong: r.confidentWrong,
    misconceptions: r.mis.map(m => (m.sure?"[sure] ":"")+m.sub+": "+plain(m.text)),
    minutes: Math.round((Date.now()-state.startedAt)/6000)/10
  }).then(m => { state.saveMsg = m; const el = $("#savebox"); if(el) el.innerHTML = saveBanner(m); });
}

function barRow(id, name, o){
  const f = o.total ? o.correct/o.total : 0;
  return `<div class="subrow">
    <div class="subline"><div class="subname">${id?`<small>${id}</small>`:""}${esc(name)}</div><span class="chip ${o.status}">${o.status}</span></div>
    <div class="mbar"><i style="width:${f*100}%;background:${STATUS_COLOR[o.status]}"></i></div>
    <div class="hint">${o.correct} of ${o.total} correct.
      ${o.sureWrong ? ` <b style="color:var(--bad)">You were sure about ${o.sureWrong} wrong answer${o.sureWrong>1?"s":""}</b>, which points to a misconception rather than a slip.` : ""}
      ${o.guessedRight ? ` ${o.guessedRight} correct answer${o.guessedRight>1?"s were":" was"} a guess, so this is not secure yet.` : ""}</div></div>`;
}

function renderResults(){
  toTop();
  const r = state.result, ch = state.chapter, f = r.score/r.total;
  const need = r.list.filter(p => p.status!=="Mastered");
  const seen = new Set(), mis = r.mis.filter(m => !seen.has(m.text) && seen.add(m.text));
  const ringC = f>=0.999?"var(--ok)":(f>=0.6?"var(--mid)":"var(--bad)");
  app.innerHTML = `
  <section class="card">
    ${cheer(f>=0.999 ? "Purr-fect score!" : "Diagnosis ready. Let's see what to work on.")}
    <div class="score">
      <div class="ring" style="border:7px solid ${ringC};color:${ringC}">${r.score}/${r.total}</div>
      <div><h1 style="margin:0">Your diagnosis</h1><div class="muted">Chapter ${ch.id}: ${esc(ch.title)}, ${esc(state.student.name)}</div></div>
    </div>
    <div id="savebox">${saveBanner(state.saveMsg)}</div>
  </section>
  <h2 class="sec">By subtopic</h2>
  <section class="card">${r.list.map(p => barRow(p.sub.id, p.sub.name, p)).join("")}</section>
  <h2 class="sec">By skill</h2>
  <section class="card">${r.skills.map(s => barRow("", s.name, s)).join("")}</section>
  ${mis.length ? `<h2 class="sec">What your wrong answers reveal</h2>
  <section class="card"><ul class="mis">${mis.map(m => `<li>${m.sure?'<span class="flag">You were sure</span>':""}<b>${m.sub}</b> ${m.text}</li>`).join("")}</ul></section>` : ""}
  <div class="nav" style="margin-top:6px">
    <button class="btn ghost" id="home">Back to chapters</button>
    ${need.length ? `<button class="btn" id="go">Start reinforcement (${need.length} subtopic${need.length>1?"s":""})</button>` : `<button class="btn" id="again">Retake</button>`}
  </div>
  ${need.length ? "" : `<section class="card"><b>Excellent.</b> You have mastered every subtopic in this chapter with confidence.</section>`}
  <h2 class="sec">Review your answers and full working</h2>
  <section class="card">
    ${state.qs.map((q,i) => { const a = state.answers[i]; const gs = q.parts.map((p,pi)=>gradePart(p,a.resp[pi])); const allOk = gs.every(g=>g.ok);
      return `<details><summary>${allOk?"&#10003;":"&#10007;"} Question ${i+1} <span class="muted">(${[...new Set(q.parts.map(p=>p.sub))].join(", ")})</span></summary>
        <div class="rev"><div class="q">${q.stem}</div>${q.fig||""}
        ${q.parts.map((p,pi) => { const g = gs[pi]; return `<div class="part"><span class="plabel">(${String.fromCharCode(97+pi)})</span>${p.prompt}
          <div>Your answer: <b style="color:${g.ok?"var(--ok)":"var(--bad)"}">${g.shown}${p.type==="num"?" "+p.unit:""}</b> ${a.sure?"":"(guess)"}</div>
          ${g.ok?"":`<div>Correct answer: <b style="color:var(--ok)">${p.type==="num"?fmt(p.ans)+" "+p.unit:p.opts.find(o=>o.ok).t}</b></div>`}
          <div class="fb ${g.ok?"good":"bad"}">${g.ok?"":(g.mis?g.mis+" ":"")}${p.exp}</div></div>`; }).join("")}
        </div></details>`; }).join("")}
  </section>`;
  $("#home").onclick = renderHome;
  if($("#go")) $("#go").onclick = startPractice;
  if($("#again")) $("#again").onclick = () => { setProg("diag", ch.id, null); startDiagnostic(ch); };
}

/* ---------- Reinforcement ---------- */
function startPractice(){
  const r = state.result, ch = state.chapter;
  const order = r.list.filter(p => p.status==="Weak").concat(r.list.filter(p => p.status==="Developing")).map(p => p.sub.id);
  const qs = {}, ans = {};
  order.forEach(id => {
    qs[id] = ch.practice.filter(q => q.parts[0].sub===id).map(prepQ);
    ans[id] = qs[id].map(q => ({resp:q.parts.map(()=>null), done:q.parts.map(()=>false)}));
  });
  state.practice = { subs:order, idx:0, qs, ans };
  renderPractice();
}
function renderPractice(keep){
  const y = window.scrollY; if(!keep) toTop();
  const P = state.practice, ch = state.chapter, sid = P.subs[P.idx];
  const sub = ch.subtopics.find(s => s.id===sid), qs = P.qs[sid], ans = P.ans[sid], last = P.idx===P.subs.length-1;
  const allDone = ans.every(a => a.done.every(Boolean));
  app.innerHTML = `
  <div class="qhead"><span>Reinforcement ${P.idx+1} of ${P.subs.length}</span><span>Chapter ${ch.id}: ${esc(ch.title)}</span></div>
  ${catBar(P.idx/P.subs.length)}
  <section class="card note"><span class="tag">${sub.id}</span><h2>${esc(sub.name)}</h2>${sub.note}</section>
  <h2 class="sec">Now try these</h2>
  ${qs.length ? qs.map((q,qi) => `<section class="card" data-q="${qi}"><div class="qtext">${q.stem}</div>${q.fig||""}
      ${q.parts.map((p,pi) => partHTML(p, pi, ans[qi].resp[pi], {locked:ans[qi].done[pi], feedback:ans[qi].done[pi], checkBtn:true})).join("")}</section>`).join("")
     : `<section class="card muted">No practice questions for this subtopic yet.</section>`}
  <div class="nav">
    <button class="btn ghost" id="res">Back to my diagnosis</button>
    <button class="btn" id="nx" ${allDone?"":"disabled"}>${last?"Finish reinforcement":"Next subtopic"}</button>
  </div>`;
  app.querySelectorAll("section[data-q]").forEach(sec => {
    const qi = +sec.dataset.q, A = ans[qi];
    sec.querySelectorAll(".opt:not(:disabled)").forEach(b => b.onclick = () => { const pi=+b.dataset.p; A.resp[pi]=+b.dataset.k; A.done[pi]=true; renderPractice(true); });
    sec.querySelectorAll(".numrow input:not(:disabled)").forEach(inp => {
      inp.oninput = () => { A.resp[+inp.dataset.p] = inp.value; };
      inp.onkeydown = e => { if(e.key==="Enter"){ const b = sec.querySelector(`[data-check="${inp.dataset.p}"]`); if(b) b.click(); } };
    });
    sec.querySelectorAll("[data-check]").forEach(b => b.onclick = () => {
      const pi = +b.dataset.check; if(!answered(qs[qi].parts[pi], A.resp[pi]) || isNaN(parseNum(A.resp[pi]))) return;
      A.done[pi] = true; renderPractice(true); });
  });
  if(keep){ try{ window.scrollTo(0,y); }catch(e){} }
  $("#res").onclick = renderResults;
  $("#nx").onclick = () => { if(last) finishPractice(); else { P.idx++; renderPractice(); } };
}
function finishPractice(){
  toTop();
  const P = state.practice, ch = state.chapter, st = state.student;
  const rows = P.subs.map(id => { let c=0, t=0;
    P.qs[id].forEach((q,qi) => q.parts.forEach((p,pi) => { t++; if(gradePart(p, P.ans[id][qi].resp[pi]).ok) c++; }));
    return { id, name: ch.subtopics.find(s=>s.id===id).name, correct:c, total:t }; });
  const score = rows.reduce((t,r)=>t+r.correct,0), total = rows.reduce((t,r)=>t+r.total,0);
  app.innerHTML = `
  <section class="card">
    ${cheer(score===total ? "Purr-fect!" : "Reinforcement done!")}
    <h1>Reinforcement complete</h1>
    <p>You got <b>${score} of ${total}</b> practice questions right.</p>
    ${rows.map(r => `<div class="subrow"><div class="subline"><div class="subname"><small>${r.id}</small>${esc(r.name)}</div><b>${r.correct}/${r.total}</b></div></div>`).join("")}
    <div id="savebox">${saveBanner(null)}</div>
    <p class="muted small" style="margin-top:14px">${score===total ? "Well done. Retake the diagnostic in a few days to check it has stuck." : "Re-read the notes for any subtopic you missed, then retake the diagnostic. Bring the questions you still find confusing to the next tutorial."}</p>
    <div class="nav"><button class="btn ghost" id="home">Back to chapters</button><button class="btn" id="again">Retake diagnostic</button></div>
  </section>`;
  $("#home").onclick = renderHome;
  $("#again").onclick = () => { setProg("diag", ch.id, null); startDiagnostic(ch); };
  send({ type:"Practice", name:st.name, matric:st.matric, group:st.group, chapter: ch.id+" "+ch.title,
         score, total, subtopics: rows.map(r => Object.assign({status:""}, r)), skills:[], weak:[], confidentWrong:"", misconceptions:[], minutes:"" })
    .then(m => { const el = $("#savebox"); if(el) el.innerHTML = saveBanner(m); });
}

/* ---------- Equations in professional (stacked) form, using KaTeX ---------- */
function renderTex(){
  if(!window.katex) return;
  document.querySelectorAll(".formula[data-tex]:not(.tex)").forEach(el => {
    try{
      const parts = el.dataset.tex.split("||").map(t => {
        const m = /^\\text\{([^}]*)\}\s*/.exec(t);
        const label = m ? `<span class="fl">${m[1].trim()}</span>` : "";
        const eq = m ? t.slice(m[0].length) : t;
        return `<span class="fi">${label}<span class="fe">${katex.renderToString(eq, {throwOnError:false, output:"html"})}</span></span>`; });
      el.innerHTML = parts.join(""); el.classList.add("tex");
    }catch(e){}
  });
}
window.renderTex = renderTex;
try{ new MutationObserver(() => renderTex()).observe(document.getElementById("app"), {childList:true, subtree:true}); }catch(e){}

try{ document.getElementById("hcat").innerHTML = CAT.sit("head"); }catch(e){}
try{ applyCats(); }catch(e){}
renderHome();
</script>
